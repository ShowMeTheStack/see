/* The C reference: <locale.h> */
SEE.RefText = Object.assign(SEE.RefText || {}, {
  setlocale: {
    text: 'setlocale(category, locale) selects the locale, the set of national conventions (decimal point, character classes, collation order, time and money formats), for one category or for all of them with LC_ALL. It returns a string naming the new locale, or NULL if the request cannot be honoured, in which case nothing changes.\n\nlocale "C" is the minimal locale every C program starts in. "" asks for the user\'s native locale from the environment. NULL changes nothing and just asks which locale is in effect.\n\nSee only has the "C" locale, so "C" and "" succeed and any other name returns NULL. The returned string belongs to the library: do not modify or free it, and copy it if you need it after another setlocale call.',
    example: `#include <stdio.h>
#include <locale.h>

int main(void)
{
    if (setlocale(LC_ALL, "C") != NULL)
        printf("the C locale is available\\n");
    if (setlocale(LC_ALL, "fr_FR") == NULL)
        printf("fr_FR is not available here\\n");
    return 0;
}
`,
    see: ['localeconv', 'LC_ALL', 'lconv'],
  },
  localeconv: {
    text: 'localeconv() returns a pointer to a struct lconv describing how numbers and money are formatted in the current locale: the decimal point, the thousands separator, the currency symbol and so on.\n\nThe structure belongs to the library and may be overwritten by the next call to localeconv or setlocale. Read it, do not change it.\n\nIn the "C" locale the decimal point is "." and most other strings are empty, with the char fields set to CHAR_MAX meaning "not available".',
    example: `#include <stdio.h>
#include <limits.h>
#include <locale.h>

int main(void)
{
    struct lconv *lc = localeconv();

    printf("decimal point: \\"%s\\"\\n", lc->decimal_point);
    printf("thousands separator: \\"%s\\"\\n", lc->thousands_sep);
    printf("frac_digits %s\\n", lc->frac_digits == CHAR_MAX ? "not available" : "given");
    return 0;
}
`,
    see: ['setlocale', 'lconv'],
  },
  lconv: {
    header: 'locale.h',
    kind: 'type',
    sig: 'struct lconv { char *decimal_point; char *thousands_sep; char *grouping; ... char frac_digits; ... };',
    text: 'struct lconv is the structure localeconv returns, describing the numeric and monetary conventions of the current locale.\n\nThe string fields for ordinary numbers are decimal_point, thousands_sep and grouping. The monetary ones are int_curr_symbol, currency_symbol, mon_decimal_point, mon_thousands_sep, mon_grouping, positive_sign and negative_sign. The char fields (int_frac_digits, frac_digits, p_cs_precedes, p_sep_by_space, n_cs_precedes, n_sep_by_space, p_sign_posn, n_sign_posn) describe where the symbol and sign go; CHAR_MAX means the information is not available.\n\nOpen /usr/include/locale.h to see the full declaration.',
    example: `#include <stdio.h>

int main(void)
{

}
`,

    text: 'LC_ALL, passed to setlocale, sets or queries every category of the locale at once. It is the category most programs use.\n\nsetlocale(LC_ALL, "") switches the whole program to the user\'s preferred conventions; setlocale(LC_ALL, "C") goes back to the defaults.',

/* The C reference: <math.h> */

  HUGE_VAL: {
    text: 'HUGE_VAL is a positive double that the math functions return when the true result is too large to represent. On this machine, as on every IEEE 754 machine, it is positive infinity, which printf shows as inf.\n\nWhen a result overflows, the function returns HUGE_VAL (or -HUGE_VAL for a huge negative result) and sets errno to ERANGE. To detect it reliably, set errno to 0 before the call and look at it afterwards; comparing with HUGE_VAL alone cannot tell an overflow from a genuine infinity that was passed in.\n\nIn C89 HUGE_VAL is the only such constant: there is no INFINITY or NAN macro. Here it expands to a call of a library helper, so it cannot be used to initialise a static variable.',
    example: `#include <stdio.h>

#include <errno.h>

int main(void)
{
    double r;

    errno = 0;
    r = exp(1000.0);
    if (errno == ERANGE && r == HUGE_VAL)
        printf("exp(1000) overflowed: %g\\n", r);
    printf("-HUGE_VAL prints as %g\\n", -HUGE_VAL);
    return 0;
}
`,

// ==== ide/ref/operators.js ====
/* The C reference: operators and punctuators */
SEE.RefText = Object.assign(SEE.RefText || {}, {
  precedence: {
    group: 'Operators',
    sig: 'from tightest to loosest binding',
    text: 'Precedence decides how an expression without parentheses is grouped; associativity decides the grouping of operators at the same level. From tightest to loosest:\n\n1. Postfix, left to right: a[i]  f(x)  s.m  p->m  x++  x--\n2. Unary, right to left: ++x  --x  &x  *p  +x  -x  ~x  !x  sizeof  (type)x\n3. Multiplicative, left to right: *  /  %\n4. Additive, left to right: +  -\n5. Shift, left to right: <<  >>\n6. Relational, left to right: <  <=  >  >=\n7. Equality, left to right: ==  !=\n8. Bitwise AND: &\n9. Bitwise exclusive OR: ^\n10. Bitwise OR: |\n11. Logical AND: &&\n12. Logical OR: ||\n13. Conditional, right to left: ?:\n14. Assignment, right to left: =  +=  -=  *=  /=  %=  <<=  >>=  &=  ^=  |=\n15. Comma, left to right: ,\n\nThe surprises are the bitwise operators, which bind more loosely than ==: x & 1 == 0 means x & (1 == 0). Also *p++ is *(p++), not (*p)++, and a << 1 + 1 shifts by 2. When in doubt, add parentheses; they cost nothing.\n\nPrecedence is not order of evaluation. In f() + g() * h() the multiplication is grouped first, but the three calls may happen in any order. Only &&, ||, ?: and the comma operator promise an order (see "sequence point").',
    example: `#include <stdio.h>

int main(void)
{
    int x = 6;
    int a[] = { 10, 20, 30 };
    int *p = a;
    int v;

    printf("2 + 3 * 4 = %d\\n", 2 + 3 * 4);
    printf("x & 1 == 0 -> %d, (x & 1) == 0 -> %d\\n", x & (1 == 0), (x & 1) == 0);
    v = *p++;
    printf("*p++ gave %d and p now points at %d\\n", v, *p);
    printf("1 << 1 + 1 = %d\\n", 1 << (1 + 1));
    return 0;
}
`,
    see: ['sequence point', '?:', ',', '&', '++'],
  },
  '+': {
    group: 'Operators',
    sig: 'a + b',
    text: 'a + b adds two numbers. Both operands first go through the usual arithmetic conversions: char and short become int, and if one side is double the other becomes double too, so 1 + 2.5 is 3.5.\n\nSigned integer overflow (INT_MAX + 1) is undefined behaviour; unsigned addition wraps around.\n\nIt also does pointer arithmetic: p + n, with p pointing into an array, points n elements further on, not n bytes. The result must stay inside the array or one past its end. Two pointers cannot be added.',
    example: `#include <stdio.h>

int main(void)
{
    int a[] = { 10, 20, 30, 40 };
    int *p = a + 2;

    printf("1 + 2.5 = %g\\n", 1 + 2.5);
    printf("'A' + 2 = %d = '%c'\\n", 'A' + 2, 'A' + 2);
    printf("*(a + 2) = %d, *p = %d\\n", *(a + 2), *p);
    return 0;
}
`,
    see: ['-', '+=', '++', 'usual arithmetic conversions', 'pointer'],
  },
  '-': {
    group: 'Operators',
    sig: 'a - b',
    text: 'a - b subtracts. With numbers, the usual arithmetic conversions apply first. With unsigned types the result wraps around instead of going negative: 2u - 3u is 4294967295, a common trap with size_t values such as strlen results.\n\np - n moves a pointer back n elements. p - q, with both pointing into the same array, gives the number of elements between them as a ptrdiff_t.',
    example: `#include <stdio.h>
#include <string.h>

int main(void)
{
    const char *s = "hello world";
    const char *space = strchr(s, ' ');

    printf("10 - 3 = %d\\n", 10 - 3);
    printf("the space is %d characters in\\n", (int)(space - s));
    printf("2u - 3u = %u\\n", 2u - 3u);
    return 0;
}
`,
    see: ['+', 'unary -', 'ptrdiff_t', '-='],
  },
  '*': {
    group: 'Operators',
    sig: 'a * b',
    text: 'a * b multiplies two numbers after the usual arithmetic conversions.\n\nThe product of two ints is an int, so it can overflow even when you store it in a wider or floating type: in double d = 100000 * 100000; the multiplication overflows before the conversion. Convert one operand first: 100000.0 * 100000.\n\nThe same symbol in front of a single operand is the dereference operator; see "unary *". In a declaration, int *p, it marks a pointer.',
    example: `#include <stdio.h>

int main(void)
{
    int w = 7, h = 6;
    double big = 100000.0 * 100000;

    printf("area %d\\n", w * h);
    printf("100000 * 100000 = %.0f\\n", big);
    return 0;
}
`,
    see: ['/', '*=', 'unary *', 'usual arithmetic conversions'],
  },
  '/': {
    group: 'Operators',
    sig: 'a / b',
    text: 'a / b divides. If both operands are integers the result is an integer, truncated toward zero: 7 / 2 is 3 and -7 / 2 is -3. If either is floating, the division is in floating point: 7 / 2.0 is 3.5.\n\nThis catches everyone once: double avg = sum / count; with int sum and count throws the fraction away before the assignment. Write (double)sum / count.\n\nInteger division by zero is undefined behaviour; in See it stops the program with "integer division by zero" (SIGFPE). Floating division by zero gives inf or nan.',
    example: `#include <stdio.h>

int main(void)
{
    int sum = 17, count = 4;

    printf("7 / 2 = %d, -7 / 2 = %d, 7 / 2.0 = %g\\n", 7 / 2, -7 / 2, 7 / 2.0);
    printf("int average %d, real average %g\\n", sum / count, (double)sum / count);
    return 0;
}
`,
    see: ['%', '*', '(type)', 'SIGFPE'],
  },
  '%': {
    group: 'Operators',
    sig: 'a % b',
    text: 'a % b is the remainder of the integer division a / b, so that (a / b) * b + a % b == a. Both operands must be integers; for doubles use fmod.\n\nThe sign of the result follows a: 7 % 3 is 1 and -7 % 3 is -1 (C89 allowed either sign for negative operands; every modern compiler truncates toward zero as here). So x % 2 == 1 is false for negative odd numbers; test x % 2 != 0.\n\nCommon uses: n % 10 is the last decimal digit, i % n wraps an index around a circular buffer, and a % b == 0 tests divisibility. b must not be 0.',
    example: `#include <stdio.h>

int main(void)
{
    int n = 1234, sum = 0;

    while (n > 0) {
        sum += n % 10;
        n /= 10;
    }
    printf("digit sum of 1234 = %d\\n", sum);
    printf("7 %% 3 = %d, -7 %% 3 = %d\\n", 7 % 3, -7 % 3);
    return 0;
}
`,
    see: ['/', 'fmod', '%='],
  },
  'unary +': {
    group: 'Operators',
    sig: '+a',
    text: 'Unary + returns the value of its operand after integer promotion. It does nothing else, and exists mostly for symmetry with unary minus, as in +5.\n\nIts one observable effect: +c for a char c has type int.',
    example: `#include <stdio.h>

int main(void)
{
    char c = 'x';

    printf("sizeof c = %d, sizeof +c = %d\\n", (int)sizeof c, (int)sizeof +c);
    return 0;
}
`,
    see: ['unary -', 'integer promotion'],
  },
  'unary -': {
    group: 'Operators',
    sig: '-a',
    text: 'Unary - negates its operand after integer promotion.\n\nNegating INT_MIN overflows, which is undefined behaviour, because there is no positive int that large. Negating an unsigned value gives the wrap-around complement: -1u is UINT_MAX.\n\nA negative number literal such as -5 is really unary minus applied to the constant 5.',
    example: `#include <stdio.h>

int main(void)
{
    int a = 5;
    double d = -2.5;

    printf("-a = %d, -d = %g, -1u = %u\\n", -a, -d, -1u);
    return 0;
}
`,
    see: ['-', 'INT_MIN', "two's complement"],
  },
  '<': {
    group: 'Operators',
    sig: 'a < b',
    text: 'a < b is 1 if a is less than b and 0 otherwise. The result is an int.\n\nThe usual arithmetic conversions apply first, which gives a famous trap: comparing a negative int with an unsigned value converts the int to unsigned, so -1 < 1u is 0 (false). The same happens with sizeof and strlen results, which are unsigned.\n\nComparisons do not chain: 1 < x < 5 means (1 < x) < 5, which is always true since 0 and 1 are both less than 5. Write 1 < x && x < 5. Pointers may be compared only when they point into the same array.',
    example: `#include <stdio.h>

int main(void)
{
    int x = 10;

    printf("3 < 4 is %d\\n", 3 < 4);
    printf("1 < x < 5 is %d, but 1 < x && x < 5 is %d\\n", (1 < x) < 5, 1 < x && x < 5);

}
`,
    see: ['>', '<=', '>=', 'usual arithmetic conversions', '&&'],
  },
  '>': {
    group: 'Operators',
    sig: 'a > b',
    text: 'a > b is 1 if a is greater than b and 0 otherwise. The same rules as < apply: the usual arithmetic conversions first (watch signed against unsigned), and no chaining.\n\nTo compare strings use strcmp; > on two char pointers compares their addresses.',
    example: `#include <stdio.h>

    see: ['<', '>=', 'strcmp'],
  },
  '<=': {
    group: 'Operators',

    example: `#include <stdio.h>

  '==': {
    group: 'Operators',
    sig: 'a == b',
    text: 'a == b is 1 if the two values are equal and 0 otherwise.\n\nDo not confuse it with =, which assigns: if (x = 0) sets x to 0 and is always false. See warns about an assignment used as a condition.\n\n== compares values, not contents: on two strings (char pointers) it asks whether they are at the same address, so use strcmp(a, b) == 0. Structures cannot be compared with == at all. And computed floating-point values are rarely exactly equal; compare with a tolerance.',

    example: `#include <stdio.h>

    example: `#include <stdio.h>

  '&': {

    sig: 'a & b',

`,

  },
  '^': {
    group: 'Operators',
    sig: 'a ^ b',

    example: `#include <stdio.h>

// ==== ide/ref/setjmp.js ====
/* The C reference: <setjmp.h> */
SEE.RefText = Object.assign(SEE.RefText || {}, {
  jmp_buf: {
    text: 'jmp_buf is the array type that setjmp fills in and longjmp reads: a snapshot of where the program was, so that it can come back there later. Here it is an array of 6 ints holding a check word, the depth of the call stack, the stack pointer, the frame pointer and the address to resume at.\n\nBecause it is an array type, passing a jmp_buf to a function passes a pointer to it, which is why setjmp(env) can fill it in without an &.\n\nThe saved state is only valid while the function that called setjmp is still running. Once that function returns, its stack frame is gone and a longjmp to the jmp_buf is undefined behaviour.',
    example: `#include <stdio.h>
#include <setjmp.h>

static jmp_buf env;

int main(void)
{
    printf("a jmp_buf here is %d bytes\\n", (int)sizeof(jmp_buf));
    if (setjmp(env) == 0)
        printf("snapshot taken\\n");
    return 0;
}
`,
    see: ['setjmp', 'longjmp'],
  },
  setjmp: {
    text: 'setjmp(env) saves the current point of execution in env and returns 0. Later, longjmp(env, val) makes that same setjmp call return a second time, now with the value val. So the code after setjmp must look at the return value to know whether it is running for the first time or has just jumped back.\n\nThe standard only allows setjmp in a few places: as the whole controlling expression of if, switch, while or do, compared with a constant (setjmp(env) == 0), negated with !, or as a whole expression statement. Do not store its result with = in a larger expression.\n\nLocal variables of the calling function that were changed between setjmp and longjmp have indeterminate values after the jump unless they are declared volatile.\n\nIn See you can watch it happen: after longjmp the call stack shrinks back to the function that called setjmp, and the frames in between disappear from the memory picture without ever returning.',
    example: `#include <stdio.h>
#include <setjmp.h>

static jmp_buf on_error;

static int divide(int a, int b)
{
    if (b == 0)
        longjmp(on_error, 1);
    return a / b;
}

int main(void)
{
    if (setjmp(on_error) == 0) {
        printf("10 / 2 = %d\\n", divide(10, 2));
        printf("10 / 0 = %d\\n", divide(10, 0));
        printf("never printed\\n");
    } else {
        printf("caught a division by zero\\n");
    }
    return 0;
}
`,
    see: ['longjmp', 'jmp_buf', 'stack frame', 'volatile'],
  },
  longjmp: {
    text: 'longjmp(env, val) jumps back to the setjmp call that filled env, throwing away every stack frame created since. That setjmp then returns val. If val is 0 it returns 1 instead, so the code can always tell a jump from the first return.\n\nlongjmp never returns. It is C\'s nearest thing to throwing an exception: a deeply nested function can give up and land straight back in an error handler.\n\nThe function that called setjmp must still be active. Jumping to a jmp_buf whose function has already returned is undefined behaviour, as is jumping out of a signal handler that interrupted library code. Anything the skipped functions allocated with malloc or opened with fopen is not cleaned up for you.',
    example: `#include <stdio.h>
#include <setjmp.h>

static jmp_buf env;

static void depth(int n)
{
    printf("going down: %d\\n", n);
    if (n == 3)
        longjmp(env, n * 10);
    depth(n + 1);
    printf("not reached\\n");
}

int main(void)
{
    int r = setjmp(env);

    if (r == 0)
        depth(1);
    else
        printf("back in main with %d\\n", r);
    return 0;
}
`,
    see: ['setjmp', 'jmp_buf', 'exit'],
  },
});

    text: 'signal(sig, func) chooses what happens when signal number sig arrives. func is either SIG_DFL (the default action, usually ending the program), SIG_IGN (ignore the signal) or a pointer to your own handler, a function taking the signal number as an int and returning nothing.\n\nIt returns the previous setting for that signal, or SIG_ERR if the request failed, for example for a signal number that does not exist. The declaration looks frightening because signal both takes and returns a pointer to a function; with typedef void (*handler)(int); it reads handler signal(int sig, handler func).\n\nA handler should do very little: setting a variable of type volatile sig_atomic_t is the one thing the standard fully allows. Calling printf or malloc from a handler is not safe in general. When the handler is entered the setting may be reset to SIG_DFL, so a handler that wants to stay installed calls signal again.',
    example: `#include <stdio.h>
#include <signal.h>

static volatile sig_atomic_t seen = 0;

static void on_signal(int sig)
{
    seen = sig;
}

int main(void)
{
    if (signal(SIGINT, on_signal) == SIG_ERR) {
        printf("could not install the handler\\n");
        return 1;
    }
    raise(SIGINT);
    printf("the handler saw signal %d\\n", (int)seen);
    return 0;
}
`,
    see: ['raise', 'SIG_DFL', 'SIG_IGN', 'SIG_ERR', 'sig_atomic_t'],
  },
  raise: {
    text: 'raise(sig) sends signal sig to the program itself. It returns 0 on success and non-zero on failure.\n\nWhat happens next depends on the setting made with signal: the handler runs and then raise returns, or the signal is ignored, or the default action happens, which for most signals ends the program. abort() is in effect raise(SIGABRT).\n\nraise is the portable way to try out a signal handler without waiting for a real event.',
    example: `#include <stdio.h>
#include <signal.h>

static volatile sig_atomic_t count = 0;

static void handler(int sig)
{
    (void)sig;
    count++;
    signal(SIGTERM, handler);
}

int main(void)
{
    signal(SIGTERM, handler);
    raise(SIGTERM);
    raise(SIGTERM);
    signal(SIGTERM, SIG_IGN);
    raise(SIGTERM);
    printf("handled %d times, the third was ignored\\n", (int)count);
    return 0;
}
`,
    see: ['signal', 'abort', 'SIGABRT'],
  },
  sig_atomic_t: {
    text: 'sig_atomic_t is an integer type that can be read and written in one indivisible step, even when a signal arrives in the middle of the program. Here it is an int.\n\nDeclare a variable shared between a signal handler and the rest of the program as volatile sig_atomic_t. volatile tells the compiler that the value can change behind its back, so it is read from memory every time. Only store small values in it; the standard guarantees at least 0 to 127.',
    example: `#include <stdio.h>
#include <signal.h>

static volatile sig_atomic_t stop = 0;

static void on_term(int sig)
{
    (void)sig;
    stop = 1;
}

int main(void)
{
    int steps = 0;

    signal(SIGTERM, on_term);
    while (!stop) {
        steps++;
        if (steps == 5)
            raise(SIGTERM);
    }
    printf("stopped after %d steps\\n", steps);
    return 0;
}
`,
    see: ['signal', 'volatile'],
  },
  SIG_DFL: {
    text: 'SIG_DFL, passed as the handler to signal, restores the default action for a signal. For the signals in C89 the default is to end the program abnormally: SIGINT, SIGTERM, SIGABRT, SIGFPE, SIGSEGV and SIGILL all terminate.\n\nIt is a function pointer value that no real function has, so it can be compared with what signal returns.',
    example: `#include <stdio.h>
#include <signal.h>

static void mine(int sig)
{
    (void)sig;
}

int main(void)
{
    void (*old)(int);

    signal(SIGINT, mine);
    old = signal(SIGINT, SIG_DFL);
    printf("previous handler was %s\\n", old == mine ? "mine" : "something else");
    printf("SIGINT is back to the default action\\n");
    return 0;
}
`,
    see: ['signal', 'SIG_IGN', 'SIG_ERR'],
  },
  SIG_ERR: {
    text: 'SIG_ERR is the value signal returns when it cannot do what was asked, for example for a signal number that does not exist. Always compare the result of signal with SIG_ERR rather than with NULL.\n\nNever pass SIG_ERR to signal yourself; it is only ever a return value.',
    example: `#include <stdio.h>

  SIG_IGN: {

    example: `#include <stdio.h>

    text: 'SIGINT (2) is the interactive attention signal: on a terminal it is what Ctrl+C sends. Its default action ends the program.\n\nA program that wants to finish cleanly on Ctrl+C installs a handler that sets a volatile sig_atomic_t flag, and its main loop checks the flag.',
    example: `#include <stdio.h>

static void on_int(int sig)

`,

    example: `#include <stdio.h>

static volatile sig_atomic_t quit = 0;

static void on_term(int sig)
{

int main(void)

`,

// ==== ide/ref/stdarg.js ====
/* The C reference: <stdarg.h> */
SEE.RefText = Object.assign(SEE.RefText || {}, {
  va_list: {
    text: 'va_list is the type of the cursor that walks through the extra arguments of a function declared with ... such as int sum(int n, ...).\n\nOn this machine the arguments of a call sit one after another on the stack, in order, the first at the lowest address, each rounded up to a multiple of 4 bytes. An int takes 4 bytes, a double 8. So a va_list is simply a char pointer: va_start points it just past the last named argument, and each va_arg reads a value there and moves it on by that value\'s rounded size. Open the function\'s stack frame in See\'s memory picture and you can see the arguments lined up above it.\n\nNothing records how many extra arguments there are or what types they have. The function must find out some other way: a count passed first, a format string like printf\'s, or a sentinel value at the end.\n\nTo pass the list on to another function, such as vprintf, pass the va_list itself.',
    example: `#include <stdio.h>
#include <stdarg.h>

static int sum(int count, ...)
{
    va_list ap;
    int total = 0;

    va_start(ap, count);
    while (count-- > 0)
        total += va_arg(ap, int);
    va_end(ap);
    return total;
}

int main(void)
{
    printf("%d\\n", sum(4, 10, 20, 30, 40));
    return 0;
}
`,
    see: ['va_start', 'va_arg', 'va_end', 'vprintf', 'stack frame'],
  },
  va_start: {
    text: 'va_start(ap, last) gets ap ready to read the unnamed arguments. last must be the name of the last named parameter, the one just before the ... in the declaration.\n\nIt works by taking the address of last on the stack and stepping past it, which is why last must not be declared register and should not be a type that is promoted, such as char, short or float.\n\nEvery va_start must be matched by a va_end in the same function before it returns.',
    example: `#include <stdio.h>
#include <stdarg.h>

static void show(const char *label, ...)
{
    va_list ap;
    const char *s;

    va_start(ap, label);
    printf("%s:", label);
    while ((s = va_arg(ap, const char *)) != NULL)
        printf(" %s", s);
    va_end(ap);
    printf("\\n");
}

int main(void)
{
    show("fruit", "apple", "pear", "plum", (const char *)NULL);
    return 0;
}
`,
    see: ['va_arg', 'va_end', 'va_list'],
  },
  va_arg: {
    text: 'va_arg(ap, type) returns the next unnamed argument, taking it to have the given type, and moves ap past it.\n\nThe type must be the type the argument has after the default argument promotions, because that is what the caller actually put on the stack: char and short arrive as int, float arrives as double. va_arg(ap, char) or va_arg(ap, float) reads the wrong number of bytes.\n\nIf the type does not match what was passed, or you read past the last argument, the behaviour is undefined: you get whatever bytes happen to be on the stack. A classic bug is passing 5 where the function reads a double; pass 5.0.',
    example: `#include <stdio.h>
#include <stdarg.h>

static double average(int n, ...)
{
    va_list ap;
    double total = 0;
    int i;

    va_start(ap, n);
    for (i = 0; i < n; i++)
        total += va_arg(ap, double);
    va_end(ap);
    return total / n;
}

int main(void)
{
    float f = 2.5f;

    printf("%g\\n", average(3, 1.0, 2.0, (double)f));
    return 0;
}
`,
    see: ['va_start', 'va_list', 'integer promotion'],
  },
  va_end: {
    text: 'va_end(ap) finishes using ap. It must be called before the function that called va_start returns.\n\nOn this machine it does nothing, but on others va_start may set up something that va_end has to undo, so portable code always calls it. After va_end, ap may be started again with va_start to walk the arguments a second time.',
    example: `#include <stdio.h>
#include <stdarg.h>

static int largest(int n, ...)
{
    va_list ap;
    int i, best, v;

    va_start(ap, n);
    best = va_arg(ap, int);
    for (i = 1; i < n; i++) {
        v = va_arg(ap, int);
        if (v > best)
            best = v;
    }
    va_end(ap);
    return best;
}

int main(void)
{
    printf("largest: %d\\n", largest(5, 3, 9, -2, 7, 4));
    return 0;
}
`,
    see: ['va_start', 'va_arg'],
  },
});

  ptrdiff_t: {
    header: 'stddef.h',
    text: 'ptrdiff_t is the signed integer type of the result of subtracting two pointers. Here it is int.\n\nSubtracting pointers counts elements, not bytes: if p points at a[7] and q at a[2], p - q is 5 whatever the element type. Both pointers must point into the same array (or one past its end); subtracting unrelated pointers is undefined behaviour.\n\nC89 has no printf conversion for ptrdiff_t; convert it to long and use %ld.',
    example: `#include <stdio.h>

    ptrdiff_t pos = eq - s;

    printf("'=' is at index %ld\\n", (long)pos);
    return 0;
}
`,
    see: ['size_t', 'pointer', '-'],
  },
  size_t: {
    header: 'stddef.h',
    text: 'size_t is the unsigned integer type that sizeof gives, and that the library uses for sizes and counts: strlen returns one, malloc and memcpy take one. Here it is unsigned int, 4 bytes. It is defined in <stddef.h>, <stdio.h>, <stdlib.h>, <string.h> and <time.h>.\n\nBecause it is unsigned it can never be negative, which leads to two classic traps. A loop counting down, for (i = n - 1; i >= 0; i--), never ends since i >= 0 is always true. And strlen(a) - strlen(b) is a huge positive number when b is longer, never a negative one.\n\nC89 has no printf conversion for size_t (%zu came in C99); cast to unsigned long and use %lu.',
    example: `#include <stdio.h>
#include <string.h>

int main(void)
{
    const char *word = "hello";
    size_t i, n = strlen(word);

    for (i = n; i > 0; i--)
        putchar(word[i - 1]);
    printf("\\n%lu characters, sizeof(size_t) = %lu\\n", (unsigned long)n, (unsigned long)sizeof(size_t));
    return 0;
}
`,
    see: ['sizeof operator', 'strlen', 'malloc', 'ptrdiff_t'],
  },
  wchar_t: {
    header: 'stddef.h',
    text: 'wchar_t is an integer type wide enough to hold any character of the largest character set the implementation supports. Here it is long. A wide character constant is written L\'x\' and a wide string L"text".\n\nC89 has very little to do with wide characters: mbtowc, wctomb, mbstowcs and wcstombs in <stdlib.h> convert between multibyte strings and wide ones. In See\'s "C" locale every character is a single byte, so those conversions just copy. See accepts wide character constants such as L\'x\' but not wide string literals; build wide strings with mbstowcs.',
    example: `#include <stdio.h>
#include <stdlib.h>
#include <stddef.h>

{
    wchar_t w[8];
    wchar_t x = L'x';
    size_t i, n;

    for (i = 0; i < n; i++)
        printf("%ld ", (long)w[i]);
    printf("\\nL'x' is %ld; a wchar_t has %d bytes\\n", (long)x, (int)sizeof(wchar_t));

`,
    see: ['mbtowc', 'mbstowcs', 'MB_LEN_MAX'],
  },
  NULL: {
    header: 'stddef.h',
    text: 'NULL is the null pointer constant: a pointer value that points at nothing. Here it is ((void *)0). It is defined in <stddef.h>, <stdio.h>, <stdlib.h>, <string.h>, <time.h> and <locale.h>.\n\nFunctions return NULL to say "no result" or "failed": fopen when a file cannot be opened, malloc when memory runs out, strchr when the character is absent. Always test for it before using the pointer. Dereferencing NULL is undefined behaviour; in See it stops the program with a segmentation fault at the offending line.\n\nNULL is for pointers only. Do not use it for the NUL character \'\\0\' that ends a string, even though both are zero. When passing NULL to a function with variable arguments, such as a terminator for a va_arg loop, cast it to the pointer type expected.',
    example: `#include <stdio.h>
#include <string.h>

{
    const char *s = "hello";
    const char *p = strchr(s, 'z');

    if (p == NULL)
        printf("no 'z' in \\"%s\\"\\n", s);
    p = strchr(s, 'l');
    if (p != NULL)
        printf("first 'l' at index %d\\n", (int)(p - s));
    return 0;
}
`,
    see: ['pointer', 'NUL terminator', 'malloc', 'fopen', 'SIGSEGV'],
  },
  offsetof: {
    header: 'stddef.h',
    text: 'offsetof(type, member) gives the offset in bytes of member from the start of the structure type, as a size_t.\n\nThe compiler may put padding between members so that each one is properly aligned, so the offset is not simply the sum of the sizes of the earlier members. In See\'s memory picture you can see the gaps: in struct { char c; double d; } the double starts at offset 8, not 1.\n\nThe member must not be a bit-field. The definition used here, ((size_t)&((type *)0)->member), pretends there is a structure at address 0; that trick is only allowed inside the implementation, so use the macro rather than writing it out.',

  EOF: {
    text: `A negative int, -1 here, that the input functions return to mean "end of file or error": getchar, getc and fgetc when there is no more input, and scanf when input ends before anything was converted. Some output functions (fputc, fputs, fclose, fflush) also return EOF when they fail.\n\nThe classic trap: getchar returns an int, so that EOF can be told apart from every one of the 256 possible bytes. Storing the result in a char loses that difference: with char c, the byte 255 may compare equal to EOF and end the loop early, or, where char is unsigned, EOF is never seen and the loop never ends. Always use int c.\n\nEOF is not a character stored in the file. To tell end of file from a read error after a loop ends, call feof or ferror. At the terminal, the user signals end of input with Ctrl+D.`,

  printf: {
    text: `Writes text to stdout, converting the arguments after the format according to the conversion specifications in it. It returns the number of characters written, or a negative value on an output error. Ordinary characters in the format are copied as they are; %% writes one %.\n\nEach specification has the form %[flags][width][.precision][length]conversion. The conversions: d and i print an int in decimal; u, o, x and X print an unsigned int in decimal, octal, hex with a-f, and hex with A-F; c prints an int as a character; s prints a string (a char * to a NUL-terminated array); f prints a double as [-]ddd.dddddd; e and E print it as d.dddddde+dd; g and G use e style when the exponent is below -4 or at least the precision, and f style otherwise, without trailing zeros; p prints a pointer (a void *); n prints nothing but stores the number of characters written so far into the int * argument.\n\nFlags: - left-justifies within the width (the default is right). + always prints a sign for signed conversions. A space puts a space where a plus sign would go. 0 pads numbers with leading zeros instead of spaces (ignored with - and, for integers, when a precision is given). # selects an alternative form: a leading 0 for o, 0x or 0X for non-zero x and X, and for e, f and g a decimal point always (g also keeps its trailing zeros).\n\nWidth is the minimum number of characters; the output is padded but never cut. Precision means: the minimum number of digits for d, i, o, u, x, X (zeros are added; a value of 0 with precision 0 prints nothing); the digits after the point for e, E and f (default 6); the significant digits for g and G; the maximum number of characters taken from a string for s. Either can be * to take the value from an int argument before the value being printed; a negative * width means - with that width. Length: h makes d, i, o, u, x, X take a short (and n a short *), l makes them take a long (and n a long *), and L makes e, f, g take a long double. There is no length for double: %f prints both float and double, because a float argument is promoted to double.\n\nThe arguments must match the conversions in number and type. printf cannot check; a mismatch such as %d with a double, %s with an int, or too few arguments is undefined behavior and prints garbage or crashes. Never pass user text as the format (printf(s)); write printf("%s", s). In See, %s with a NULL pointer prints (null) with a warning, and %p prints a pointer in hex, or (nil) for NULL.`,
    example: `#include <stdio.h>

int main(void)
{

    const char *name = "Ada";

    printf("[%d] [%5d] [%-5d] [%05d] [%+d] [%.4d]\\n", n, n, n, n, n, n);
    printf("[%x] [%X] [%#x] [%o] [%#o] [%u]\\n", 255, 255, 255, 8, 8, 3000000000u);

  // ---- formatted input ---------------------------------------------------------------------------
  scanf: {
    text: `Reads from stdin, converting text according to the format and storing the results through the pointer arguments. It returns the number of items converted and stored, which can be less than asked for, or EOF if input ended (or a read error occurred) before the first conversion. Always check the return value: if (scanf("%d", &n) != 1) means no number was read, and n is unchanged.\n\nThe arguments are pointers: scanf("%d", &n), not scanf("%d", n). For a char array, its name is already a pointer: scanf("%s", word). Forgetting the & is the classic crash; in See it shows up as a write to a strange address.\n\nWhite space: a space, tab or newline in the format matches any amount of white space in the input, including none. Every conversion except %c, %[ and %n skips leading white space by itself. Any other character in the format must match the next input character exactly, or scanf stops there. So "%d,%d" reads "3,4" but stops at "3 ,4"; "%d ,%d" accepts both.\n\nConversions: %d a decimal int; %i an int in decimal, octal (leading 0) or hex (leading 0x); %u, %o, %x an unsigned int in decimal, octal or hex; %e, %f, %g a float (all three read any floating form); %s a word, up to the next white space, stored with a NUL; %c exactly one character (or as many as the width), without a NUL and without skipping white space; %p a pointer; %n stores the number of characters read so far and does not count as an item; %% matches a %. Length: h before d, i, u, o, x, n means short *; l means long * and, before e, f, g, double *; L before e, f, g means long double *. Using %f for a double is a common mistake: a double needs %lf (in printf, %f is right for both).\n\nA width limits how many characters a conversion reads: always give one with %s and %[ so the input cannot overflow the array, for example %19s for char word[20]. A * after % reads and discards: "%*d" skips a number. A scanset %[...] reads the longest run of characters in the set and stores them with a NUL: %[a-z] reads lowercase letters, %[^,] reads everything up to a comma, %[^\\n] reads the rest of the line. To put ] in the set, write it first: %[]abc] or %[^]].\n\nWhen a conversion fails, the offending character stays in the input. scanf("%d", &n) on the input "abc" returns 0 and leaves "abc" there, so a loop that retries without discarding it spins forever. Mixing scanf with fgets has a similar trap: the newline after a number is still waiting, so the next fgets reads an empty line. Reading whole lines with fgets and converting them with sscanf avoids both.`,
    example: `#include <stdio.h>

int main(void)
{
    int age, r;

    r = scanf("%19s %d", name, &age);
    if (r == 2)

        printf("\\nno input\\n");

}

  fseek: {
    text: `Moves the position of the stream for the next read or write. The new position is offset bytes from the start of the file (whence SEEK_SET), from the current position (SEEK_CUR) or from the end (SEEK_END). It returns 0 on success and non-zero on failure, for example for a position before the start (EINVAL) or a stream that is not a file, such as stdin (EBADF).\n\nA successful fseek clears the end-of-file indicator and discards any characters pushed back with ungetc. It is also what you must call (or fflush) when a stream opened with + switches from writing to reading or back.\n\nFor files opened in text mode, the standard only promises that fseek works with an offset of 0 or with a value returned by ftell and SEEK_SET; arbitrary byte offsets are portable only in binary mode. Seeking past the end is allowed; a write there extends the file.`,

    text: `Returns non-zero if the end-of-file indicator of the stream is set, and 0 otherwise. The indicator is set when a read tries to go past the end of the file, not when the last byte is read.\n\nThat is why while (!feof(fp)) { read; use; } is a classic bug: after the last real item, feof is still 0, the next read fails, and the loop uses the stale value once more. Loop on the result of the read instead (!= EOF, != NULL, == 1) and call feof afterwards to find out why it stopped.`,
    example: `#include <stdio.h>

int main(void)
{
    FILE *fp;
    int x, n = 0;

    fp = fopen("/tmp/feof.txt", "w+");
    if (fp == NULL)
        return 1;
    fputs("1 2 3", fp);
    rewind(fp);
    while (fscanf(fp, "%d", &x) == 1)
        n++;
    if (feof(fp))
        printf("read %d numbers, stopped at end of file\\n", n);
    else if (ferror(fp))
        printf("read error\\n");
    else
        printf("stopped at something that is not a number\\n");
    fclose(fp);
    return 0;
}
`,

  ferror: {
    text: `Returns non-zero if the error indicator of the stream is set, and 0 otherwise. The indicator is set when a read or write fails, for example writing to a stream opened only for reading, and stays set until clearerr or rewind.\n\nAfter a loop that stops on EOF, check ferror to make sure the data was not cut short by an error. For output, checking ferror (or the result of fclose) before reporting success catches problems such as a full disk.`,
    example: `#include <stdio.h>

{
    FILE *fp;

    fp = fopen("/tmp/ferror.txt", "w");

    fp = fopen("/tmp/ferror.txt", "r");
    if (fp == NULL)
        return 1;
    fputc('x', fp);
    printf("ferror after writing to a read-only stream: %d\\n", ferror(fp) != 0);
    clearerr(fp);
    printf("after clearerr: %d\\n", ferror(fp));
    fclose(fp);
    return 0;
}
`,
    see: ['feof', 'clearerr', 'perror'],
  },
  perror: {
    text: `Writes a message for the current value of errno to stderr: the string s, a colon and a space, the text that strerror(errno) gives, and a newline. If s is NULL or empty, only the message is written. For example perror("data.txt") might print data.txt: No such file or directory.\n\nCall it right after the call that failed, because other library calls may change errno. Only call it when a function has reported failure (fopen returned NULL, for example): errno is not reset on success, so its value at other times is meaningless.`,
    example: `#include <stdio.h>

{
    FILE *fp;

    fp = fopen("/tmp/no-such-dir/data.txt", "r");

`,

  atof: {

  atoi: {
    text: `Converts the beginning of the string nptr to an int: it skips leading white space, reads an optional + or - and then decimal digits, and stops at the first character that is not a digit. "42abc" gives 42.\n\nIt cannot report failure: "abc" gives 0, the same as "0", and a number too big for an int is undefined behavior (See gives INT_MAX or INT_MIN). For input you do not control, use strtol, which tells you where the number ended and sets errno to ERANGE on overflow.`,
    example: `#include <stdio.h>

  atol: {
    text: `Converts the beginning of the string nptr to a long, exactly like atoi does for int. Here long and int are both 32 bits, so the results are the same. As with atoi, errors cannot be detected; prefer strtol.`,
    example: `#include <stdio.h>

  strtod: {
    text: `Converts the beginning of the string nptr to a double. It skips leading white space and reads an optional sign, then digits with an optional decimal point and an optional exponent (e or E, an optional sign and digits). If endptr is not NULL, *endptr is set to point at the first character after the number.\n\nIf no number could be read, it returns 0 and sets *endptr to nptr, which is how you detect "no number here": compare the end pointer with the start. If the value is too large, it returns plus or minus HUGE_VAL and sets errno to ERANGE; if it is too small, it returns 0 and may set ERANGE.\n\nCalling strtod repeatedly, each time from the previous end pointer, reads a whole list of numbers out of one string.`,
    example: `#include <stdio.h>
#include <stdlib.h>

int main(void)
{
    const char *s = "1.5 -2.25e1 x";
    char *end;
    double v;

    for (;;) {
        v = strtod(s, &end);
        if (end == s)
            break;
        printf("read %g\\n", v);
        s = end;
    }
    printf("stopped at \\"%s\\"\\n", s);
    return 0;
}
`,
    see: ['atof', 'strtol', 'HUGE_VAL', 'errno'],

  strtol: {
    text: `Converts the beginning of the string nptr to a long in the given base and, if endptr is not NULL, stores in *endptr a pointer to the first character it did not use. Leading white space is skipped and an optional sign is read.\n\nbase can be 2 to 36, where the letters a to z (or A to Z) are the digits 10 to 35, and 16 also accepts a leading 0x. With base 0 the number decides: 0x1F is hexadecimal, 017 is octal and 17 is decimal.\n\nTo check the result properly: set errno = 0 before the call; if *endptr equals nptr no digits were found; if errno is ERANGE the value overflowed and LONG_MAX or LONG_MIN was returned; if **endptr is not '\\0' there was text after the number. Use it instead of atoi when the input might not be a number.`,
    example: `#include <stdio.h>
#include <stdlib.h>
#include <errno.h>

int main(void)
{
    const char *inputs[4] = { "123", "0x1F", "12abc", "99999999999" };
    char *end;
    long v;
    int i;

    for (i = 0; i < 4; i++) {
        errno = 0;
        v = strtol(inputs[i], &end, 0);
        if (end == inputs[i])
            printf("%-12s no number\\n", inputs[i]);
        else if (errno == ERANGE)
            printf("%-12s out of range (got %ld)\\n", inputs[i], v);
        else
            printf("%-12s %ld, rest \\"%s\\"\\n", inputs[i], v, end);

    return 0;

    example: `#include <stdio.h>

  rand: {
    text: `Returns a pseudo-random int from 0 to RAND_MAX (32767). The numbers come from a formula applied to a hidden seed, so the sequence is the same every run unless you call srand first with a different seed; without srand, the seed is 1.\n\nTo get a number from 0 to n - 1, rand() % n is the common idiom; it is slightly uneven when n does not divide RAND_MAX + 1 and fine for games and exercises. For a value from lo to hi: lo + rand() % (hi - lo + 1).\n\nSee uses the sample generator printed in the C standard, a simple linear congruential formula. It is not suitable for anything that needs real unpredictability, such as passwords.`,
    example: `#include <stdio.h>
#include <stdlib.h>

{
    int i;

    srand(2024);
    for (i = 0; i < 5; i++)
        printf("die roll: %d\\n", 1 + rand() % 6);
    return 0;
}
`,

  },
  srand: {
    text: `Sets the seed for rand. The same seed always gives the same sequence, which is useful for testing; a program starts as if srand(1) had been called.\n\nTo get a different sequence on each run, seed with the time once at the start: srand((unsigned)time(NULL)). Call srand only once; calling it before every rand with the time gives the same number again and again within the same second.`,
    example: `#include <stdio.h>

{

    srand(42);
    b = rand();
    printf("same seed, same number: %d %d\\n", a, b);
    return 0;
}
`,

  calloc: {
    text: `Allocates memory for an array of nmemb elements of size bytes each, sets every byte to zero, and returns a pointer to it, or NULL if there is not enough memory (errno is then ENOMEM). The memory is released with free.\n\nCompared with malloc(nmemb * size), calloc clears the memory and checks that the multiplication does not overflow. All-bits-zero is 0 for integer types; on this machine it is also 0.0 and NULL, although C does not promise that everywhere.\n\nIn See's memory picture a calloc block shows as initialized from the start, while a malloc block shows as uninitialized until you write to it.`,
    example: `#include <stdio.h>
#include <stdlib.h>

int main(void)
{
    int *counts;
    int i;

    counts = calloc(5, sizeof *counts);
    if (counts == NULL)
        return EXIT_FAILURE;
    counts[2] = 7;
    for (i = 0; i < 5; i++)
        printf("%d ", counts[i]);
    printf("\\n");
    free(counts);
    return 0;

    see: ['malloc', 'free', 'realloc', 'memset'],
  },
  free: {
    text: `Releases a block of memory that came from malloc, calloc or realloc, so it can be used again. free(NULL) is allowed and does nothing.\n\nAfter free, the pointer still holds the old address but must not be used: reading or writing through it, or freeing it a second time, is undefined behavior. See catches all of these: a double free, freeing a pointer into the middle of a block, freeing a stack address, and any use of the freed block, which the memory picture shows as freed. Setting the pointer to NULL right after free makes accidental reuse easier to spot.\n\nEvery block should be freed exactly once when it is no longer needed. Blocks still allocated when the program ends are leaks; See lists them at exit.`,
    example: `#include <stdio.h>
#include <stdlib.h>
#include <string.h>

int main(void)
{
    char *s;

    s = malloc(16);
    if (s == NULL)
        return EXIT_FAILURE;
    strcpy(s, "temporary");
    printf("%s\\n", s);
    free(s);
    s = NULL;
    free(s);   /* free(NULL) does nothing */
    printf("freed\\n");
    return 0;
}
`,
    see: ['malloc', 'calloc', 'realloc'],
  },
  malloc: {
    text: `Allocates a block of size bytes and returns a pointer to its first byte, or NULL if the memory cannot be found (errno is then ENOMEM). The block stays allocated until you pass the pointer to free; it does not disappear when the function that called malloc returns.\n\nThe contents are not initialized: they hold whatever was there before. See marks the new bytes as uninitialized and warns when you read one before writing it. Use calloc for zeroed memory.\n\nAsk for bytes, not elements: malloc(n * sizeof *p) for n elements of whatever p points to. Always check the result against NULL. In C there is no need to cast the result, since a void * converts to any object pointer; the cast can hide a missing #include <stdlib.h>.\n\nIn See's memory picture each block sits on the heap with an 8-byte header in front of it holding its size, and guard bytes after it, so writing even one byte past the end is caught at once.`,
    example: `#include <stdio.h>
#include <stdlib.h>

int main(void)
{
    int *a;
    int n = 5, i;

    a = malloc(n * sizeof *a);
    if (a == NULL) {
        printf("out of memory\\n");
        return EXIT_FAILURE;
    }
    for (i = 0; i < n; i++)
        a[i] = i * i;
    for (i = 0; i < n; i++)
        printf("%d ", a[i]);
    printf("\\n");
    free(a);
    return 0;
}
`,
    see: ['calloc', 'realloc', 'free', 'sizeof'],
  },
  realloc: {
    text: `Changes the size of the block at ptr to size bytes and returns a pointer to the resized block. The old contents are kept up to the smaller of the two sizes; any new bytes are uninitialized. The block may move: if it cannot grow where it is, realloc allocates a new one, copies the data and frees the old one, so all old pointers into it become invalid.\n\nIf it fails, it returns NULL and the old block is untouched and still yours. So never write p = realloc(p, n): on failure that loses the only pointer to the old block. Use a second variable and assign it back only on success.\n\nrealloc(NULL, size) acts like malloc(size). realloc(ptr, 0) frees the block here and returns NULL. Growing an array by doubling its capacity each time keeps the number of copies small.`,
    example: `#include <stdio.h>
#include <stdlib.h>

int main(void)
{
    int *a = NULL, *bigger;
    int cap = 0, n = 0, i;

    for (i = 1; i <= 10; i++) {
        if (n == cap) {
            cap = cap ? cap * 2 : 2;
            bigger = realloc(a, cap * sizeof *a);
            if (bigger == NULL) {
                free(a);
                return EXIT_FAILURE;
            }
            a = bigger;
            printf("capacity now %d\\n", cap);
        }
        a[n++] = i * 10;
    }
    printf("last element %d of %d\\n", a[n - 1], n);
    free(a);
    return 0;
}
`,
    see: ['malloc', 'free', 'calloc'],
  },
  abort: {
    text: `Ends the program abnormally, at once, by raising the signal SIGABRT. Functions registered with atexit do not run, and output still waiting in buffers may be lost; the status reported to the system means failure.\n\nIf a handler for SIGABRT has been installed with signal, it runs first; if it returns, the program still ends. assert calls abort when its condition is false. See shows where abort was called.`,
    example: `#include <stdio.h>
#include <stdlib.h>
#include <signal.h>

static void on_abort(int sig)
{
    printf("caught signal %d, leaving through exit\\n", sig);
    exit(EXIT_FAILURE);
}

int main(void)
{
    signal(SIGABRT, on_abort);
    printf("something went badly wrong\\n");
    abort();
    printf("never printed\\n");
    return 0;
}
`,
    see: ['exit', 'assert', 'raise', 'signal', 'SIGABRT'],
  },
  atexit: {
    text: `Registers the function func to be called when the program ends normally, by exit or by returning from main. It returns 0 on success and non-zero if the function could not be registered; at least 32 registrations are possible (exactly 32 here).\n\nThe functions run in the reverse order of registration, before the open streams are flushed and closed, so they may still print. They do not run after abort or when the program is stopped by a signal. A registered function takes no arguments and returns nothing.`,
    example: `#include <stdio.h>
#include <stdlib.h>

static void first(void) { printf("registered first, runs last\\n"); }
static void second(void) { printf("registered second, runs first\\n"); }

int main(void)
{
    atexit(first);
    atexit(second);
    printf("main is returning\\n");
    return 0;
}
`,
    see: ['exit', 'abort'],
  },
  exit: {
    text: `Ends the program normally with the given status, from anywhere in the program. First the functions registered with atexit run, in reverse order; then all open streams are flushed and closed; then the status goes back to the system. exit never returns.\n\nUse EXIT_SUCCESS (or 0) for success and EXIT_FAILURE for failure. Returning a value from main is the same as calling exit with it.\n\nOutput still in a buffer is written by exit, but not by abort or a crash, which is why a crashing program can seem to lose its last printf lines. Memory from malloc is reclaimed by the system anyway, though See still lists blocks you never freed.`,
    example: `#include <stdio.h>
#include <stdlib.h>

static void check(int ok)
{
    if (!ok) {
        printf("check failed, stopping\\n");
        exit(EXIT_FAILURE);
    }
    printf("check passed\\n");
}

int main(void)
{
    check(1);
    check(0);
    printf("never printed\\n");
    return 0;
}
`,
    see: ['EXIT_SUCCESS', 'EXIT_FAILURE', 'atexit', 'abort'],
  },
  getenv: {
    text: `Looks up the environment variable called name and returns a pointer to its value, or NULL if there is no such variable. The environment is the list of NAME=value strings the program receives when it starts.\n\nThe returned string belongs to the environment: do not modify it, and copy it if you need to keep it, because a later getenv may reuse the space. See gives programs a small environment with HOME, PATH and USER.`,
    example: `#include <stdio.h>
#include <stdlib.h>

int main(void)
{
    const char *home, *missing;

    home = getenv("HOME");
    missing = getenv("NO_SUCH_VARIABLE");
    printf("HOME = %s\\n", home ? home : "(not set)");
    printf("NO_SUCH_VARIABLE = %s\\n", missing ? missing : "(not set)");
    return 0;
}
`,
    see: ['system'],
  },
  system: {
    text: `Passes the string to the system's command processor (the shell) to run as a command, and returns a value that depends on the system, usually the command's exit status. system(NULL) asks whether a command processor exists: non-zero means yes.\n\nSee has no shell for programs to call, so system(NULL) returns 0 and any command returns -1. Programs that build a command from user input are a classic security hole on real systems, because the input can contain extra commands.`,
    example: `#include <stdio.h>
#include <stdlib.h>

int main(void)
{
    if (system(NULL))
        printf("a shell is available\\n");
    else
        printf("no shell here; system(\\"ls\\") returns %d\\n", system("ls"));
    return 0;
}
`,
    see: ['getenv', 'exit'],
  },
  bsearch: {
    text: `Searches a sorted array for an element that matches *key. base points at the first of nmemb elements of size bytes each, and compar compares the key (first argument) with an array element (second argument), returning negative, zero or positive like strcmp. bsearch returns a pointer to a matching element, or NULL if there is none.\n\nThe array must be sorted in the order compar describes, usually by qsort with the same comparison; otherwise the answer is meaningless. Binary search halves the range at each step, so a million elements take about 20 comparisons. If several elements match, any one of them may be returned.\n\nThe comparison function receives const void pointers: convert them to the real element type inside it.`,
    example: `#include <stdio.h>
#include <stdlib.h>

static int cmp_int(const void *a, const void *b)
{
    int x = *(const int *)a, y = *(const int *)b;
    return (x > y) - (x < y);
}

int main(void)
{
    int a[8] = { 2, 3, 5, 7, 11, 13, 17, 19 };
    int key = 13, other = 4;
    int *p;

    p = bsearch(&key, a, 8, sizeof a[0], cmp_int);
    if (p != NULL)
        printf("%d found at index %d\\n", key, (int)(p - a));
    p = bsearch(&other, a, 8, sizeof a[0], cmp_int);
    printf("%d %s\\n", other, p ? "found" : "not found");
    return 0;
}
`,
    see: ['qsort', 'strcmp'],

  qsort: {

  memcpy: {
    text: `Copies exactly n bytes from the object at s2 to the object at s1 and returns s1. It does not look for a NUL byte and does not stop early: it copies n bytes, whatever they are, so it works for structs, arrays of int and any other data, not only strings.\n\nThe two areas must not overlap. If they might (shifting part of an array along itself, for example), use memmove instead. See warns when it sees memcpy called with overlapping areas, because the result is undefined.\n\nThe destination must have room for n bytes. Pass the size in bytes, which for an array of int is count * sizeof(int), not the count of elements. If the destination is too small, See stops the program at the first byte that falls outside it, and the memory picture shows which object was overrun.`,
    example: `#include <stdio.h>
#include <string.h>

struct point { int x; int y; };

int main(void)
{
    int a[5] = { 1, 2, 3, 4, 5 };
    int b[5];
    struct point p = { 3, 4 }, q;
    int i;

    memcpy(b, a, sizeof a);
    memcpy(&q, &p, sizeof q);
    for (i = 0; i < 5; i++)
        printf("%d ", b[i]);
    printf("\\nq = (%d, %d)\\n", q.x, q.y);
    return 0;
}
`,
    see: ['memmove', 'strcpy', 'memset'],
  },
  memmove: {
    text: `Copies n bytes from s2 to s1 and returns s1, exactly like memcpy, except that the two areas may overlap. The result is as if the n bytes were first copied to a temporary buffer and then to the destination, so nothing is overwritten before it has been read.\n\nUse it to slide elements along inside one array, for example to open a gap for an insertion or to close one after a deletion. When you know the areas are separate, memcpy does the same job.`,
    example: `#include <stdio.h>
#include <string.h>

int main(void)
{
    char s[16] = "abcdef";

    /* open a gap at index 2 by sliding "cdef" and its NUL one place right */
    memmove(s + 3, s + 2, strlen(s + 2) + 1);
    s[2] = 'X';
    printf("%s\\n", s);

    /* close the gap again */
    memmove(s + 2, s + 3, strlen(s + 3) + 1);
    printf("%s\\n", s);
    return 0;
}
`,

  strcpy: {
    text: `Copies the string s2, including its terminating NUL, into the array s1, and returns s1. It copies until it reaches the NUL, so it has no idea how big s1 is: the destination must have room for strlen(s2) + 1 characters.\n\nThis is the classic buffer overflow. char name[8]; strcpy(name, "Christopher"); writes 12 bytes into an 8-byte array. In See the program stops at the first byte past the end of name, and the memory picture shows the overflow; on a real machine the extra bytes silently overwrite whatever lives next to the array.\n\nThe areas must not overlap. To copy at most a limited number of characters, see strncpy, which has traps of its own; a common safe pattern is to check strlen(s2) < sizeof dest before calling strcpy.`,
    example: `#include <stdio.h>

        printf("copied \\"%s\\" (%d bytes with the NUL)\\n", dest, (int)strlen(dest) + 1);

    return 0;
}
`,

  strncpy: {
    text: `Copies at most n characters from s2 into s1 and returns s1. If s2 is shorter than n, the rest of s1 up to n characters is filled with NUL bytes. If s2 has n or more characters, exactly n are copied and no NUL is written.\n\nThat last case is the trap: after strncpy(buf, src, sizeof buf) with a long src, buf is not a string, and printing it or calling strlen on it reads past the end. See warns when strncpy leaves the destination without a NUL. The usual fix is to copy one less and terminate by hand: strncpy(buf, src, sizeof buf - 1); buf[sizeof buf - 1] = '\\0';\n\nstrncpy was designed for fixed-width fields in old file formats, not as a safe strcpy. It also always writes all n bytes, which is wasteful for a large buffer and a short source.`,

  strcat: {

    text: `Splits a string into tokens separated by any of the characters in s2. The first call passes the string in s1; each later call passes NULL to continue where the previous one stopped. Each call returns a pointer to the next token, or NULL when there are no more.\n\nstrtok changes the string: it overwrites each separator that ends a token with a NUL. So the string must be modifiable, an array and not a string literal (strtok("a,b", ",") writes into read-only memory), and the original text is gone afterwards. In See's memory picture you can watch the separators turn into NUL bytes.\n\nIt remembers its position in a hidden static variable, so you cannot interleave two tokenizing loops, and runs of separators are skipped, so empty fields such as the middle of "a,,b" are lost. The separator set may change from one call to the next.`,
    example: `#include <stdio.h>
#include <string.h>

int main(void)
{
    char line[] = "red, green,,blue";
    char *tok;
    int n = 0;

    tok = strtok(line, ", ");

  memset: {

    example: `#include <stdio.h>
#include <string.h>

int main(void)

    int a[3];
    char line[8];

    memset(a, 0, sizeof a);

    memset(a, 1, sizeof a);
    printf("%d (not 1)\\n", a[0]);

`,

  strerror: {
    text: `Returns a pointer to a message describing the error number errnum, usually a value of errno, such as "No such file or directory" for ENOENT. Unknown numbers give "Unknown error".\n\nThe string belongs to the library: do not modify or free it. Save errno right after the failing call, because any later library call may change it. perror is a shorter way to print the message for errno to stderr.`,
    example: `#include <stdio.h>
#include <string.h>
#include <errno.h>

int main(void)
{
    FILE *fp;

    fp = fopen("/no/such/file.txt", "r");

  strlen: {

`,

  },

/* The C reference: <time.h> */
SEE.RefText = Object.assign(SEE.RefText || {}, {
  clock_t: {
    text: 'clock_t is the arithmetic type that clock() returns: processor time measured in "clock ticks". Here it is a long.\n\nDivide a difference of two clock_t values by CLOCKS_PER_SEC to get seconds, and do the division in floating point, (double)(end - start) / CLOCKS_PER_SEC, or a short interval rounds down to 0.',
    example: `#include <stdio.h>
#include <time.h>

int main(void)
{
    clock_t start = clock();
    long i, sum = 0;

        sum += i % 7;
    printf("sum %ld after %ld ticks\\n", sum, (long)(clock() - start));
    return 0;
}
`,
    see: ['clock', 'CLOCKS_PER_SEC', 'time_t'],
  },
  time_t: {
    text: 'time_t is the arithmetic type that holds a calendar time, as returned by time(). Here it is a long counting the seconds since 1 January 1970, 00:00:00 UTC (the Unix epoch), but the C standard does not promise that, so portable code converts with localtime or gmtime and subtracts with difftime.\n\nA 32-bit signed time_t runs out in January 2038.',
    example: `#include <stdio.h>
#include <time.h>

{
    time_t t = 0;

    printf("time_t 0 is %s", asctime(gmtime(&t)));

    return 0;
}
`,
    see: ['time', 'difftime', 'gmtime', 'localtime', 'tm'],
  },

    text: 'struct tm holds a calendar time broken into its parts. localtime and gmtime fill one in; mktime, asctime and strftime read one.\n\nThe fields have surprising origins: tm_mon counts months from 0 (January is 0, December 11), tm_year counts years since 1900 (2024 is 124), tm_wday counts days since Sunday (0 to 6) and tm_yday days since 1 January (0 to 365). tm_mday is the only one that starts at 1. tm_sec can be 60 for a leap second. tm_isdst is positive when daylight saving time is in effect, 0 when it is not and negative when unknown.\n\nWhen you build one yourself, set every field (struct tm t = {0}; is a quick way) and set tm_isdst to -1 to let mktime decide. In See\'s memory picture a struct tm is nine ints in a row, 36 bytes.',
    example: `#include <stdio.h>
#include <time.h>

int main(void)
{
    struct tm t = {0};

    t.tm_year = 2000 - 1900;
    t.tm_mon = 11;
    t.tm_mday = 25;
    t.tm_isdst = -1;

    printf("25 December 2000 was day %d of the year, weekday %d\\n", t.tm_yday + 1, t.tm_wday);

    see: ['mktime', 'localtime', 'gmtime', 'strftime', 'asctime'],
  },
  CLOCKS_PER_SEC: {
    text: 'CLOCKS_PER_SEC is the number of clock_t ticks in one second of processor time. Here it is 1000000, so one tick is a microsecond.\n\nIt is a long, so (end - start) / CLOCKS_PER_SEC is an integer division that truncates. Convert to double first for a fractional number of seconds.',
    example: `#include <stdio.h>
#include <time.h>

int main(void)
{
    clock_t start = clock();
    double x = 0;
    int i;

    for (i = 1; i < 20000; i++)
        x += 1.0 / i;

    see: ['clock', 'clock_t'],

  clock: {
    text: 'clock() returns the processor time the program has used so far, in clock_t ticks, or (clock_t)-1 if it is not available.\n\nThe value at program start is not necessarily 0, so only the difference between two calls means anything. Divide that difference by CLOCKS_PER_SEC for seconds.\n\nIt measures time spent computing, not time on the wall clock: a program waiting for input uses almost none. For calendar time use time().',
    example: `#include <stdio.h>

  difftime: {

`,
    see: ['time', 'time_t', 'mktime'],
  },
  mktime: {
    text: 'mktime(&t) converts a struct tm holding local time into a time_t. It returns (time_t)-1 if the time cannot be represented.\n\nIt also normalises the structure: fields out of range are carried over (tm_mday = 32 in January becomes 1 February) and tm_wday and tm_yday are filled in. So it doubles as a calendar calculator: add 100 to tm_mday, call mktime, and read the new date.\n\nIt ignores the incoming tm_wday and tm_yday. Set tm_isdst to -1 so it works out daylight saving time itself.',

`,

    example: `#include <stdio.h>

  },

// ==== ide/help.js ====
// The C reference: every library function (its prototype comes from the real header), the
// keywords, the operators and the headers, with a short explanation and an example.
(function (SEE) {
  'use strict';
  const { h } = SEE.UI;
  const Help = SEE.Help = {};
  let index = null;

  /** {name: {sig, header, text, more, example, kind}} built from the headers plus SEE.RefText */
  function build() {
    if (index) return index;
    index = {};
    const HOME = { NULL: 'stddef.h', size_t: 'stddef.h', wchar_t: 'stddef.h' };
    const put = (name, e) => {
      if (index[name] && index[name].header && HOME[name] && index[name].header === HOME[name]) return;
      if (HOME[name] && e.header !== HOME[name] && index[name]) return;
      index[name] = Object.assign(index[name] || {}, e);
    };
    for (const [hdr, text] of Object.entries(SEE.Headers.files)) {
      const flat = text.replace(/\/\*[\s\S]*?\*\//g, '');
      // #define lines
      for (const line of flat.split('\n')) {
        const d = /^\s*#define\s+([A-Za-z_]\w*)(\([^)]*\))?\s*(.*)$/.exec(line);
        if (d && !d[1].startsWith('__') && d[3].trim() && !(d[1].startsWith('_') && /^_[A-Z_]+_H$/.test(d[1]))) put(d[1], { sig: '#define ' + d[1] + (d[2] || '') + ' ' + d[3].trim(), header: hdr, kind: d[2] ? 'macro' : 'constant' });
      }
      // declarations, split at ; outside braces (so multi-line typedefs stay whole)
      const code = flat.split('\n').filter((l) => !/^\s*#/.test(l)).join(' ');
      let depth = 0, cur = '';
      const stmts = [];
      for (const ch of code) {
        if (ch === '{') depth++;
        if (ch === '}') depth--;
        if (ch === ';' && depth === 0) { stmts.push(cur.replace(/\s+/g, ' ').trim()); cur = ''; continue; }
        cur += ch;
      }
      for (const st of stmts) {
        if (!st) continue;
        if (/^typedef\b/.test(st)) {
          const m = /([A-Za-z_]\w*)\s*(\[[^\]]*\])?$/.exec(st);
          if (m && !m[1].startsWith('_')) put(m[1], { sig: st.replace(/\{.*\}/, '{ ... }') + ';', header: hdr, kind: 'type', full: st + ';' });
          continue;
        }
        if (/^struct\s+\w+\s*\{/.test(st)) {
          const m = /^struct\s+(\w+)/.exec(st);
          put(m[1], { sig: 'struct ' + m[1] + ' { ... };', header: hdr, kind: 'type' });
          continue;
        }
        const f = /\b([A-Za-z_]\w*)\s*\(/.exec(st.replace(/^extern\s+/, '').replace(/\(\s*\*\s*signal/, 'signal'));
        if (f && !f[1].startsWith('__')) put(f[1], { sig: st.replace(/^extern\s+/, '') + ';', header: hdr, kind: 'function' });
        else {
          const v = /^extern\s+.*?\b([A-Za-z_]\w*)\s*(\[[^\]]*\])?$/.exec(st);
          if (v && !v[1].startsWith('_')) put(v[1], { sig: st + ';', header: hdr, kind: 'variable' });
        }
      }
    }
    index.signal = Object.assign(index.signal || {}, { sig: 'void (*signal(int sig, void (*func)(int)))(int);', header: 'signal.h', kind: 'function' });
    for (const [k, v] of Object.entries(SEE.RefText || {})) index[k] = Object.assign(index[k] || {}, v);
    return index;
  }
  Help.index = () => build();
  /** A short card for the hover callout */
  Help.brief = function (word) {
    const e = build()[word];
    if (!e) return null;
    return { sig: e.sig || '', text: (e.text || '').split(/(?<=\.)\s/)[0] + (e.header ? '  (' + '<' + e.header + '>' + ')' : '') };
  };

  Help.open = function (app, word) {
    const idx = build();
    const names = Object.keys(idx).sort((a, b) => a.localeCompare(b));
    const groups = new Map();
    for (const n of names) {
      const e = idx[n];
      const g = e.group || (e.header ? '<' + e.header + '>' : e.kind === 'keyword' ? 'Keywords' : 'The language');
      if (!groups.has(g)) groups.set(g, []);
      groups.get(g).push(n);
    }
    const order = [...groups.keys()].sort((a, b) => (a.startsWith('<') - b.startsWith('<')) || a.localeCompare(b));
    const filter = h('input', { type: 'search', placeholder: 'Find: printf, malloc, const, ->, static…', 'aria-label': 'Find in the reference', id: 'refFind' });
    const list = h('div.ref-list');
    const body = h('div.ref-body');
    let cur = word && idx[word] ? word : null;
    const show = (n) => {
      cur = n;
      body.innerHTML = '';
      const e = idx[n];
      if (!e) return;
      body.appendChild(h('h3', { style: { margin: '6px 0' } }, n));
      if (e.header) body.appendChild(h('p.muted', '#include <' + e.header + '>'));
      if (e.sig) body.appendChild(h('div.sig', e.sig));
      if (e.text) for (const para of String(e.text).split(/\n\n+/)) body.appendChild(h('p', para));
      if (e.example) {
        body.appendChild(h('p', h('b', 'Example')));
        body.appendChild(h('pre', e.example));
        const tryIt = h('button.btn', { type: 'button' }, 'Try this example');
        tryIt.addEventListener('click', () => { SEE.UI.closeAllModals(); Help.tryExample(app, n, e.example); });
        body.appendChild(tryIt);
      }
      if (e.see) body.appendChild(h('p.muted', 'See also: ', ...e.see.map((s, i) => { const a = h('a', { href: '#' }, s); a.addEventListener('click', (ev) => { ev.preventDefault(); show(s); render(); }); return [i ? ', ' : '', a]; })));
      if (e.header && !e.text) body.appendChild(h('p.muted', 'Open /usr/include/' + e.header + ' to read the header itself.'));
      for (const r of list.querySelectorAll('.ri')) r.classList.toggle('sel', r.dataset.n === n);
    };
    const render = () => {
      list.innerHTML = '';
      const q = filter.value.trim().toLowerCase();
      for (const g of order) {
        const items = groups.get(g).filter((n) => !q || n.toLowerCase().includes(q) || (idx[n].text || '').toLowerCase().includes(q));
        if (!items.length) continue;
        list.appendChild(h('div.rh', g));
        for (const n of items) {
          const r = h('div.ri' + (n === cur ? '.sel' : ''), { dataset: { n }, tabindex: '0' }, n);
          r.addEventListener('click', () => show(n));
          r.addEventListener('keydown', (e) => { if (e.key === 'Enter') show(n); });
          list.appendChild(r);
        }
      }
    };
    filter.addEventListener('input', () => { render(); const first = list.querySelector('.ri'); if (first && filter.value) show(first.dataset.n); });
    render();
    if (cur) show(cur); else body.appendChild(h('div', h('p', 'Everything in the C89 library, the keywords and the operators. Pick a name on the left or type to search.'), h('p.muted', 'In the editor, F1 opens this page for the word under the cursor, and pointing at a library function shows its prototype.')));
    SEE.UI.modal({ title: 'C reference', wide: true, body: h('div', filter, h('div.ref', { style: { marginTop: '8px' } }, list, body)), buttons: [{ label: 'Close', value: true, primary: true }], onOpen: () => { filter.focus(); const s = list.querySelector('.ri.sel'); if (s) s.scrollIntoView({ block: 'center' }); } });
  };

  Help.tryExample = function (app, name, code) {
    const dir = '/tmp/try-' + name.replace(/[^\w]/g, '_');
    app.vfs.mkdir(dir, { parents: true, exist: true, trusted: true });
    const text = /\bmain\s*\(/.test(code) ? code : '#include <stdio.h>\n\nint main(void)\n{\n' + code.replace(/^/gm, '    ') + '\n    return 0;\n}\n';
    app.vfs.writeText(dir + '/' + 'try.c', text, { trusted: true });
    const d = app.docByPath(dir + '/try.c');
    if (d) { d.editor.setValue(text); d.savedText = text; d.dirty = false; }
    app.openFile(dir + '/try.c');
    app.renderSide();
  };
})(SEE);

// Lessons: each one is a small program and a walk through it. Every step explains one thing and
// moves the debugger (start, step over, into, run to a line, change a value), so the words, the

(function (SEE) {
