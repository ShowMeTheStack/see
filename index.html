      return out;

      function fill(t, base, braced) {
        if (t.k === 'array') {
          const n = t.n;
          if (braced && items[i] && items[i].k === 'one' && items[i].e.k === 'str' && isCharType(t.of)) {
            strInit(t, items[i].e, base, out);
            i++;
            return;
          }
          for (let k = 0; (n === null || k < n) && i < items.length; k++) {
            const off = base + k * Types.sizeof(t.of);
            elem(t.of, off);
            out.used = Math.max(out.used, off - (probing ? 0 : 0) + Types.sizeof(t.of));
          }
          return;
        }
        if (Types.isSU(t)) {
          const d = Types.def(t);
          const ms = d.members.filter((m) => m.name);
          for (let k = 0; k < ms.length && i < items.length; k++) {
            elem(ms[k].type, base + ms[k].offset, ms[k]);
            if (d.k === 'union') break;
          }
          return;
        }
        elem(t, base);
      }
      function elem(t, off, member) {
        const it = items[i];
        if (it.k === 'list') {
          i++;
          if (!Types.isAggregate(t)) {
            if (it.items.length > 1) warn('excess elements in scalar initializer', it.pos);
            const sub = it.items[0];
            if (sub.k === 'list') throw err('braces around scalar initializer', it.pos);
            out.push({ off, type: t, e: initValue(t, sub.e, isStatic, name), member });
            return;
          }
          const sub = flattenInit(t, it, isStatic, name);
          for (const s of sub) out.push(Object.assign({}, s, { off: s.off + off }));
          return;
        }
        if (Types.isAggregate(t)) {
          // a string can fill a char array directly; a struct value can fill a struct member
          if (t.k === 'array' && it.e.k === 'str' && isCharType(t.of)) { strInit(t, it.e, off, out); i++; return; }
          if (Types.isSU(t) && !isStatic) {
            const e = rvalue(it.e);
            if (Types.isSU(e.t) && Types.compatible(Types.unqual(e.t), Types.unqual(t))) { out.push({ off, type: t, e, whole: true }); i++; return; }
          }
          fill(t, off, false);
          return;
        }
        i++;
        out.push({ off, type: t, e: initValue(t, it.e, isStatic, name), member });
      }
    }

    function strInit(t, s, off, out) {
      if (s.wide) {
        const n = t.n === null ? s.chars.length : t.n;
        if (s.chars.length - 1 > n) warn('initializer-string for array of wchar_t is too long', s.pos);
        for (let k = 0; k < n; k++) { const e = num(k < s.chars.length ? s.chars[k] : 0, t.of, s.pos); e.constVal = e.v; out.push({ off: off + k * Types.sizeof(t.of), type: t.of, e, fromString: true }); }
        out.used = Math.max(out.used || 0, off + n * Types.sizeof(t.of));
        return;
      }
      const n = t.n === null ? s.bytes.length : t.n;
      if (s.bytes.length - 1 > n) warn('initializer-string for array of chars is too long', s.pos);
      for (let k = 0; k < n; k++) {
        const v = k < s.bytes.length ? s.bytes[k] : 0;
        const e = num(t.of.k === 'uchar' ? v & 255 : (v << 24) >> 24, t.of, s.pos);
        e.constVal = e.v;
        out.push({ off: off + k, type: t.of, e, fromString: true });
      }
      out.used = Math.max(out.used || 0, off + n);
    }

    function initValue(t, e, isStatic, name) {
      let v = assignConvert(rvalue(e), t, 'initialization', e.pos);
      if (isStatic) {
        const c = constValue(v);
        if (c === null) throw err('initializer element is not constant', e.pos);
        v.constVal = c;
      }
      return v;
    }

    // ---- expressions --------------------------------------------------------------------------------
    function expr() {
      let e = assignExpr();
      while (is(',')) {
        const at = toks[p++];
        const r = assignExpr();
        e = { k: 'comma', l: rvalueOrVoid(e), r: rvalueOrVoid(r), t: rvalueOrVoid(r).t, pos: pos(at) };
      }
      return e;
    }

    function assignExpr() {
      const start = p;
      const l = condExpr();
      const t = peek();
      if (t.k === 'p' && ASSIGN_OPS.has(t.v)) {
        p++;
        const r = assignExpr();
        return makeAssign(t.v, l, r, pos(t));
      }
      void start;
      return l;
    }

    function condExpr() {
      const c = binExpr(1);
      if (!is('?')) return c;
      const at = toks[p++];
      const a = expr();
      expect(':');
      const b = condExpr();
      return makeCond(c, a, b, pos(at));
    }

    function binExpr(min) {
      let l = castExpr();
      for (;;) {
        const t = peek();
        if (t.k !== 'p') return l;
        const prec = BIN_PREC[t.v];
        if (!prec || prec < min) return l;
        p++;
        const r = binExpr(prec + 1);
        l = makeBinary(t.v, l, r, pos(t));
      }
    }

    function castExpr() {
      if (is('(') && startsTypeName(1)) {
        const at = toks[p++];
        const t = typeName();
        expect(')');
        if (is('{')) throw err('compound literals are not part of C89', peek());
        const e = castExpr();
        return makeCast(e, t, pos(at));
      }
      return unaryExpr();
    }

    function unaryExpr() {
      const t = peek();
      const at = pos(t);
      if (t.k === 'p') {
        switch (t.v) {
          case '++': case '--': { p++; const e = unaryExpr(); return makeIncDec(t.v, e, false, at); }
          case '&': {
            p++;

          case '*': { p++; const e = castExpr(); return makeDeref(e, at); }

            p++;
            const e = rvalue(castExpr());

            const pt = Types.promote(e.t);

          }
          case '~': {
            p++;
            const e = rvalue(castExpr());
            if (!Types.isInt(e.t)) throw err('wrong type argument to bit-complement', at);
            const pt = Types.promote(e.t);
            return fold({ k: 'unop', op: '~', e: convert(e, pt), t: pt, pos: at });
          }
          case '!': {
            p++;
            const e = rvalue(castExpr());
            if (!Types.isScalar(e.t)) throw err('wrong type argument to unary exclamation mark', at);

          }
        }
      }
      if (t.k === 'kw' && t.v === 'sizeof') {
        p++;
        let ty;
        if (is('(') && startsTypeName(1)) {
          p++;
          ty = typeName();
          expect(')');
        } else {
          const e = unaryExpr();
          if (e.k === 'member' && e.m.width !== undefined) throw err("'sizeof' applied to a bit-field", at);
          ty = e.t;
          if (e.k === 'var') e.sym.usedSizeof = true;
        }
        if (ty.k === 'func') throw err("invalid application of 'sizeof' to a function type", at);
        if (ty.k === 'void') throw err("invalid application of 'sizeof' to a void type", at);
        if (!Types.isComplete(ty)) throw err("invalid application of 'sizeof' to incomplete type '" + Types.str(ty) + "'", at);
        return { k: 'num', v: Types.sizeof(ty), t: T.uint, pos: at, sizeofType: ty };
      }
      return postfixExpr();
    }

    function postfixExpr() {
      let e = primaryExpr();
      for (;;) {
        const t = peek();
        const at = pos(t);
        if (is('[')) {
          p++;
          const idx = expr();
          expect(']');
          e = makeIndex(e, idx, at);
          continue;
        }
        if (is('(')) {
          p++;
          const args = [];
          if (!is(')')) {
            for (;;) {
              args.push(assignExpr());
              if (accept(',')) continue;
              break;
            }
          }
          expect(')');
          e = makeCall(e, args, at);
          continue;
        }
        if (is('.') || is('->')) {
          p++;
          const nt = peek();
          if (nt.k !== 'id') throw err('expected identifier before ' + quoteTok(nt), nt);
          p++;
          e = makeMember(e, nt.v, t.v === '->', at, nt);
          continue;
        }
        if (is('++') || is('--')) { p++; e = makeIncDec(t.v, e, true, at); continue; }
        return e;
      }
    }

    function primaryExpr() {
      const t = peek();
      const at = pos(t);
      if (t.k === 'id') {
        p++;
        let s = scope.find(t.v);
        if (!s) {
          if (is('(')) {
            // implicit declaration: int name();
            warn("implicit declaration of function '" + t.v + "'", t);
            s = file.names.get(t.v);
            if (!s) {
              s = { kind: 'func', name: t.v, type: Types.func(T.int, [], false, false), linkage: 'external', storage: 'global', defined: false, pos: at, unit: unit.id, implicit: true };
              file.names.set(t.v, s);
              globals.push(s);
            }
          } else throw err("'" + t.v + "' undeclared" + (fn ? ' (first use in this function)' : ''), t);
        }
        if (s.kind === 'typedef') throw err('unexpected type name ' + quoteTok(t) + ': expected expression', t);
        if (s.kind === 'enumconst') return { k: 'num', v: s.value, t: T.int, pos: at, enumConst: s.name };
        s.used = true;
        if (s.kind === 'func') return { k: 'var', sym: s, t: s.type, lv: false, pos: at, name: s.name };
        return { k: 'var', sym: s, t: s.type, lv: true, pos: at, name: s.name };
      }
      if (t.k === 'num') { p++; return numberLiteral(t); }
      if (t.k === 'char') {
        p++;
        const b = SEE.Lexer.decodeEscapes(t.v, at, warnings);
        if (!b.length) throw err('empty character constant', t);
        if (b.length > 1) warn('multi-character character constant', t);

        return { k: 'str', lit, bytes, t: Types.array(T.char, bytes.length), lv: true, pos: at };
      }

        p++;
        const e = expr();
        expect(')');
        return Object.assign({}, e, { paren: true });
      }
      if (t.k === 'eof') throw err('expected expression at end of input', t);
      throw err('expected expression before ' + quoteTok(t), t);
    }

    function numberLiteral(t) {

        const dec = !/^0/.test(m[1]) || m[1] === '0';

        else if (m[1].length > 1 && m[1][0] === '0') v = parseInt(m[1], 8);
        else v = Number(m[1]);

        let ty;

        if (v <= 0x7fffffff && !U && !L) ty = T.int;
        else if (!dec && v <= 0xffffffff && !U && !L) ty = T.uint;
        else if (v <= 0x7fffffff && !U) ty = T.long;
        else if (U && !L && v <= 0xffffffff) ty = T.uint;
        else if (v <= 0xffffffff) { ty = T.ulong; if (dec && !U) warn('this decimal constant is unsigned only in ISO C90', t); }

      if (!m || (!/[.eE]/.test(m[1]))) throw err('invalid number "' + s + '"', t);

      if (suf === 'f') v = Math.fround(v);
      if (!isFinite(v)) warn('floating constant exceeds range of ' + Types.str(ty), t);
      return { k: 'num', v, t: ty, pos: at, text: s };
    }

    // ---- building typed nodes -----------------------------------------------------------------------
    function num(v, t, at) { return { k: 'num', v, t, pos: at }; }

    /** Value of an expression: arrays and functions decay to pointers, lvalues are read */
    function rvalue(e) {
      if (e.t.k === 'array') return { k: 'decay', e, t: Types.ptr(e.t.of), pos: e.pos };
      if (e.t.k === 'func') return { k: 'decay', e, t: Types.ptr(e.t), pos: e.pos };
      if (e.t.k === 'void') throw err('void value not ignored as it ought to be', e.pos);
      if (e.lv && !Types.isComplete(e.t) && !Types.isSU(e.t)) throw err('invalid use of incomplete type', e.pos);
      if (e.lv && Types.isSU(e.t) && !Types.isComplete(e.t)) throw err("invalid use of undefined type '" + Types.str(e.t) + "'", e.pos);

    function rvalueOrVoid(e) { return e.t.k === 'void' ? e : rvalue(e); }
    function condition(e) {
      if (e.k === 'assign' && !e.paren) warn('suggest parentheses around assignment used as truth value', e.pos);

      if (!Types.isScalar(e.t)) throw err('used ' + (Types.isSU(e.t) ? e.t.k + ' type' : 'array type') + ' value where scalar is required', e.pos);

    }
    function used(e) { return e; }

    function convert(e, t) {

      if (a === b && from.k !== 'enum' && t.k !== 'enum' && from.k === Types.unqual(t).k && !(t.k === 'ptr' || from.k === 'ptr')) return Object.assign({}, e, { t: Types.unqual(t) });

    }

    function makeCast(e, t, at) {
      if (t.k === 'void') {
        const v = rvalueOrVoid(e);
        return { k: 'cast', e: v, t: T.void, pos: at };
      }
      const v = rvalue(e);
      if (!Types.isScalar(t)) {
        if (Types.isSU(t) && Types.compatible(Types.unqual(v.t), Types.unqual(t))) return v;
        throw err('conversion to non-scalar type requested', at);
      }
      if (!Types.isScalar(v.t)) throw err('aggregate value used where ' + (Types.isFloat(t) ? 'a float' : 'an integer') + ' was expected', at);

      return fold({ k: 'cast', e: v, t: Types.unqual(t), pos: at, explicit: true, castQ: t.q });
    }

    function isNullConst(e) {
      while (e.k === 'cast' && (Types.isInt(e.t) || (e.t.k === 'ptr' && e.t.to.k === 'void' && !e.t.to.q))) e = e.e;
      return e.k === 'num' && Types.isInt(e.t) && e.v === 0;
    }

    /** Conversion as if by assignment (6.3.16.1), with the usual diagnostics */
    function assignConvert(e, t, ctx, at) {

      if (Types.isArith(to) && Types.isArith(from)) {
        if (Types.isInt(to) && e.k === 'num' && Types.isInt(from)) {
          const r = Types.range(to);
          const cv = constValue(e);
          if (typeof cv === 'number' && (cv < r[0] || cv > r[1]) && !(Types.isUnsigned(to) && cv < 0 && cv >= -r[1]) && Types.sizeof(to) < 4) warn('overflow in implicit constant conversion', at);
        }
        if (Types.isInt(to) && Types.isFloat(from) && e.k === 'num') { /* fine, truncates */ }
        return convert(e, to);
      }
      if (Types.isSU(to)) {
        if (Types.isSU(from) && Types.def(from) === Types.def(to)) return e;
        throw err('incompatible types when ' + (what === 'assignment' ? 'assigning to' : what === 'return' ? 'returning' : 'initializing') + " type '" + Types.str(t) + "' from type '" + Types.str(from) + "'", at);
      }
      if (to.k === 'ptr') {
        if (isNullConst(e)) return convert(e, to);
        if (from.k === 'ptr') {
          const lt = to.to, rt = from.to;
          const lost = (rt.q & ~lt.q) & (Q_CONST | Q_VOLATILE);
          if (lt.k === 'void' || rt.k === 'void') {
            if (lt.k === 'void' && rt.k === 'func' || rt.k === 'void' && lt.k === 'func') warn('ISO C forbids conversion of ' + (lt.k === 'func' ? 'object pointer to function pointer' : 'function pointer to object pointer') + ' type', at);
          } else if (!Types.compatible(Types.unqual(lt), Types.unqual(rt))) {
            warn(what + ' ' + (ctx === 'argument' ? '' : '') + "from incompatible pointer type ('" + Types.str(from) + "' to '" + Types.str(t) + "')", at);
          }
          if (lost) warn(what + " discards '" + (lost & Q_CONST ? 'const' : 'volatile') + "' qualifier from pointer target type", at);
          return convert(e, to);
        }
        if (Types.isInt(from)) { warn(what + ' makes pointer from integer without a cast', at); return convert(e, to); }
      }
      if (Types.isInt(to) && from.k === 'ptr') { warn(what + ' makes integer from pointer without a cast', at); return convert(e, to); }
      throw err('incompatible types in ' + what + " (cannot convert '" + Types.str(from) + "' to '" + Types.str(t) + "')", at);
    }

    function checkModifiable(e, at, verb) {
      if (!e.lv) {
        if (e.k === 'str') throw err('lvalue required as ' + verb + ' operand', at);
        throw err('lvalue required as ' + (verb === 'assignment' ? 'left operand of assignment' : verb + ' operand'), at);
      }
      if (e.t.k === 'array') throw err('assignment to expression with array type', at);
      if (e.t.k === 'func') throw err('lvalue required as left operand of assignment', at);
      if (Types.isConst(e.t) || (Types.isSU(e.t) && Types.hasConstMember(e.t))) {
        const desc = describeLvalue(e);
        if (verb === 'assignment') throw err('assignment of read-only ' + desc, at);
        throw err((verb === 'increment' ? 'increment' : 'decrement') + ' of read-only ' + desc, at);
      }
      if (!Types.isComplete(e.t)) throw err('invalid use of incomplete type', at);
    }
    function describeLvalue(e) {
      if (e.k === 'var') return (e.sym.storage === 'param' ? 'parameter' : 'variable') + " '" + e.name + "'";
      if (e.k === 'member') return "member '" + e.m.name + "'";
      return "location '" + exprText(e) + "'";
    }
    function exprText(e) {
      switch (e.k) {
        case 'var': return e.name;
        case 'num': return String(e.v);
        case 'deref': return e.index ? exprText(e.index.a) + '[' + exprText(e.index.i) + ']' : '*' + exprText(e.e);
        case 'load': return exprText(e.e);
        case 'decay': return exprText(e.e);
        case 'member': return exprText(e.e) + (e.arrow ? '->' : '.') + e.m.name;
        case 'padd': return exprText(e.p) + (e.sub ? ' - ' : ' + ') + exprText(e.i);
        case 'cast': return exprText(e.e);
        case 'call': return exprText(e.f) + '(...)';
        case 'str': return '"..."';
      }
      return '...';
    }

    function makeAssign(op, l, r, at) {
      checkModifiable(l, at, 'assignment');
      if (l.k === 'var') l.sym.assigned = true;
      if (op === '=') {
        const rv = assignConvert(rvalue(r), l.t, 'assignment', at);
        return { k: 'assign', l, r: rv, t: Types.unqual(l.t), pos: at };
      }
      const bop = op.slice(0, -1);
      const lt = Types.unqual(l.t);
      const rv = rvalue(r);
      if ((bop === '+' || bop === '-') && lt.k === 'ptr') {
        if (!Types.isInt(rv.t)) throw err('invalid operands to binary ' + bop, at);
        checkPtrArith(lt, at);
        return { k: 'opassign', op: bop, l, r: convert(rv, T.int), t: lt, ptrStep: Types.sizeof(lt.to), pos: at };
      }

      right.appendChild(this.roSeg(vm));
      right.appendChild(this.textSeg(vm));
      root.appendChild(h('div.legend', h('span.lg-stack', 'stack'), h('span.lg-heap', 'heap'), h('span.lg-data', 'data and bss'), h('span.lg-ro', 'read-only data'), h('span.lg-text', 'code'),
        h('span', { style: { color: 'var(--m-uninit)' } }, 'red: not set yet'), h('span', '🔒 const')));
      el.appendChild(root);
      el.scrollTop = scroll; el.scrollLeft = scrollL;
      this.prev = this.seen;
      requestAnimationFrame(() => this.drawArrows());
    }

    toolbar() {
      const chk = (key, label, title) => {
        const c = h('input', { type: 'checkbox', checked: !!this.opts[key] });
        c.addEventListener('change', () => { this.opts[key] = c.checked; this.saveOpts(); this.render(); });
        return h('label', { title }, c, label);
      };
      return h('div.mem-bar', chk('arrows', 'arrows', 'Draw an arrow from each pointer to what it points at'), chk('lib', 'library frames', 'Show the C library\'s own frames and globals (like _start and the FILE table)'),
        chk('addrs', 'addresses', 'Show the address of every value'), chk('types', 'types', 'Show the type of every value (pointing at a row always shows it)'));
    }

    faultBox(f) {
      return h('div.fault-box', h('b', f.title + ': '), f.msg, f.at && f.at.line ? h('div.muted', 'at line ' + f.at.line + (f.at.fn ? ' in ' + f.at.fn + '()' : '')) : null);
    }
    leakText(vm) {
      if (!vm.libc) return '';
      const l = vm.libc.leaks();
      if (!l.length) return 'Every malloc block was freed.';
      const bytes = l.reduce((a, b) => a + b.size, 0);
      return l.length + ' heap block' + (l.length === 1 ? ' was' : 's were') + ' never freed (' + bytes + ' bytes): a memory leak.';
    }

    // ---- stack ---------------------------------------------------------------------------------------
    stackSeg(vm) {
      const seg = h('div.seg.stack');
      seg.appendChild(h('div.seg-head', h('span', 'Stack ↓'), h('span.addr', short(MEM.STACK_TOP))));
      const all = D().frames(vm);   // innermost first
      const shown = this.opts.lib ? all : all.filter((f) => !f.system);
      const sel = this.app.frameIndex || 0;
      // outermost at the top: the stack grows down towards the heap
      const list = shown.slice().reverse();
      let skip = null;
      if (list.length > 40) skip = { from: 3, to: list.length - 30 };
      list.forEach((fr, i) => {
        if (skip && i >= skip.from && i < skip.to) {
          if (i === skip.from) seg.appendChild(h('div.gap', '… ' + (skip.to - skip.from) + ' more frames of ' + list[skip.from].name + '() and others …'));
          return;
        }
        seg.appendChild(this.frameBox(vm, fr, all.indexOf(fr), sel));
      });
      if (!shown.length) seg.appendChild(h('div.gap', 'no frames'));
      const used = MEM.STACK_TOP - vm.SP;
      seg.appendChild(h('div.gap', { title: 'The stack may grow down to ' + short(MEM.STACK_LO) + '; past that is a stack overflow' }, 'stack pointer ' + short(vm.SP) + ' · ' + used.toLocaleString() + ' bytes in use · ' + Math.round((vm.SP - MEM.STACK_LO) / 1024) + ' KB left'));
      return seg;
    }

    frameBox(vm, fr, fi, sel) {
      const box = h('div.frame' + (fi === sel ? '.sel' : '') + (fi === 0 ? '.top' : '') + (fr.system ? '.sys' : ''));
      const head = h('div.frame-head', { title: 'Frame of ' + fr.name + '(): click to look at it' },
        h('span', h('span.fname', fr.name + '()'), ' ', h('span.fline', 'line ' + fr.where.line)), h('span.fline.code', 'fp ' + short(fr.fp)));
      head.addEventListener('click', () => this.app.selectFrame(fi));
      box.appendChild(head);
      const cells = h('div.cells');
      const rows = [];
      for (const v of fr.vars) {
        if (v.kind === 'static') continue;
        if (v.sym && v.sym.temp && !this.opts.lib) continue;
        rows.push({ addr: v.addr, v });
      }
      rows.push({ addr: fr.fp + 4, link: 'return to', value: vm.mem.peek(5, fr.fp + 4), fnAddr: true });
      rows.push({ addr: fr.fp, link: 'saved fp', value: vm.mem.peek(5, fr.fp) });
      rows.sort((a, b) => b.addr - a.addr);
      const key = 'f' + fi + ':' + fr.name;
      for (const r of rows) {
        if (r.link) {
          const sh = vm.mem.shadow(r.addr);
          let txt = short(r.value);
          if (r.fnAddr) { const w = vm.describeAddr(r.value); txt += w && w.fn ? ' (in ' + w.fn.name + ')' : ''; }
          const cell = h('div.cell.link', { title: r.link === 'return to' ? 'Where ' + fr.name + '() goes back to when it returns' : 'The frame pointer of the caller, restored on return' },
            h('span.a', this.opts.addrs ? short(r.addr) : ''), h('span.n', r.link), h('span.v', txt + (sh !== SH.CONTROL ? '' : '')), h('span.t', ''));
          spreadTitle(cell);
          cells.appendChild(cell);
          this.index(r.addr, 4, cell, 0);
          continue;
        }
        const v = r.v;
        const label = v.name + (v.kind === 'param' ? '' : '');
        this.valueRows(cells, vm, { name: label, type: v.type, addr: v.addr, key: key + ':' + v.name, kind: v.kind, title: (v.kind === 'param' ? 'a parameter of ' : 'a local variable of ') + fr.name + '()' }, 0);
        if (v.guard) {
          const size = Math.max(Types.sizeof(v.type), 1);
          if (this.opts.lib) cells.appendChild(h('div.cell.guard', h('span.a', this.opts.addrs ? short(v.addr + size) : ''), h('span.n', '(guard)'), h('span.v', '4 bytes kept free past ' + v.name), h('span.t', '')));
        }
      }
      box.appendChild(cells);
      return box;
    }

    // ---- a value and its parts -----------------------------------------------------------------------
    /** item: {name, type, addr, key, kind, bits} */
    valueRows(parent, vm, item, depth) {
      const t = Types.unqual(item.type);
      const agg = Types.isAggregate(t);
      const k = item.key;
      const small = (t.k === 'array' && (t.n || 0) <= 16 && !isCharT(t.of)) || (Types.isSU(t) && (Types.def(t).members || []).length <= 8);
      const forced = depth === 0 && this.forceOpen && this.forceOpen.has(item.name);
      const isOpen = agg && (this.open.has(k) || forced || (small && !this.closed.has(k) && depth < 2));
      const size = Math.max(Types.sizeof(t), 1);
      const row = h('div.cell' + (depth ? '.sub' : ''), { style: depth ? '--d: ' + depth : null });
      const tw = h('span.tw', agg ? (isOpen ? '▾' : '▸') : '');
      if (agg) tw.addEventListener('click', (e) => { e.stopPropagation(); if (forced) this.forceOpen.delete(item.name); this.toggle(k, isOpen); });
      const nameCell = h('span.n', tw, item.name);
      const vcell = this.valueCell(vm, item, t);
      row.append(h('span.a', this.opts.addrs ? short(item.addr) : ''), nameCell, vcell, h('span.t', { title: Types.str(item.type) }, typeShort(item.type)));
      row.title = (item.path || item.name) + ': ' + Types.str(item.type) + ' at ' + short(item.addr) + ' (' + size + ' byte' + (size === 1 ? '' : 's') + ')' + (item.title ? ', ' + item.title : '') + this.writerText(vm, item.addr);
      spreadTitle(row);
      parent.appendChild(row);
      this.index(item.addr, size, row, depth);
      const text = vcell.textContent;
      const sk = item.addr + ':' + Types.str(t);
      if (this.prev.has(sk) && this.prev.get(sk) !== text && !agg) row.classList.add('changed');
      this.seen.set(sk, text);
      if (isOpen) {
        for (const c of D().children(vm, t, item.addr, { limit: 64 })) {
          if (c.more) { parent.appendChild(h('div.cell.sub', { style: { '--d': depth + 1 } }, h('span.a', ''), h('span.n', '…'), h('span.v', (c.n - c.from) + ' more'), h('span.t', ''))); continue; }
          this.valueRows(parent, vm, { name: c.name, path: (item.path || item.name) + c.name, type: c.type, addr: c.addr, key: k + c.name, bits: c.bits }, depth + 1);
        }
      }
    }

    valueCell(vm, item, t) {
      const size = Math.max(Types.sizeof(t), 1);
      let text;
      let cls = 'span.v';
      if (item.bits) text = String(D().bitValue(vm, item.bits, item.addr - item.bits.offset));
      else if (Types.isSU(t)) text = Types.str(t);
      else if (t.k === 'array') text = isCharT(t.of) ? D().show(vm, t, item.addr) : t.n + ' × ' + Types.str(t.of);
      else if (t.k === 'ptr') { const pv = D().read(vm, t, item.addr); text = pv ? short(pv) : 'NULL'; }
      else text = D().show(vm, t, item.addr, { noGarbage: true });
      const scalar = Types.isScalar(t) || (t.k === 'array' && isCharT(t.of));
      const uninit = scalar && D().uninit(vm, item.addr, Math.min(size, 256));
      if (uninit) cls += '.uninit';
      const ro = Types.isConst(item.type) || vm.mem.shadow(item.addr) === SH.RODATA;
      if (scalar) cls += ro ? '.ro' : '.edit';
      if (t.k === 'ptr') cls += '.ptr';
      const v = h(cls, text);
      if (uninit) v.title = 'Not set yet: this is whatever was left in memory there';
      if (t.k === 'ptr') {
        const p = D().read(vm, t, item.addr);
        v.title = D().show(vm, t, item.addr) + (p ? '\npoints at ' + ((vm.describeAddr(p) || {}).text || 'nothing known') : '');
        const dot = h('span.dot');
        v.appendChild(dot);
        if (!p) dot.classList.add('null');
        else {
          const st = vm.mem.shadow(p);
          const bad = st === SH.NONE || st === SH.FREED || uninit;
          if (bad) dot.classList.add('bad');
          this.pointers.push({ el: dot, from: v, value: p, bad, type: t });
          if (!bad && t.to.k !== 'void' && t.to.k !== 'func' && Types.isComplete(t.to)) this.noteBlockType(vm, p, t.to);
        }
      }
      if (scalar && !ro && !item.noEdit) {
        v.addEventListener('click', (e) => { e.stopPropagation(); this.edit(v, item, t); });
      } else if (ro) v.title = 'const: the program cannot change this, so neither can the debugger';
      return v;
    }
    writerText(vm, addr) {
      const gid = vm.mem.lastWriter(addr);
      if (!gid) return '';
      const s = vm.stmtById(gid);
      if (!s) return '';
      if (s.debugger) return '\nlast changed from the debugger';
      return '\nlast written by line ' + s.line + ' in ' + s.fnName + '()';
    }
    toggle(k, isOpen) {
      if (isOpen) { this.open.delete(k); this.closed.add(k); } else { this.open.add(k); this.closed.delete(k); }
      store.set('memOpen', [...this.open].slice(-300));
      this.render();
    }
    edit(cell, item, t) {
      if (cell.querySelector('input')) return;
      const vm = this.vm;
      let start = cell.textContent;
      if (t.k === 'array') start = '"' + (vm.mem.cstr ? safeStr(vm, item.addr, t.n) : '') + '"';
      else if (Types.isScalar(t)) {
        const v = D().read(vm, t, item.addr);
        start = t.k === 'ptr' ? (v ? '0x' + v.toString(16) : 'NULL') : isCharT(t) ? (v >= 32 && v < 127 && v !== 39 && v !== 92 ? "'" + String.fromCharCode(v) + "'" : String(v)) : String(item.bits ? D().bitValue(vm, item.bits, item.addr - item.bits.offset) : Types.isFloat(t) ? D().floatText(v, t.k === 'float') : v);
      }
      const input = h('input', { type: 'text', value: start, 'aria-label': 'New value for ' + item.name });
      cell.textContent = '';
      cell.appendChild(input);
      input.focus();
      input.select();
      let done = false;
      const finish = (ok) => {
        if (done) return;
        done = true;
        if (ok) {
          try {
            D().setValue(vm, item.type, item.addr, input.value, this.app.frameIndex || 0, item.bits);
            this.app.afterEdit(item.name);
          } catch (e) { SEE.UI.toast(e.message, 'err', 5000); this.render(); }
        } else this.render();
      };
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); finish(true); }
        if (e.key === 'Escape') { e.preventDefault(); finish(false); }
        e.stopPropagation();
      });
      input.addEventListener('blur', () => finish(true));
    }

    index(addr, size, el, depth) { this.cellIndex.push({ lo: addr, hi: addr + size, el, depth }); }
    noteBlockType(vm, p, t) {
      if (!vm.libc) return;
      const i = vm.libc.findBlock(p);
      if (i < 0) return;
      if (!this.blockTypes.has(p)) this.blockTypes.set(p, t);
    }

    // ---- heap ---------------------------------------------------------------------------------------
    heapSeg(vm) {
      const seg = h('div.seg.heap');
      const m = vm.mem;
      seg.appendChild(h('div.seg-head', h('span', 'Heap ↑ (malloc)'), h('span.addr', short(m.heapLo) + ' – ' + short(m.brk))));
      const blocks = vm.libc ? vm.libc.blocks : [];
      if (!blocks.length) { seg.appendChild(h('div.gap', 'nothing allocated yet')); return seg; }
      // types for blocks come from pointers to them; pointers inside blocks can type other blocks
      const order = blocks.slice().sort((a, b) => b.addr - a.addr);
      const holder = h('div');
      const draw = () => {
        holder.innerHTML = '';
        for (const b of order) holder.appendChild(this.blockBox(vm, b));
      };
      let before = -1;
      for (let round = 0; round < 6 && before !== this.blockTypes.size; round++) {
        before = this.blockTypes.size;
        const save = { cells: this.cellIndex.length, ptrs: this.pointers.length };
        draw();
        if (before !== this.blockTypes.size) { this.cellIndex.length = save.cells; this.pointers.length = save.ptrs; }
      }
      seg.appendChild(holder);
      return seg;
    }
    blockBox(vm, b) {
      const exited = vm.state === 'exited';
      const box = h('div.blk' + (b.free ? '.freed' : '') + (!b.free && exited ? '.leak' : ''));
      const site = b.site ? 'line ' + b.site.line + (b.site.fn ? ' in ' + b.site.fn + '()' : '') : '';
      box.appendChild(h('div.blk-head', h('span', b.free ? 'free (was block #' + b.id + ')' : 'block #' + b.id + ' · ' + b.size + ' byte' + (b.size === 1 ? '' : 's')),
        h('span', b.free ? (b.freedAt ? 'freed at line ' + b.freedAt.line : '') : (b.by + ' at ' + site) + (exited ? ' · never freed' : ''))));
      if (this.opts.lib) box.appendChild(h('div.hdr', short(b.addr - 8) + '  header: size ' + vm.mem.peek(5, b.addr - 8) + ', tag 0x' + hex(vm.mem.peek(5, b.addr - 4))));
      const cells = h('div.cells');
      if (b.free) {
        cells.appendChild(h('div.cell', h('span.a', this.opts.addrs ? short(b.addr) : ''), h('span.n', ''), h('span.v', b.cap + ' bytes ready for the next malloc'), h('span.t', '')));
        this.index(b.addr, b.cap, cells.lastChild, 0);
        box.appendChild(cells);
        return box;
      }
      const t = this.blockTypes.get(b.addr);
      const es = t ? Types.sizeof(t) : 0;
      let type;
      if (t && es && b.size % es === 0 && b.size / es > 1) type = Types.array(t, b.size / es);
      else if (t && es && b.size === es) type = t;
      else if (t && es && b.size > es) type = Types.array(t, Math.floor(b.size / es));
      else type = Types.array(Types.T.uchar, b.size || 1);
      if (!t && b.size > 0) {
        // no typed pointer here: maybe it is a string
        const first = vm.mem.peek(1, b.addr);
        if (first !== null && first >= 32 && first < 127) type = Types.array(Types.T.char, b.size);
      }
      this.valueRows(cells, vm, { name: t ? (type.k === 'array' ? '[' + type.n + ']' : '*') : 'bytes', type, addr: b.addr, key: 'h' + b.id, title: 'heap block #' + b.id }, 0);
      box.appendChild(cells);
      return box;
    }

    // ---- globals, read-only data, code ---------------------------------------------------------------
    globalsSeg(vm) {
      const seg = h('div.seg.data');
      const [, , data, bss] = vm.prog.segments;
      seg.appendChild(h('div.seg-head', h('span', 'Globals and statics (.data, .bss)'), h('span.addr', short(data.lo) + ' – ' + short(bss.hi))));
      const cells = h('div.cells');
      const list = vm.prog.globals.filter((g) => (g.section === 'data' || g.section === 'bss') && (this.opts.lib || !g.system)).sort((a, b) => b.addr - a.addr);
      for (const g of list) this.valueRows(cells, vm, { name: (g.fn ? g.fn + '.' : '') + g.cname, type: g.type, addr: g.addr, key: 'g:' + g.name, title: (g.section === 'bss' ? 'in .bss (zero at start)' : 'in .data') + (g.isStatic ? ', static' : '') }, 0);
      if (!list.length) cells.appendChild(h('div.cell', h('span.a', ''), h('span.n', ''), h('span.v.muted', 'no global variables'), h('span.t', '')));
      seg.appendChild(cells);
      return seg;
    }
    roSeg(vm) {
      const seg = h('div.seg.ro');
      const ro = vm.prog.segments[1];
      seg.appendChild(h('div.seg-head', h('span', 'Read-only data (.rodata)'), h('span.addr', short(ro.lo))));
      const cells = h('div.cells');
      const consts = vm.prog.globals.filter((g) => g.section === 'rodata' && (this.opts.lib || !g.system));
      for (const g of consts) this.valueRows(cells, vm, { name: g.cname, type: g.type, addr: g.addr, key: 'g:' + g.name, title: 'a const global in .rodata' }, 0);
      const strs = vm.prog.strings.filter((s) => this.opts.lib || !/\/usr\/lib\//.test(s.unit)).sort((a, b) => b.addr - a.addr);
      for (const s of strs.slice(0, 200)) {
        const row = h('div.cell', { title: 'string literal from line ' + s.lit.pos.line + ' of ' + s.unit + ': it lives here for the whole run and cannot be changed' },
          h('span.a', this.opts.addrs ? short(s.addr) : ''), h('span.n', 'line ' + s.lit.pos.line), h('span.v.ro', D().quoteBytes(s.lit.bytes.slice(0, -1), 48)), h('span.t', 'char[' + s.size + ']'));
        spreadTitle(row);
        cells.appendChild(row);
        this.index(s.addr, s.size, row, 0);
      }
      if (!consts.length && !strs.length) cells.appendChild(h('div.cell', h('span.a', ''), h('span.n', ''), h('span.v.muted', 'no string literals'), h('span.t', '')));
      seg.appendChild(cells);
      return seg;
    }
    textSeg(vm) {
      const seg = h('div.seg.text.fnlist');
      const tx = vm.prog.segments[0];
      seg.appendChild(h('div.seg-head', h('span', 'Code (.text)'), h('span.addr', short(tx.lo))));
      const cells = h('div.cells');
      const cur = new Set(D().frames(vm).map((f) => f.fn));
      for (const f of vm.prog.functions.slice().sort((a, b) => b.addr - a.addr)) {
        if (f.system && !this.opts.lib) continue;
        const row = h('div.cell' + (cur.has(f) ? '.target' : ''), { title: Types.str(f.type, f.name) + (f.system ? ' (C library)' : '') }, h('span.a', short(f.addr)), h('span.n', f.name + '()'), h('span.v.muted', f.unitFile.replace(/^.*\//, '') + ':' + f.pos.line), h('span.t', ''));
        spreadTitle(row);
        cells.appendChild(row);
        this.index(f.addr, f.size, row, 0);
      }
      const nat = vm.prog.natives.filter((n) => this.opts.lib || !n.name.startsWith('__'));
      if (nat.length) {
        const row = h('div.cell', h('span.a', short(nat[0].addr)), h('span.n', 'library'), h('span.v.muted', nat.map((n) => n.name).join(', ')), h('span.t', ''));
        cells.appendChild(row);
        for (const n of nat) this.index(n.addr, 16, row, 0);
      }
      seg.appendChild(cells);
      return seg;
    }

    // ---- arrows ----------------------------------------------------------------------------------------
    target(p) {
      let best = null;
      for (const c of this.cellIndex) {
        if (p >= c.lo && p < c.hi && (!best || (c.hi - c.lo) < (best.hi - best.lo) || ((c.hi - c.lo) === (best.hi - best.lo) && c.depth > best.depth))) best = c;
      }
      return best;
    }
    positionSvg() { /* the svg scrolls with the content; nothing to do */ }
    drawArrows() {
      if (!this.root || !this.opts.arrows) return;
      const old = this.root.querySelector('svg.mem-svg');
      if (old) old.remove();
      const NS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('class', 'mem-svg');
      const rb = this.root.getBoundingClientRect();
      svg.setAttribute('width', this.root.scrollWidth);
      svg.setAttribute('height', this.root.scrollHeight);
      for (const p of this.pointers) {
        const t = this.target(p.value);
        if (!t || !t.el.isConnected || !p.el.isConnected) continue;
        const a = p.el.getBoundingClientRect();
        const b = rectOf(t.el);
        if (!a.width || !b.width) continue;
        const x1 = a.left + a.width / 2 - rb.left, y1 = a.top + a.height / 2 - rb.top;
        const toRight = b.left > a.right;
        let x2, y2 = b.top + Math.min(b.height / 2, 9) - rb.top;
        let c1x, c2x;
        if (toRight) { x2 = b.left - rb.left; c1x = x1 + Math.max(30, (x2 - x1) / 2); c2x = x2 - Math.max(30, (x2 - x1) / 2); }
        else {
          // same column: loop out to the right, inside the picture's margin
          x2 = b.right - rb.left;
          const out = Math.min(this.root.scrollWidth - 3, Math.max(x1, x2) + 14 + Math.min(30, Math.abs(y2 - y1) / 8));
          c1x = out; c2x = out;
        }
        const path = document.createElementNS(NS, 'path');
        path.setAttribute('d', `M${x1},${y1} C${c1x},${y1} ${c2x},${y2} ${x2},${y2}`);
        if (p.bad) path.setAttribute('class', 'bad');
        svg.appendChild(path);
        const head = document.createElementNS(NS, 'path');
        const dir = toRight ? 1 : -1;
        head.setAttribute('d', `M${x2},${y2} l${-6 * dir},-4 l0,8 z`);
        head.setAttribute('class', 'head' + (p.bad ? ' bad' : ''));
        svg.appendChild(head);
        const hl = (on) => { path.classList.toggle('hl', on); t.el.classList.toggle('target', on); };
        p.from.addEventListener('mouseenter', () => hl(true));
        p.from.addEventListener('mouseleave', () => hl(false));
      }
      this.root.appendChild(svg);
    }
  }

  /** Rows are display: contents, so their box is the union of their cells */
  function rectOf(el) {
    const r = el.getBoundingClientRect();
    if (r.width || !el.children.length) return r;
    let l = Infinity, t = Infinity, rr = -Infinity, bb = -Infinity;
    for (const c of el.children) {
      const x = c.getBoundingClientRect();
      if (!x.width && !x.height) continue;
      l = Math.min(l, x.left); t = Math.min(t, x.top); rr = Math.max(rr, x.right); bb = Math.max(bb, x.bottom);
    }

%d\\n\", n, m, *p, *q, *r, limit);\n    return 0;\n}\n","guess/guess.c":"/* guess.c: guess the number. It reads your guesses from the terminal:\n   type a number and press Enter when the program waits. */\n#include <stdio.h>\n#include <stdlib.h>\n#include <time.h>\n\nint main(void)\n{\n    int secret, guess, tries = 0;\n\n    srand((unsigned)time(NULL));\n    secret = rand() % 100 + 1;\n    printf(\"I am thinking of a number from 1 to 100.\\n\");\n    for (;;) {\n        printf(\"your guess: \");\n        fflush(stdout);              /* show the prompt before waiting for input */\n        if (scanf(\"%d\", &guess) != 1)\n            break;\n        tries++;\n        if (guess < secret)\n            printf(\"higher\\n\");\n        else if (guess > secret)\n            printf(\"lower\\n\");\n        else {\n            printf(\"yes! %d tries\\n\", tries);\n            break;\n        }\n    }\n    return 0;\n}\n","hanoi/hanoi.c":"/* hanoi.c: the towers of Hanoi.\n   Step into the recursion (F11) and watch a new frame for every call;\n   the Variables panel lists them all, and each has its own n, from, to and via. */\n#include <stdio.h>\n\nstatic int moves;\n\nvoid hanoi(int n, char from, char to, char via)\n{\n    if (n == 0)\n        return;\n    hanoi(n - 1, from, via, to);\n    moves++;\n    printf(\"move disc %d from %c to %c\\n\", n, from, to);\n    hanoi(n - 1, via, to, from);\n}\n\nint main(void)\n{\n    hanoi(3, 'A', 'C', 'B');\n    printf(\"%d moves\\n\", moves);\n    return 0;\n}\n","jagged/jagged.c":"/* jagged.c: a triangle of numbers with rows of different lengths.\n   rows lives on the stack; it points to an array of row pointers on the heap,\n   and each of those points to its own block. Step and watch the arrows appear. */\n#include <stdio.h>\n#include <stdlib.h>\n\nint main(void)\n{\n    int n = 5, i, j;\n    int **rows = malloc(n * sizeof *rows);    /* n pointers, one per row */\n\n    for (i = 0; i < n; i++) {\n        rows[i] = malloc((i + 1) * sizeof **rows);    /* row i holds i + 1 numbers */\n        for (j = 0; j <= i; j++)\n            rows[i][j] = (j == 0 || j == i) ? 1 : rows[i - 1][j - 1] + rows[i - 1][j];\n    }\n    for (i = 0; i < n; i++) {\n        for (j = 0; j <= i; j++)\n            printf(\"%d \", rows[i][j]);\n        printf(\"\\n\");\n    }\n    for (i = 0; i < n; i++)\n        free(rows[i]);     /* the rows first ... */\n    free(rows);            /* ... then the array that pointed at them */\n    return 0;\n}\n","linked-list/list.c":"/* list.c: a linked list, built at the front.\n   Every node is a heap block; each next pointer is an arrow to the following node. */\n#include <stdio.h>\n#include <stdlib.h>\n\nstruct node {\n    int value;\n    struct node *next;\n};\n\n/* head is passed by address so push can change the caller's pointer */\nvoid push(struct node **head, int value)\n{\n    struct node *n = malloc(sizeof *n);\n    n->value = value;\n    n->next = *head;\n    *head = n;\n}\n\nvoid free_list(struct node *n)\n{\n    while (n != NULL) {\n        struct node *next = n->next;   /* read next before the node is gone */\n        free(n);\n        n = next;\n    }\n}\n\nint main(void)\n{\n    struct node *head = NULL;\n    struct node *p;\n    int i;\n\n    for (i = 1; i <= 4; i++)\n        push(&head, i * 10);\n    for (p = head; p != NULL; p = p->next)\n        printf(\"%d -> \", p->value);\n    printf(\"NULL\\n\");\n    free_list(head);\n    return 0;\n}\n","notes/notes.c":"/* notes.c: write a file, then read it back.\n   The file goes in /tmp; look for it in the Files panel afterwards. */\n#include <stdio.h>\n\nint main(void)\n{\n    FILE *f;\n    char line[80];\n    int n = 0;\n\n    f = fopen(\"/tmp/notes.txt\", \"w\");\n    if (f == NULL) {\n        perror(\"/tmp/notes.txt\");\n        return 1;\n    }\n    fprintf(f, \"buy milk\\n\");\n    fprintf(f, \"learn pointers\\n\");\n    fprintf(f, \"call home\\n\");\n    fclose(f);\n\n    f = fopen(\"/tmp/notes.txt\", \"r\");\n    if (f // ==== ide/ref/ideas.js ====
/* The C reference: the ideas behind C */
SEE.RefText = Object.assign(SEE.RefText || {}, {
  'stack frame': {
    group: 'Ideas',
    text: 'Every time a function is called, it gets a stack frame: a block of memory on the stack holding its parameters, its local variables, and the bookkeeping needed to go back: the return address (where in the caller to continue) and the caller\'s saved frame pointer. When the function returns, its frame is popped and that memory is reused by the next call.\n\nThe stack grows downward on this machine, from high addresses to low. In See\'s memory picture the stack is on the left, with main\'s frame at the top and the function running now at the bottom. Each frame shows its variables at their real addresses, plus the "return to" and saved frame pointer cells. Click a frame to look at the variables of a caller.\n\nThis explains several rules of C. Local variables start with garbage because the frame reuses old memory. A pointer to a local variable becomes invalid when the function returns. Recursion works because each call has its own frame with its own copies of the variables, and recursion that never stops runs out of stack: a stack overflow.',
    example: `#include <stdio.h>

static int factorial(int n)
{
    int result;

    if (n <= 1)
        result = 1;
    else
        result = n * factorial(n - 1);
    printf("frame for n = %d returns %d\\n", n, result);
    return result;
}

int main(void)
{
    printf("4! = %d\\n", factorial(4));
    return 0;
}
`,
    see: ['heap', 'storage duration', 'dangling pointer', '()', 'return'],
  },
  heap: {
    group: 'Ideas',
    text: 'The heap is the area of memory that malloc, calloc and realloc hand out and free gives back. Unlike a local variable, a heap block lives until you free it, no matter which function created it, and its size can be decided while the program runs.\n\nIn See\'s memory picture each heap block is a numbered box showing its size, which function allocated it and on which line, and its contents. A pointer to the block is drawn as an arrow. Freed blocks are shown greyed out, and blocks still allocated when the program ends are marked as leaks.\n\nThe responsibilities are all yours: check that malloc did not return NULL, never use more bytes than you asked for, free each block exactly once, and do not touch it after freeing it. Breaking these rules gives buffer overflows, memory leaks, double frees and dangling pointers, all of which See detects and reports.',
    example: `#include <stdio.h>
#include <stdlib.h>

int main(void)
{
    int n = 5, i;
    int *squares = malloc(n * sizeof *squares);

    if (squares == NULL)
        return 1;
    for (i = 0; i < n; i++)
        squares[i] = i * i;
    for (i = 0; i < n; i++)
        printf("%d ", squares[i]);
    printf("\\n");
    free(squares);
    return 0;
}
`,
    see: ['malloc', 'free', 'stack frame', 'memory leak', 'dangling pointer'],
  },
  pointer: {
    group: 'Ideas',
    text: 'A pointer is a variable that holds the address of another object. int *p declares p as a pointer to int; p = &x makes it point at x; *p then is x, for reading and writing. On this machine every pointer is 4 bytes.\n\nPointers let a function change its caller\'s variables (pass &x), let programs build linked structures, and give access to heap memory, which has no name of its own. They also walk through arrays: p + 1 points to the next element, however big an element is.\n\nA pointer that points nowhere should hold NULL. One that was never set holds garbage, and one whose object has gone (freed, or a local whose function returned) is dangling; using either is undefined behaviour. In See\'s memory picture every pointer is drawn as an arrow to the box it points into, which makes all of this visible.',
    example: `#include <stdio.h>

static void double_it(int *p)
{
    *p = *p * 2;
}

int main(void)
{
    int x = 21;
    int *p = &x;
    int a[3] = { 10, 20, 30 };
    int *q = a;

    double_it(p);
    printf("x = %d, *p = %d\\n", x, *p);
    q++;
    printf("q now points at %d, %d elements into a\\n", *q, (int)(q - a));
    return 0;
}
`,
    see: ['unary &', 'unary *', 'NULL', 'array decay', 'dangling pointer', '->'],
  },
  'array decay': {
    group: 'Ideas',
    text: 'In almost every expression, the name of an array is converted to a pointer to its first element. That conversion is called decay. So a, used as a value, means &a[0], and a[i] is really *(a + i).\n\nThe three exceptions are sizeof a (the size of the whole array), &a (a pointer to the whole array) and a string literal initialising a char array.\n\nDecay is why you cannot pass an array to a function: the function receives only a pointer, and a parameter written int a[] is really int *a. The function cannot know the length, so sizeof inside it gives the size of a pointer; pass the length as another argument. It is also why an array cannot be assigned or returned, and why changing a[i] inside a function changes the caller\'s array.',
    example: `#include <stdio.h>

static int sum(const int a[], int n)
{
    int i, s = 0;

    for (i = 0; i < n; i++)
        s += a[i];
    return s;
}

int main(void)
{
    int v[4] = { 1, 2, 3, 4 };
    int *p = v;

    printf("sizeof v = %d, sizeof p = %d\\n", (int)sizeof v, (int)sizeof p);
    printf("v == &v[0]: %d\\n", v == &v[0]);
    printf("sum = %d\\n", sum(v, (int)(sizeof v / sizeof v[0])));
    return 0;
}
`,
    see: ['pointer', '[]', 'sizeof operator'],
  },
  'string literal': {
    group: 'Ideas',
    text: 'A string literal, "like this", is an array of characters with a NUL byte added at the end, stored for the whole life of the program. "abc" occupies 4 bytes.\n\nModifying a string literal is undefined behaviour. In See literals live in read-only memory (shown in the read-only data area of the memory picture), so char *s = "abc"; s[0] = \'X\'; stops the program. To get a string you can change, copy it into an array: char s[] = "abc"; makes a 4-byte array initialised from the literal. Declaring literal pointers as const char * lets the compiler catch mistakes.\n\nAdjacent literals are joined at compile time: "ab" "cd" is "abcd", useful for splitting long strings across lines. Escape sequences such as \\n, \\t, \\" and \\\\ write characters that cannot be typed directly.',
    example: `#include <stdio.h>

int main(void)
{
    const char *p = "read-only";
    char a[] = "changeable";

    a[0] = 'C';
    printf("%s / %s\\n", p, a);
    printf("sizeof \\"abc\\" = %d\\n", (int)sizeof "abc");
    printf("joined: %s\\n", "con" "cat" "enated");
    return 0;
}
`,
    see: ['NUL terminator', 'const', 'char', 'array decay'],
  },
  'NUL terminator': {
    group: 'Ideas',
    text: 'C strings have no stored length. A string is a sequence of characters ending with the NUL character, \'\\0\', the byte with value 0. Every string function relies on it: strlen counts up to it, printf("%s") prints up to it, strcpy copies up to and including it.\n\nSo a string of n characters needs an array of n + 1 bytes. Forgetting the extra byte, or building a string by hand without adding the \'\\0\', makes the functions run past the end of the array, reading or writing memory that belongs to something else. strncpy is a known trap: if the source is too long it does not add the terminator.\n\nNUL (the character) is not NULL (the null pointer), although both are zero. In See\'s memory picture a char array shows each byte, and the terminator appears as \\0.',
    example: `#include <stdio.h>
#include <string.h>

int main(void)
{
    char word[6];

    word[0] = 'h';
    word[1] = 'e';
    word[2] = 'l';
    word[3] = 'l';
    word[4] = 'o';
    word[5] = '\\0';
    printf("%s has length %d and needs %d bytes\\n", word, (int)strlen(word), (int)sizeof word);
    word[2] = '\\0';
    printf("cut short: %s\\n", word);
    return 0;
}
`,
    see: ['string literal', 'strlen', 'strncpy', 'buffer overflow', 'NULL'],
  },
  'undefined behaviour': {
    group: 'Ideas',
    text: 'Undefined behaviour is what the C standard calls a program that breaks one of its rules in a way the compiler is not required to catch. The standard then places no requirements at all: the program may crash, print nonsense, appear to work, or work today and fail after a small change.\n\nThe common causes: reading or writing outside an array, dereferencing NULL or a dangling pointer, using an uninitialised variable, signed integer overflow, dividing by zero, modifying a string literal, modifying a variable twice between sequence points (i = i++), and passing printf a value that does not match its format.\n\nOn a real machine many of these go unnoticed and cause bugs far away from their origin. See checks for most of them while the program runs and stops at the line responsible, explaining what went wrong, which is much easier to learn from. A program that runs correctly in See has passed those checks, but the habit to build is to never rely on what an undefined operation happened to do.',
    example: `#include <stdio.h>
#include <limits.h>

int main(void)
{
    int a[4] = { 1, 2, 3, 4 };
    int i = 4, x = INT_MAX;

    if (i >= 0 && i < 4)
        printf("a[%d] = %d\\n", i, a[i]);
    else
        printf("index %d is outside a[4]; reading it would be undefined\\n", i);
    if (x < INT_MAX)
        x = x + 1;
    else
        printf("x + 1 would overflow; that would be undefined too\\n");
    return 0;
}
`,
    see: ['buffer overflow', 'dangling pointer', 'sequence point', 'INT_MAX'],
  },
  'integer promotion': {
    group: 'Ideas',
    text: 'Before arithmetic, C converts small integer types to int: char, signed char, unsigned char, short and unsigned short (and bit-fields and enums) all become int, because int can hold all their values here. This is the integer promotion.\n\nSo c + 1 with a char c is an int, \'a\' * 2 does not overflow a char, and sizeof(c + c) is 4. The result is converted back only when you store it into a smaller variable.\n\nThe same promotion happens to arguments of a function declared with ..., such as printf: a char or short arrives as int and a float as double. That is why %d prints a char and why va_arg must ask for int, never char.',
    example: `#include <stdio.h>

int main(void)
{
    unsigned char a = 200, b = 100;
    unsigned char c;
    int sum;

    sum = a + b;
    c = (unsigned char)(a + b);
    printf("a + b = %d as int, %d stored back in a char\\n", sum, c);
    printf("sizeof a = %d, sizeof(a + b) = %d\\n", (int)sizeof a, (int)sizeof(a + b));
    return 0;
}
`,
    see: ['usual arithmetic conversions', 'char', 'va_arg'],
  },
  'usual arithmetic conversions': {
    group: 'Ideas',
    text: 'When a binary operator such as +, <, or == has operands of different types, C converts them to a common type first. The rules, in order: if either is long double, both become long double; else if either is double, both become double; else if either is float, both become float. Otherwise both get the integer promotions, and then the "smaller" is converted to the "larger" of int, unsigned int, long and unsigned long.\n\nThe floating cases are what you would expect: 7 / 2.0 is done in double. The trap is signed against unsigned of the same size: the signed value is converted to unsigned. -1 becomes 4294967295, so -1 < 1u is false, and if (i < strlen(s)) misbehaves for negative i.\n\nThe conversion happens on the values, before the operation, and only for that expression.',
    example: `#include <stdio.h>

int main(void)
{
    int i = -1;
    unsigned u = 1;
    double d = 7 / 2;
    double e = 7 / 2.0;

    printf("7 / 2 = %g, 7 / 2.0 = %g\\n", d, e);
    printf("i < u is %d, because i becomes %u\\n", (unsigned)i < u, (unsigned)i);
    return 0;

  'sequence point': {
    group: 'Ideas',
    text: 'A sequence point is a moment in the execution of a program at which all side effects of earlier evaluations (assignments, increments, writes through pointers, output) are complete. There is one at the end of every full expression (each statement, each if or while condition), after the left operand of &&, || and the comma operator, after the condition of ?:, and just before a function is called, once its arguments are evaluated.\n\nBetween two sequence points, a variable may be modified at most once, and if it is modified, it may be read only to compute its new value. i = i++, a[i] = i++ and i++ + i++ break the rule and are undefined behaviour.\n\nThe order in which operands and function arguments are evaluated between sequence points is unspecified. printf("%d %d", f(), g()) may call g first. If the order matters, use separate statements.',
    example: `#include <stdio.h>

static int counter = 0;

static int next(void)
{
    return ++counter;
}

int main(void)
{
    int a, b, i = 0;

    a = next();
    b = next();
    printf("in order: %d %d\\n", a, b);
    i++;
    i = i * 10;
    printf("i = %d\\n", i);
    if (i > 5 && ++i > 10)
        printf("&& has a sequence point: i = %d\\n", i);
    return 0;
}

  lvalue: {
    group: 'Ideas',
    text: 'An lvalue is an expression that designates an object in memory, something that has an address: a variable name, a[i], *p, s.member, p->member. The name comes from being allowed on the left of an assignment.\n\nAssignment, ++, -- and the address-of operator & need an lvalue. 5 = x, (a + b) = 3, f() = 1 and &(x + 1) are all errors, because those expressions are just values with no storage.\n\nSome lvalues cannot be modified: a const variable, and an array name (you cannot assign to a whole array). The compiler reports these as an attempt to assign to a read-only or non-modifiable lvalue.',
    example: `#include <stdio.h>

  scope: {
    group: 'Ideas',
    text: 'The scope of a name is the part of the program text where it can be used. A name declared inside a block, between { and }, has block scope: it is visible from its declaration to the closing brace. A name declared outside all functions has file scope: it is visible from there to the end of the file. Function parameters have the scope of the function body, and labels (for goto) have function scope.\n\nAn inner declaration hides (shadows) an outer one with the same name until its block ends. That is legal but confusing; prefer different names.\n\nScope is about where a name is visible, not how long the object lives. A static local variable has block scope but lives for the whole program; see storage duration. Whether the same name in another file refers to the same object is linkage.',
    example: `#include <stdio.h>

int count = 100;

int main(void)
{
    int count = 1;

    printf("inner count: %d\\n", count);
    {
        int count = 2;

        printf("innermost count: %d\\n", count);
    }
    printf("back to: %d\\n", count);
    return 0;
}
`,
    see: ['linkage', 'storage duration', 'static', 'extern'],
  },
  linkage: {
    group: 'Ideas',
    text: 'Linkage decides whether the same name declared in different places, possibly in different source files, refers to the same object or function.\n\nExternal linkage: the name is shared across the whole program. Functions and file-scope variables have it by default, and extern declarations refer to it. Internal linkage: the name is private to one source file. static at file scope gives it, so two files can each have their own static int count without a clash. No linkage: local variables and parameters, which are unique to their block.\n\nThe linker joins external names after compiling each file. Two files defining the same external name give a "multiple definition" error, and a name declared but never defined gives "undefined reference".',
    example: `#include <stdio.h>

static int calls = 0;
int shared_total = 0;

static void helper(int n)
{
    calls++;
    shared_total += n;
}

int main(void)
{
    helper(5);
    helper(7);
    printf("calls %d (private to this file), total %d (visible to other files)\\n", calls, shared_total);
    return 0;
}

    see: ['extern', 'static', 'scope', 'translation unit'],

  'storage duration': {
    group: 'Ideas',
    text: 'The storage duration of an object is how long it exists. C89 has three kinds.\n\nAutomatic: local variables (without static) exist from entry to their block until it is left, in the function\'s stack frame. They start uninitialised. Static: global variables and static locals exist for the whole run of the program; they are initialised before main starts, to zero unless given another value. Allocated: blocks from malloc, calloc and realloc exist until free.\n\nIn See\'s memory picture these are three separate areas: the stack on the left, and on the right the heap and the "data and bss" area of globals and static locals. A pointer that outlives the object it points to (a returned address of a local, a freed block) is dangling.',
    example: `#include <stdio.h>
#include <stdlib.h>

int global_count;

static int *make(int v)
{
    int *p = malloc(sizeof *p);

    if (p != NULL)
        *p = v;
    return p;
}

int main(void)
{
    static int calls;
    int local = 5;
    int *h = make(42);

    if (h == NULL)
        return 1;
    printf("global %d, static local %d (both start at 0), local %d, heap %d\\n", global_count, calls, local, *h);
    free(h);
    return 0;
}
`,
    see: ['static', 'auto', 'heap', 'stack frame', 'scope'],

  'translation unit': {
    group: 'Ideas',
    text: 'A translation unit is what the compiler actually compiles: one .c source file after the preprocessor has pasted in every #include and expanded every macro. Each translation unit is compiled separately into an object file, and the linker then combines them into one program.\n\nThat is why each .c file must include the headers it needs itself, why static names are private to one translation unit, and why a function used in another file must be declared there, usually through a shared header.\n\nIn See, a project with several .c files in a folder is built this way: each file compiled on its own, then linked together with the C library.',
    example: `#include <stdio.h>

static int helper(int x)
{
    return x * 3;
}

int main(void)
{
    printf("this file is one translation unit; helper(4) = %d\\n", helper(4));
    return 0;
}
`,
    see: ['header file', 'linkage', 'declaration versus definition'],
  },
  'header file': {
    group: 'Ideas',
    text: 'A header file (.h) holds declarations that several source files need to share: function prototypes, extern variable declarations, type definitions, struct declarations and macros. #include "file.h" pastes its text into the source file at that point; #include <file.h> does the same for system headers, which are found in /usr/include. In See you can open /usr/include/stdio.h and read it.\n\nA header should declare, not define: put int count; or a function body in a header that two .c files include, and the program gets two definitions. The usual guard against including the same header twice in one file is #ifndef NAME_H / #define NAME_H / ... / #endif around the contents.\n\nForgetting a standard header is a classic C89 bug: calling sqrt without <math.h> makes the compiler assume it returns int.',
    example: `#include <stdio.h>
#include <string.h>
#include <math.h>

int main(void)
{
    printf("strlen and sqrt are declared in <string.h> and <math.h>: %d %g\\n", (int)strlen("abc"), sqrt(16.0));
    return 0;
}
`,
    see: ['translation unit', 'declaration versus definition', 'extern'],
  },
  'declaration versus definition': {
    group: 'Ideas',
    text: 'A declaration tells the compiler that a name exists and what its type is. A definition also creates the thing: it allocates storage for a variable or provides the body of a function. Every definition is a declaration, but not the other way round.\n\nint square(int x); is a declaration (a prototype); int square(int x) { return x * x; } is a definition. extern int count; is a declaration; int count = 0; is a definition. struct point { int x, y; }; declares a type and creates no object.\n\nA name may be declared as many times as you like, consistently, but defined only once in the whole program (the one-definition rule). That is why declarations go in header files and definitions in exactly one .c file. A name used but never defined gives a link error.',
    example: `#include <stdio.h>

int square(int x);
extern int calls;

int main(void)
{
    printf("square(9) = %d\\n", square(9));
    printf("calls = %d\\n", calls);
    return 0;
}

int calls = 0;

int square(int x)
{
    calls++;
    return x * x;
}
`,
    see: ['header file', 'extern', 'linkage', 'translation unit'],
  },
  endianness: {
    group: 'Ideas',
    text: 'A value wider than one byte is stored in several consecutive bytes, and endianness is the order they go in. A little-endian machine stores the least significant byte at the lowest address; a big-endian machine stores the most significant byte first. The machine See simulates is little-endian, like x86 and most ARM systems: the int 0x11223344 sits in memory as 44 33 22 11.\n\nIt does not matter for arithmetic, only when the same memory is looked at as bytes: writing an int to a file with fwrite and reading it on a machine of the other kind, sending numbers over a network, or inspecting memory through an unsigned char pointer. Portable code builds multi-byte values from bytes with shifts.\n\nIn See, the bytes panel shows the raw bytes of memory while a program is paused, lowest address first, so an int appears there in little-endian order.',
    example: `#include <stdio.h>

int main(void)
{
    unsigned int x = 0x11223344u;
    unsigned char *b = (unsigned char *)&x;
    int i;

    printf("0x%X in memory, lowest address first:", x);
    for (i = 0; i < (int)sizeof x; i++)
        printf(" %02X", b[i]);
    printf("\\n%s-endian\\n", b[0] == 0x44 ? "little" : "big");
    return 0;
}
`,
    see: ['union', '<<', 'fwrite'],
  },
  'alignment and padding': {
    group: 'Ideas',
    text: 'Most types must be stored at an address that is a multiple of some number, their alignment: here an int or pointer at a multiple of 4, a double at a multiple of 8, a char anywhere. Accessing misaligned data is slow or impossible on many processors.\n\nTo keep every member of a structure aligned, the compiler inserts unused padding bytes between members, and at the end so that arrays of the structure stay aligned too. struct { char c; double d; } takes 16 bytes, not 9: 7 padding bytes follow c.\n\nSo sizeof a structure can be larger than the sum of its members, offsetof gives the true positions, and ordering members from largest to smallest often saves space. Never compare structures with memcmp: the padding bytes hold garbage. In See\'s memory picture the padding shows as gaps between the fields of a structure, and the bytes panel shows every byte of it, padding included.',
    example: `#include <stdio.h>
#include <stddef.h>

struct loose {
    char a;
    double d;
    char b;
};

struct tight {
    double d;
    char a;
    char b;
};

int main(void)
{
    printf("loose: %d bytes (d at offset %d)\\n", (int)sizeof(struct loose), (int)offsetof(struct loose, d));
    printf("tight: %d bytes\\n", (int)sizeof(struct tight));
    return 0;
}
`,
    see: ['offsetof', 'struct', 'sizeof operator'],
  },
  "two's complement": {
    group: 'Ideas',
    text: 'Two\'s complement is the way virtually every machine, including the one See simulates, stores signed integers. The top bit has a negative weight: in 8 bits, 10000000 is -128 and 11111111 is -1. To negate a number, invert all its bits and add 1, which is why ~x == -x - 1.\n\nThe range is lopsided: an n-bit signed type runs from -2 to the n-1 up to 2 to the n-1 minus 1, so a 32-bit int goes from -2147483648 to 2147483647, and -INT_MIN does not fit.\n\nThe same bit pattern means different numbers as signed and as unsigned: 0xFFFFFFFF is -1 as an int and 4294967295 as an unsigned int. Conversions between them keep the bits, which is why -1 converted to unsigned is UINT_MAX. C89 itself also allowed one\'s complement and sign-magnitude machines, but they are long gone.',
    example: `#include <stdio.h>

int main(void)
{
    signed char values[] = { 0, 1, 127, -1, -128 };
    int i, bit;

    for (i = 0; i < 5; i++) {
        printf("%5d = ", values[i]);
        for (bit = 7; bit >= 0; bit--)
            putchar(((unsigned char)values[i] >> bit) & 1 ? '1' : '0');
        printf("\\n");
    }
    printf("~5 = %d, -1 as unsigned = %u\\n", ~5, (unsigned)-1);
    return 0;
}
`,
    see: ['INT_MIN', '~', 'unsigned', 'signed'],
  },
  'buffer overflow': {
    group: 'Ideas',
    text: 'A buffer overflow is writing (or reading) past the end of an array: a[10] in an array of 10, copying a 20-character string into char name[16], or a loop that runs with i <= n. C does not check array bounds, so on a real machine the bytes land in whatever comes next in memory: other variables, the saved return address in the stack frame, or the heap\'s own bookkeeping.\n\nThe effects range from wrong values far from the bug to crashes, and overflows of the stack are a classic security hole, because overwriting the return address can redirect the program.\n\nThe defences: always know the size of the destination and pass it along (fgets(buf, sizeof buf, stdin) rather than gets, strncpy or a length check rather than a blind strcpy, sprintf only with formats whose output you have measured). See checks every access and stops at the first one outside its array, naming the array and its valid range.',
    example: `#include <stdio.h>
#include <string.h>

int main(void)
{
    char name[8];
    const char *input = "Bartholomew";

    if (strlen(input) < sizeof name) {
        strcpy(name, input);
    } else {
        strncpy(name, input, sizeof name - 1);
        name[sizeof name - 1] = '\\0';
    }
    printf("stored safely: \\"%s\\" (the input had %d characters)\\n", name, (int)strlen(input));
    return 0;
}
`,
    see: ['NUL terminator', 'strcpy', 'strncpy', 'fgets', 'gets', '[]'],
  },
  'memory leak': {
    group: 'Ideas',
    text: 'A memory leak is heap memory that is never freed after the program has finished with it. Usually the last pointer to the block is overwritten or goes out of scope, so the block can no longer even be freed.\n\nOne leak in a short program does no harm, since the operating system reclaims everything at exit. But a leak inside a loop or a long-running program grows until memory runs out. Typical causes: an early return or error path that skips the free, p = realloc(p, n) losing the old block when it fails, and freeing a structure without first freeing the blocks it points to.\n\nWhen a program ends, See lists every block that was never freed, with its size and the line that allocated it, and marks them in the heap area of the memory picture.',
    example: `#include <stdio.h>
#include <stdlib.h>
#include <string.h>

static char *copy_of(const char *s)
{
    char *p = malloc(strlen(s) + 1);

    if (p != NULL)
        strcpy(p, s);
    return p;
}

int main(void)
{
    int i;
    char *s;

    for (i = 0; i < 3; i++) {
        s = copy_of("temporary");
        if (s == NULL)
            return 1;
        printf("%d: %s\\n", i, s);
        free(s);
    }
    printf("every block freed: no leak\\n");
    return 0;
}
`,
    see: ['heap', 'malloc', 'free', 'realloc', 'dangling pointer'],
  },
  'dangling pointer': {
    group: 'Ideas',
    text: 'A dangling pointer is one that still holds the address of an object that no longer exists. The two usual ways to get one: freeing a heap block and then using a pointer to it (use after free, or freeing it twice), and returning the address of a local variable from a function, whose stack frame is gone once it returns.\n\nThe pointer itself looks perfectly normal, and on a real machine the old memory often still holds the old values for a while, so the bug can hide until that memory is reused. Then a write through the pointer corrupts a different object.\n\nSetting a pointer to NULL right after free(p) turns later mistakes into an obvious NULL dereference. See tracks every block and frame, and stops with "use after free" or a similar message the moment a dangling pointer is used.',
    example: `#include <stdio.h>
#include <stdlib.h>

static int *make_counter(void)
{
    int *p = malloc(sizeof *p);

    if (p != NULL)
        *p = 0;
    return p;
}

int main(void)
{
    int *c = make_counter();

    if (c == NULL)
        return 1;
    (*c)++;
    printf("counter = %d\\n", *c);
    free(c);
    c = NULL;
    if (c == NULL)
        printf("freed, and the pointer cleared so it cannot dangle\\n");
    return 0;
}
`,
    see: ['free', 'stack frame', 'heap', 'NULL', 'pointer'],
  },
});

/* The C reference: the 32 keywords of C89 */
SEE.RefText = Object.assign(SEE.RefText || {}, {

    group: 'Keywords', kind: 'keyword',

    text: 'auto declares a local variable with automatic storage duration: it is created when the block is entered and destroyed when the block is left. That is already the default for every variable declared inside a function, so auto is almost never written.\n\nAn automatic variable is not initialised unless you give it a value; until then it holds whatever bytes were left in that stack memory. See warns when a program reads one before it was given a value, and the memory picture shows it inside the function\'s stack frame.\n\n(In C++11 and later, auto means something completely different: type deduction. Not in C.)',
    example: `#include <stdio.h>

int main(void)
{
    auto int count = 3;
    int same = 3;

}
`,

  },

    group: 'Keywords', kind: 'keyword',
    sig: 'break;',
    text: 'break leaves the innermost enclosing for, while, do or switch immediately, and continues with the statement after it.\n\nIn a switch, break is how a case ends; without it, execution falls through into the next case. In nested loops, break only leaves the inner one; to leave several at once use a flag, a return, or goto.\n\nbreak cannot be used to leave an if block on its own.',
    example: `#include <stdio.h>

    int primes[] = { 2, 3, 5, 7, 11, 13 };

  case: {

    text: 'case marks a place inside a switch to jump to when the controlling value equals the constant. The constant must be an integer constant expression known at compile time: a number, a character such as \'a\', an enum constant or arithmetic on these. Strings and variables are not allowed, and two cases may not have the same value.\n\nA case label is only a label: execution continues straight into the following cases unless a break stops it. Several labels in a row share one piece of code.',

  char: {
    group: 'Keywords', kind: 'keyword',
    sig: 'char name;  signed char name;  unsigned char name;',
    text: 'char is the smallest integer type, exactly one byte (CHAR_BIT bits, 8 here). It holds a character code: \'A\' is just the number 65. Arrays of char ending in a NUL byte are C\'s strings.\n\nWhether a plain char is signed or unsigned is up to the implementation; here it is signed, from -128 to 127. signed char and unsigned char spell it out. Use unsigned char for raw bytes, and cast to unsigned char before calling the <ctype.h> functions.\n\nThe result of getchar and fgetc must be kept in an int, not a char, so that EOF can be told apart from a real byte.',
    example: `#include <stdio.h>

int main(void)
{
    char c = 'A';
    char word[] = "hi";

    printf("'%c' is %d; next is '%c'\\n", c, c, c + 1);

}
`,
    see: ['CHAR_MIN', 'unsigned', 'string literal', 'NUL terminator', 'getchar'],

  const: {
    group: 'Keywords', kind: 'keyword',
    sig: 'const type name = value;  const type *p;  type *const p;',
    text: 'const says an object must not be changed through this name. The compiler rejects an assignment to it. A const variable must be given its value when it is defined.\n\nWith pointers its position matters. const char *p (or char const *p) is a pointer to characters that may not be changed through p, though p itself can move. char *const p is a pointer that cannot move, to characters that can be changed. Read declarations from the name outwards: p is a const pointer to char.\n\nFunctions use const on pointer parameters to promise they will not modify what they are given, as in size_t strlen(const char *s). Passing a non-const pointer to such a parameter is always fine; the reverse needs a cast and is usually a mistake.\n\nIn C89 a const int is not a constant expression, so it cannot size an array or label a case; use #define or an enum for that.',
    example: `#include <stdio.h>
#include <string.h>

static int count_char(const char *s, char c)
{
    int n = 0;

    for (; *s != '\\0'; s++)

            n++;
    return n;

  continue: {

    text: 'continue skips the rest of the current iteration of the innermost for, while or do loop and starts the next one.\n\nIn a for loop the increment expression still runs before the condition is tested again. In a while or do loop control goes straight to the condition, so make sure whatever moves the loop forward happens before the continue, or the loop never ends.\n\ncontinue has no meaning in a switch; inside a switch inside a loop, it continues the loop.',
    example: `#include <stdio.h>

{

    text: 'default labels the code a switch jumps to when no case matches. It is optional; without it, an unmatched value skips the whole switch body. There may be at most one default in a switch.\n\nIt can appear anywhere among the cases, though it is normally written last. Putting a default in every switch, even one that just reports an impossible value, catches bugs early.',
    example: `#include <stdio.h>

  double: {
    group: 'Keywords', kind: 'keyword',

    text: 'double is the standard floating-point type: 8 bytes here in IEEE 754 format, with about 15 decimal digits of precision and a range up to about 1.8e308. It is the type of a constant like 3.14, the type the math functions use, and what a float is promoted to when passed to printf.\n\nFloating-point numbers are binary fractions, so most decimal fractions are not exact: 0.1 + 0.2 is not exactly 0.3. Never compare computed doubles with ==; and never use them for money counted in cents, use integers.\n\nprintf prints a double with %f, %e or %g. scanf reads one with %lf; %f there means float, a common bug. long double is the same as double on this machine.',
