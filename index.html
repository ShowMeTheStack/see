<!doctype html>
<html lang="en">
<head>

<title>See: C89, step by step, down to the byte</title>
<meta name="description" content="See is a C89 workbench in the browser: write, build and run C, then step through it and watch the stack, the heap and every byte change.">
<meta name="theme-color" content="#9ea3b5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%235b6a8c'/%3E%3Crect x='0' y='0' width='16' height='1' fill='%23c9d1e6'/%3E%3Crect x='0' y='0' width='1' height='16' fill='%23c9d1e6'/%3E%3Cpath d='M11 4.5H6.5a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2H11' stroke='%23ffffff' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<style>
/* See: a C workbench in the look of a 1980s Unix workstation. Two palettes (Motif grey and Midnight)
   share the same bevels; the terminal can glow like a green phosphor screen. */
:root {
  --font-ui: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
  --font-code: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
  --code-size: 14px;
  --bg: #aeb2c3;
  --panel: #bcc0cf;
  --panel2: #c9ccd8;
  --face: #c5c9d6;
  --hi: #eef0f6;
  --lo: #646a7e;
  --line: #8b90a3;
  --text: #15171f;
  --muted: #4d5266;
  --title: #4f5f86;
  --title-text: #ffffff;
  --accent: #335c99;
  --accent-text: #ffffff;
  --edit-bg: #fbfaf5;
  --edit-text: #1b1d25;
  --gutter: #e4e2d8;
  --gutter-text: #8a8c96;
  --sel: #b8cbec;
  --curline: rgba(51, 92, 153, 0.07);
  --exec: #fff0a8;
  --exec-mark: #c99a00;
  --frame-line: #dfe8f7;
  --err: #c0262d;
  --err-bg: #fbe1e0;
  --warn: #a06a00;
  --warn-bg: #fff1cc;
  --ok: #1f7a3a;
  --term-bg: #10131a;
  --term-text: #d8dde8;
  --term-err: #ff8c8c;
  --term-in: #9fd5ff;
  --c-kw: #7b2d8e;
  --c-type: #1d5fa8;
  --c-str: #a3460b;
  --c-chr: #a3460b;
  --c-num: #0f7a5c;
  --c-com: #6c7a5c;
  --c-pp: #a01d5b;
  --c-fn: #26486e;
  --c-const: #8a3b00;
  --c-op: #444b5e;
  --c-punc: #4a5064;
  /* memory picture */
  --m-stack: #dbe5f5;
  --m-stack-head: #8fa6cf;
  --m-heap: #e6f1dc;
  --m-heap-head: #8fb878;
  --m-data: #f4ead3;
  --m-data-head: #c9ad6c;
  --m-ro: #eee3ee;
  --m-ro-head: #b495b4;
  --m-text: #e3e3e3;
  --m-text-head: #a2a2a2;
  --m-free: #cfd2dc;
  --m-uninit: #a33;
  --m-changed: #ffe680;
  --m-arrow: #2f5aa8;
  --m-arrow-bad: #c0262d;
  --shadow: 0 6px 24px rgba(10, 14, 30, 0.35);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #2b2f3b;
  --panel: #353a48;
  --panel2: #3d4252;
  --face: #3d4252;
  --hi: #5a6178;
  --lo: #14161d;
  --line: #4b5164;
  --text: #dfe3ee;
  --muted: #a3a9bc;
  --title: #2f5579;
  --title-text: #eef3fb;
  --accent: #5b8fd6;
  --accent-text: #0d1220;
  --edit-bg: #1b1e27;
  --edit-text: #dde1ea;
  --gutter: #23262f;
  --gutter-text: #6c7385;
  --sel: #33476b;
  --curline: rgba(120, 160, 230, 0.07);
  --exec: #4a4120;
  --exec-mark: #e3b52c;
  --frame-line: #263449;
  --err: #ff6b6b;
  --err-bg: #3d1f22;
  --warn: #e6b450;
  --warn-bg: #3a3220;
  --ok: #6fcf8a;
  --term-bg: #0b0d12;
  --term-text: #d6dbe6;
  --c-kw: #d49af0;
  --c-type: #7fb2f0;
  --c-str: #f0a36b;
  --c-chr: #f0a36b;
  --c-num: #7fd8b8;
  --c-com: #7d8a6f;
  --c-pp: #f08bb8;
  --c-fn: #a8c8f0;
  --c-const: #f5c07a;
  --c-op: #aab1c4;
  --c-punc: #9aa1b4;
  --m-stack: #24314a;
  --m-stack-head: #3e5885;
  --m-heap: #253726;
  --m-heap-head: #3f6b3f;
  --m-data: #3a3322;
  --m-data-head: #77653a;
  --m-ro: #362a3a;
  --m-ro-head: #6a4f6e;
  --m-text: #2f3138;
  --m-text-head: #555a66;
  --m-free: #252830;
  --m-uninit: #ff8080;
  --m-changed: #6b5a12;
  --m-arrow: #7fb2f0;
  --m-arrow-bad: #ff6b6b;
  --shadow: 0 6px 28px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-theme="dark"]) { color-scheme: dark; }
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 13px/1.35 var(--font-ui); overflow: hidden; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px dashed var(--accent); outline-offset: 1px; }
.muted { color: var(--muted); }
.code, code, kbd { font-family: var(--font-code); }
kbd { border: 1px solid var(--line); border-bottom-width: 2px; padding: 0 4px; border-radius: 2px; font-size: 0.92em; background: var(--panel2); }

/* bevels */
.raised { border: 2px solid; border-color: var(--hi) var(--lo) var(--lo) var(--hi); }
.sunken { border: 2px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo); }

.app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

/* ---- title, menus, toolbar ------------------------------------------------------------------- */
.titlebar { display: flex; align-items: center; justify-content: space-between; background: var(--title); color: var(--title-text); height: 30px; padding: 0 6px 0 4px; border-bottom: 1px solid var(--lo); flex: none; }
.tb-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tb-right { display: flex; gap: 2px; }
.logo { width: 22px; height: 22px; display: grid; place-items: center; font: bold 15px var(--font-code); background: var(--face); color: var(--title); border: 2px solid; border-color: var(--hi) var(--lo) var(--lo) var(--hi); }
.appname { font-weight: bold; letter-spacing: 0.04em; }
.doc-title { opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.titlebar .ibtn { color: var(--title-text); }

.menubar { display: flex; background: var(--panel); border-bottom: 1px solid var(--lo); flex: none; padding: 1px 2px; }
.menubar .mtop { background: none; border: 1px solid transparent; padding: 3px 9px; cursor: default; }
.menubar .mtop:hover, .menubar .mtop.open { border-color: var(--hi) var(--lo) var(--lo) var(--hi); background: var(--panel2); }
.menubar .mtop u { text-decoration: underline; }

.toolbar { display: flex; align-items: center; gap: 2px; background: var(--panel); padding: 3px 4px; border-bottom: 2px solid var(--lo); flex: none; overflow-x: auto; scrollbar-width: none; }
.toolbar::-webkit-scrollbar { display: none; }
.toolbar .sep { width: 2px; align-self: stretch; margin: 2px 5px; border-left: 1px solid var(--lo); border-right: 1px solid var(--hi); }
.tbtn { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; min-height: 28px; background: var(--face); border: 2px solid; border-color: var(--hi) var(--lo) var(--lo) var(--hi); cursor: pointer; white-space: nowrap; }
.tbtn:active:not(:disabled), .tbtn.on { border-color: var(--lo) var(--hi) var(--hi) var(--lo); background: var(--panel2); }
.tbtn:disabled { opacity: 0.45; cursor: default; }
.tbtn svg { width: 16px; height: 16px; flex: none; }
.tbtn.primary { background: var(--accent); color: var(--accent-text); }
.tbtn .lbl { font-size: 12px; }
.toolbar .chip { margin-left: auto; padding: 2px 8px; font-size: 12px; border: 2px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo); background: var(--panel2); white-space: nowrap; }
.chip.running { color: var(--ok); }
.chip.paused { color: var(--exec-mark); }
.chip.fault { color: var(--err); }

.ibtn { background: none; border: 1px solid transparent; padding: 3px; display: inline-grid; place-items: center; cursor: pointer; min-width: 26px; min-height: 26px; color: var(--text); }
.ibtn:hover { border-color: var(--hi) var(--lo) var(--lo) var(--hi); }
.ibtn:active { border-color: var(--lo) var(--hi) var(--hi) var(--lo); }
.ibtn svg { width: 16px; height: 16px; }

.btn { padding: 4px 12px; min-height: 28px; background: var(--face); border: 2px solid; border-color: var(--hi) var(--lo) var(--lo) var(--hi); cursor: pointer; }
.btn:active { border-color: var(--lo) var(--hi) var(--hi) var(--lo); }
.btn.primary { outline: 1px solid var(--text); outline-offset: 1px; font-weight: bold; }
.btn:disabled { opacity: 0.5; }

input[type="text"], input[type="number"], input[type="search"], select, textarea {
  background: var(--edit-bg); color: var(--edit-text); border: 2px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo); padding: 3px 5px; border-radius: 0; width: 100%;
}
textarea { font-family: var(--font-code); font-size: 12px; resize: vertical; min-height: 80px; }
label { display: block; margin: 6px 0 3px; }

/* ---- the work area ------------------------------------------------------------------------------- */
.work { flex: 1; display: flex; min-height: 0; }
.side { width: 210px; display: flex; flex-direction: column; background: var(--panel); min-width: 0; flex: none; }
.right { width: 600px; display: flex; flex-direction: column; background: var(--panel); min-width: 0; flex: none; }
.center { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--panel); }
.app.no-side .side, .app.no-side #splitSide { display: none; }
.app.no-right .right, .app.no-right #splitRight { display: none; }
.split.v { width: 6px; cursor: col-resize; background: var(--panel); border-left: 1px solid var(--hi); border-right: 1px solid var(--lo); flex: none; touch-action: none; }
.split.h { height: 6px; cursor: row-resize; background: var(--panel); border-top: 1px solid var(--hi); border-bottom: 1px solid var(--lo); flex: none; touch-action: none; }
.split.dragging { background: var(--accent); }
.pane-head { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 2px 8px; min-height: 30px; border-bottom: 1px solid var(--lo); }
.pane-title { font-weight: bold; }
.pane-tools { display: flex; gap: 1px; }
.pane-body { flex: 1; overflow: auto; min-height: 0; }

.tabs { display: flex; gap: 2px; padding: 3px 4px 0; overflow-x: auto; flex: none; scrollbar-width: thin; border-bottom: 2px solid var(--lo); }
.tab { display: inline-flex; align-items: center; gap: 4px; padding: 3px 4px 3px 10px; background: var(--face); border: 2px solid; border-bottom: none; border-color: var(--hi) var(--lo) var(--lo) var(--hi); cursor: pointer; white-space: nowrap; max-width: 220px; }
.tab.active { background: var(--edit-bg); color: var(--edit-text); position: relative; top: 2px; padding-bottom: 5px; }
.tab .tname { overflow: hidden; text-overflow: ellipsis; }
.tab.dirty .tname::after { content: " •"; color: var(--accent); }
.tab .tclose { border: none; background: none; padding: 0 3px; cursor: pointer; opacity: 0.6; font-size: 14px; line-height: 1; }
.tab .tclose:hover { opacity: 1; }
.tab .tro { font-size: 10px; color: var(--muted); }
.editors { flex: 1; position: relative; min-height: 0; background: var(--edit-bg); }
.empty-editor { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 20px; }

.bottom { height: 230px; display: flex; flex-direction: column; flex: none; min-height: 0; }
.ptabs { display: flex; gap: 2px; padding: 3px 4px 0; border-bottom: 2px solid var(--lo); flex: none; overflow-x: auto; scrollbar-width: none; }
.ptabs::-webkit-scrollbar { display: none; }
.ptab { padding: 3px 10px; background: var(--face); border: 2px solid; border-bottom: none; border-color: var(--hi) var(--lo) var(--lo) var(--hi); cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.ptab svg { width: 14px; height: 14px; }
.ptab.active { background: var(--panel2); position: relative; top: 2px; padding-bottom: 5px; font-weight: bold; }
.ptab .badge { font-size: 10px; padding: 0 5px; border-radius: 8px; background: var(--err); color: #fff; font-weight: bold; }
.ptab .badge.warn { background: var(--warn); }
.pbody { flex: 1; min-height: 0; overflow: auto; position: relative; background: var(--panel2); }
.pbody > .panel { position: absolute; inset: 0; overflow: auto; }

/* ---- editor ---------------------------------------------------------------------------------------- */
.ed { position: absolute; inset: 0; display: flex; font: var(--code-size)/1.6 var(--font-code); background: var(--edit-bg); color: var(--edit-text); }
.ed-gutter { flex: none; overflow: hidden; background: var(--gutter); color: var(--gutter-text); text-align: right; user-select: none; border-right: 1px solid var(--line); cursor: pointer; position: relative; }
.ed-gutter-inner { padding: 6px 0; }
.ed-gl { padding: 0 8px 0 16px; position: relative; white-space: nowrap; }
.ed-gl.bp::before { content: ""; position: absolute; left: 3px; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: var(--err); box-shadow: inset -1px -1px 0 rgba(0,0,0,0.35); }
.ed-gl.bp.cond::before { border-radius: 2px; transform: rotate(45deg); }
.ed-gl.bp.disabled::before { background: transparent; border: 2px solid var(--err); }
.ed-gl.exec { color: var(--edit-text); font-weight: bold; }
.ed-gl.exec::after { content: "\25B6"; position: absolute; left: 2px; top: 0; color: var(--exec-mark); font-size: 11px; }
.ed-gl.frame::after { content: "\25B7"; position: absolute; left: 2px; top: 0; color: var(--exec-mark); font-size: 11px; }
.ed-gl.err { color: var(--err); font-weight: bold; }
.ed-gl.warn { color: var(--warn); font-weight: bold; }
.ed-main { position: relative; flex: 1; min-width: 0; }
.ed-hl, .ed-ta { position: absolute; inset: 0; margin: 0; padding: 6px 10px 40vh 10px; font: inherit; white-space: pre; overflow: hidden; tab-size: 4; border: 0; }
.ed-ta { overflow: auto; background: transparent; color: transparent; caret-color: var(--edit-text); resize: none; outline: none; z-index: 1; }
.ed-ta::selection { background: var(--sel); color: transparent; }
.ed-line { display: block; min-height: 1.6em; }
.ed-line.curline { background: var(--curline); }
.ed-line.exec { background: var(--exec); box-shadow: inset 3px 0 0 var(--exec-mark); }
.ed-line.frame { background: var(--frame-line); }
.ed-line.errline { background: var(--err-bg); }
.ed-line.warnline { background: var(--warn-bg); }
.ed-line.flash { animation: flash 1s ease-out; }
@keyframes flash { from { background: var(--sel); } to { background: transparent; } }
.ed-tip { position: fixed; z-index: 60; background: var(--panel2); color: var(--text); border: 1px solid var(--lo); padding: 4px 8px; font-size: 12px; max-width: 420px; box-shadow: var(--shadow); pointer-events: none; }
.c-kw { color: var(--c-kw); font-weight: bold; }
.c-type { color: var(--c-type); }
.c-str, .c-chr { color: var(--c-str); }
.c-num { color: var(--c-num); }
.c-com { color: var(--c-com); font-style: italic; }
.c-pp { color: var(--c-pp); }
.c-fn { color: var(--c-fn); }
.c-const { color: var(--c-const); }
.c-op { color: var(--c-op); }
.c-punc { color: var(--c-punc); }

/* ---- terminal -------------------------------------------------------------------------------------- */
.term { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--term-bg); color: var(--term-text); font: 13px/1.45 var(--font-code); }
.term-out { flex: 1; overflow: auto; padding: 6px 10px; white-space: pre-wrap; word-break: break-all; outline: none; }
.term-out .err { color: var(--term-err); }
.term-out .in { color: var(--term-in); }
.term-out .pending { opacity: 0.5; border-bottom: 1px dashed currentColor; cursor: help; }
.term-out .note { color: #8a93a8; font-style: italic; }
.term-out .note.bad { color: var(--term-err); font-style: normal; }
.term-out .note.good { color: #7fd89a; }
.term-in { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-top: 1px solid #2a2f3a; }
.term-in .prompt { color: var(--term-in); white-space: nowrap; }
.term-in input { flex: 1; background: #1a1f2a; color: var(--term-text); border: 1px solid #39404f; font: inherit; padding: 3px 6px; }
.term-in input:disabled { opacity: 0.5; }
.term-in .ibtn { color: var(--term-text); font-size: 11px; white-space: nowrap; min-width: 0; padding: 2px 6px; border-color: #39404f; }
.term.waiting .term-in { background: #1c2a3c; }
.term.waiting .prompt { animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0.3; } }
:root[data-term="phosphor"] .term { background: #030803; color: #59ff7a; }
:root[data-term="phosphor"] .term-out { text-shadow: 0 0 4px rgba(89, 255, 122, 0.55); }
:root[data-term="phosphor"] .term-out .err { color: #ffd166; }
:root[data-term="phosphor"] .term-in input { background: #071207; color: #59ff7a; border-color: #1d4d24; }
:root[data-term="amber"] .term { background: #0a0600; color: #ffb000; }
:root[data-term="amber"] .term-out { text-shadow: 0 0 4px rgba(255, 176, 0, 0.5); }
:root[data-term="amber"] .term-in input { background: #140c00; color: #ffb000; border-color: #4d3500; }

/* ---- problems ------------------------------------------------------------------------------------- */
.probs { font-size: 12px; }
.prob { display: flex; gap: 8px; padding: 4px 8px; border-bottom: 1px solid var(--line); cursor: pointer; align-items: baseline; }
.prob:hover, .prob:focus { background: var(--sel); outline: none; }
.prob .kind { font-weight: bold; text-transform: uppercase; font-size: 10px; min-width: 52px; }
.prob.error .kind { color: var(--err); }
.prob.warning .kind { color: var(--warn); }
.prob.note .kind { color: var(--muted); }
.prob .loc { font-family: var(--font-code); color: var(--muted); white-space: nowrap; }
.prob .msg { flex: 1; }
.empty { padding: 14px; color: var(--muted); }
.buildlog { padding: 8px 10px; font: 12px/1.5 var(--font-code); white-space: pre-wrap; margin: 0; }

/* ---- memory picture --------------------------------------------------------------------------------- */
.mem { position: relative; padding: 8px 30px 30px 8px; font-size: 12px; min-width: 540px; }
.mem-bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.mem-bar label { display: inline-flex; align-items: center; gap: 4px; margin: 0; font-size: 12px; }
.mem-cols { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.mem-col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.mem-col h4 { margin: 0 0 2px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); display: flex; justify-content: space-between; }
.seg { border: 2px solid; border-color: var(--hi) var(--lo) var(--lo) var(--hi); }
.seg-head { padding: 2px 6px; font-weight: bold; display: flex; justify-content: space-between; gap: 6px; color: #fff; font-size: 11px; }
.seg-head .addr { font-weight: normal; font-family: var(--font-code); opacity: 0.9; }
.seg.stack { background: var(--m-stack); }
.seg.stack > .seg-head { background: var(--m-stack-head); }
.seg.heap { background: var(--m-heap); }
.seg.heap > .seg-head { background: var(--m-heap-head); }
.seg.data { background: var(--m-data); }
.seg.data > .seg-head { background: var(--m-data-head); }
.seg.ro { background: var(--m-ro); }
.seg.ro > .seg-head { background: var(--m-ro-head); }
.seg.text { background: var(--m-text); }
.seg.text > .seg-head { background: var(--m-text-head); }
.gap { text-align: center; color: var(--muted); font-size: 11px; padding: 4px; border: 1px dashed var(--line); background: var(--m-free); }
.frame { margin: 4px; border: 1px solid var(--line); background: var(--edit-bg); }
.frame.sel { outline: 2px solid var(--accent); }
.frame.top > .frame-head { background: var(--exec); }
.frame.sys { opacity: 0.75; }
.frame-head { display: flex; justify-content: space-between; gap: 6px; padding: 2px 6px; cursor: pointer; border-bottom: 1px solid var(--line); background: var(--panel2); }
.frame-head .fname { font-family: var(--font-code); font-weight: bold; }
.frame-head .fline { color: var(--muted); }
.cells { display: grid; grid-template-columns: max-content max-content minmax(0, 1fr) max-content; font-family: var(--font-code); }
.cell { display: contents; }
.cell > span { padding: 1px 4px; border-top: 1px solid rgba(128, 128, 128, 0.18); min-width: 0; }
.cell .a { color: var(--muted); font-size: 10px; white-space: nowrap; padding-top: 3px; }
.cell .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 16ch; }
.cell .n .tw { display: inline-block; width: 12px; cursor: pointer; color: var(--muted); user-select: none; }
.cell .v { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative; }
.cell .t { color: var(--muted); font-size: 10px; white-space: nowrap; text-align: right; padding-top: 3px; }
.mem.no-types .cell .t { display: none; }
.mem.no-types .cells { grid-template-columns: max-content max-content minmax(0, 1fr); }
.mem.no-addrs .cell .a { display: none; }
.mem.no-addrs .cells { grid-template-columns: max-content minmax(0, 1fr) max-content; }
.mem.no-addrs.no-types .cells { grid-template-columns: max-content minmax(0, 1fr); }
.cell.link .n, .cell.link .v { color: var(--muted); font-style: italic; }
.cell.guard .n, .cell.guard .v { color: var(--muted); font-size: 10px; }
.cell .v.edit { cursor: text; }
.cell .v.edit:hover { background: var(--sel); }
.cell .v.ro::after { content: " \1F512"; font-size: 9px; opacity: 0.6; }
.cell .v.uninit { color: var(--m-uninit); }
.cell .v.ptr { padding-right: 14px; }
.cell .v .dot { position: absolute; right: 3px; top: 50%; width: 7px; height: 7px; margin-top: -3px; border-radius: 50%; background: var(--m-arrow); }
.cell .v .dot.bad { background: var(--m-arrow-bad); }
.cell .v .dot.null { background: none; border: 1px solid var(--muted); border-radius: 0; width: 8px; height: 2px; margin-top: 0; }
.cell.changed > span.v { background: var(--m-changed); transition: background 1.5s; }
.cell.hot > span { background: var(--err-bg) !important; }
.cell.target > span { background: var(--sel); }
.cell.sub .n { padding-left: calc(4px + var(--d, 1) * 12px); }
.cell .v input { width: 100%; padding: 0 3px; font: inherit; border-width: 1px; }
.blk { margin: 4px; border: 1px solid var(--line); background: var(--edit-bg); }
.blk-head { display: flex; justify-content: space-between; gap: 6px; padding: 2px 6px; background: var(--panel2); border-bottom: 1px solid var(--line); font-size: 11px; }
.blk.freed { background: repeating-linear-gradient(45deg, transparent 0 6px, rgba(128, 128, 128, 0.15) 6px 12px); }

.blk.leak .blk-head { background: var(--warn-bg); }

.mem-svg { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }

.mem-svg path.bad { stroke: var(--m-arrow-bad); stroke-dasharray: 4 3; }
.mem-svg path.hl { stroke-width: 3; opacity: 1; }
.mem-svg .head { fill: var(--m-arrow); }
.mem-svg .head.bad { fill: var(--m-arrow-bad); }
.fnlist .cell .n { font-weight: bold; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; font-size: 11px; color: var(--muted); margin-top: 10px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 4px; vertical-align: -1px; border: 1px solid var(--line); }
.legend .lg-stack::before { background: var(--m-stack); }
.legend .lg-heap::before { background: var(--m-heap); }
.legend .lg-data::before { background: var(--m-data); }
.legend .lg-ro::before { background: var(--m-ro); }
.legend .lg-text::before { background: var(--m-text); }
.mem-note { padding: 18px; color: var(--muted); line-height: 1.6; }
.fault-box { margin: 0 0 8px; padding: 6px 8px; border: 2px solid var(--err); background: var(--err-bg); }
.fault-box b { color: var(--err); }
.ret-box { margin: 0 0 8px; padding: 4px 8px; border: 1px solid var(--line); background: var(--edit-bg); font-family: var(--font-code); }

/* ---- lesson card --------------------------------------------------------------------------------------- */
.lesson-card { flex: none; max-height: 46%; display: flex; flex-direction: column; border-bottom: 3px solid var(--lo); background: var(--panel2); }
.lesson-mini { display: none; }
.lesson-card.folded .lesson-pane, .lesson-card.folded .lesson-nav { display: none; }
.lesson-head { display: flex; justify-content: space-between; align-items: center; padding: 2px 4px 2px 8px; background: var(--title); color: var(--title-text); }
.lesson-head .ibtn { color: var(--title-text); }
.lesson-head .muted { color: inherit; opacity: 0.75; font-size: 11px; }
.lesson-card .lesson-pane { overflow: auto; flex: 1; min-height: 60px; }
.lesson-pane p { margin: 0 0 7px; }
.lesson-pane code { font-family: var(--font-code); background: var(--edit-bg); padding: 0 3px; border: 1px solid var(--line); }
.lesson-pane code[data-goto] { cursor: pointer; text-decoration: underline dotted; }
.lesson-pane .note { border-left: 4px solid var(--exec-mark); padding: 3px 8px; background: var(--edit-bg); margin: 6px 0; }
.lesson-pane .try { border-left: 4px solid var(--ok); padding: 3px 8px; background: var(--edit-bg); margin: 6px 0; }

@media (max-width: 720px), (max-height: 500px) and (max-width: 920px) {
  .app[data-view="code"] .lesson-card, .app[data-view="run"] .lesson-card { display: none; }
  .app:not([data-view="memory"]) .lesson-mini { display: flex; gap: 6px; align-items: center; padding: 4px 8px; background: var(--title); color: var(--title-text); flex: none; font-size: 12px; }
  .lesson-mini .grow { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lesson-card { max-height: 50%; }
}

/* ---- variables, watch, breakpoints, bytes ----------------------------------------------------------- */
.vars { font-family: var(--font-code); font-size: 12px; }
.vgroup { padding: 3px 8px; background: var(--panel); border-bottom: 1px solid var(--line); font: bold 11px var(--font-ui); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.vrow { display: grid; grid-template-columns: minmax(90px, 0.9fr) minmax(90px, 1.4fr) minmax(50px, 0.7fr); gap: 6px; padding: 2px 8px; border-bottom: 1px solid rgba(128, 128, 128, 0.15); align-items: baseline; }
.vrow .vn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vrow .vn .tw { display: inline-block; width: 12px; cursor: pointer; color: var(--muted); }
.vrow .vv { word-break: break-all; }
.vrow .vv.edit { cursor: text; }
.vrow .vv.edit:hover { background: var(--sel); }
.vrow .vt { color: var(--muted); font-size: 10px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vrow.changed .vv { background: var(--m-changed); }
.vrow .vv.uninit { color: var(--m-uninit); }
.vrow input { font: inherit; padding: 0 3px; border-width: 1px; }
.frames-list .fr { padding: 3px 8px; cursor: pointer; border-bottom: 1px solid rgba(128, 128, 128, 0.15); display: flex; justify-content: space-between; gap: 8px; }

.frames-list .fr .floc { color: var(--muted); }
.watch-add { display: flex; gap: 4px; padding: 6px 8px; }
.watch-add input { flex: 1; font-family: var(--font-code); }
.wrow { display: grid; grid-template-columns: 1fr 1.4fr auto; gap: 6px; padding: 3px 8px; border-bottom: 1px solid rgba(128, 128, 128, 0.15); align-items: baseline; font-family: var(--font-code); font-size: 12px; }
.wrow .we { color: var(--c-fn); }
.wrow .wv.err { color: var(--muted); font-style: italic; font-family: var(--font-ui); }
.wrow .wtools { display: flex; gap: 2px; }
.wrow .wtools .ibtn { min-width: 22px; min-height: 22px; }
.wrow .wtools .ibtn.on { color: var(--err); border-color: var(--lo) var(--hi) var(--hi) var(--lo); }
.bprow { display: flex; gap: 8px; align-items: center; padding: 3px 8px; border-bottom: 1px solid rgba(128, 128, 128, 0.15); font-size: 12px; }
.bprow .bploc { font-family: var(--font-code); cursor: pointer; flex: 1; }
.bprow input[type="text"] { width: 160px; font-family: var(--font-code); font-size: 11px; }
.hex { font: 12px/1.6 var(--font-code); padding: 6px 8px; }
.hex-bar { display: flex; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--line); align-items: center; flex-wrap: wrap; }
.hex-bar input { width: 170px; font-family: var(--font-code); }
.hex-row { white-space: pre; }
.hex-row .ha { color: var(--muted); }
.hex-row b { font-weight: normal; padding: 0 1px; cursor: default; }
.hex-row b.s0 { color: var(--muted); opacity: 0.45; }
.hex-row b.s1 { color: var(--muted); }
.hex-row b.s2 { color: var(--c-kw); }
.hex-row b.s3 { color: var(--m-uninit); }
.hex-row b.s5 { background: var(--warn-bg); }
.hex-row b.s6 { background: var(--err-bg); color: var(--muted); }
.hex-row b.s7 { text-decoration: line-through; color: var(--muted); }
.hex-row b.s8 { color: var(--c-pp); }
.hex-row b.sel { outline: 1px solid var(--accent); background: var(--sel); }
.hex-row .asc { color: var(--muted); }
.hex-info { padding: 6px 8px; border-top: 1px solid var(--line); font-size: 12px; min-height: 2.5em; }

/* ---- hover callout ------------------------------------------------------------------------------------ */
.callout { position: fixed; z-index: 55; min-width: 220px; max-width: min(460px, 94vw); max-height: 60vh; overflow: auto; background: var(--panel2); border: 2px solid; border-color: var(--hi) var(--lo) var(--lo) var(--hi); box-shadow: var(--shadow); font-size: 12px; }
.callout .co-head { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 3px 6px; background: var(--title); color: var(--title-text); }
.callout .co-head code { font-weight: bold; }
.callout .co-head .ibtn { color: var(--title-text); min-width: 20px; min-height: 20px; }
.callout .co-meta { padding: 4px 8px; color: var(--muted); font-size: 11px; font-family: var(--font-code); border-bottom: 1px solid var(--line); }
.callout .co-note { padding: 4px 8px; color: var(--muted); font-size: 11px; border-top: 1px solid var(--line); }

/* ---- side tree ---------------------------------------------------------------------------------------- */
.tree { padding: 3px 0; }
.trow { display: flex; align-items: center; gap: 4px; padding: 3px 6px; cursor: pointer; white-space: nowrap; }
.trow:hover { background: var(--panel2); }
.trow.sel { background: var(--accent); color: var(--accent-text); }
.trow.open .name { font-weight: bold; }
.trow svg { width: 15px; height: 15px; flex: none; }
.trow .twisty { width: 10px; color: var(--muted); }
.trow .name { overflow: hidden; text-overflow: ellipsis; }
.trow .tag { font-size: 10px; color: var(--muted); margin-left: auto; padding-left: 6px; }
.trow.sel .tag { color: inherit; }
.side-note { padding: 10px; color: var(--muted); font-size: 11px; line-height: 1.5; }

/* ---- menus, dialogs, toasts --------------------------------------------------------------------------- */
.menu-pop { position: fixed; z-index: 70; min-width: 200px; background: var(--panel); border: 2px solid; border-color: var(--hi) var(--lo) var(--lo) var(--hi); box-shadow: var(--shadow); padding: 2px; max-height: 85vh; overflow: auto; }
.menu-item { display: flex; justify-content: space-between; gap: 18px; padding: 4px 10px 4px 22px; cursor: default; position: relative; white-space: nowrap; }
.menu-item:hover, .menu-item.active { background: var(--accent); color: var(--accent-text); }
.menu-item.disabled { opacity: 0.45; pointer-events: none; }
.menu-item.checked::before { content: "\2713"; position: absolute; left: 6px; }
.menu-item .sc { color: var(--muted); font-size: 11px; }
.menu-item:hover .sc, .menu-item.active .sc { color: inherit; }
.menu-sep { border-top: 1px solid var(--lo); border-bottom: 1px solid var(--hi); margin: 3px 2px; }
.menu-head { padding: 4px 10px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.sub-arrow { margin-left: auto; }
.modal-back { position: fixed; inset: 0; background: rgba(20, 24, 36, 0.4); z-index: 80; display: grid; place-items: center; padding: 10px; }
.modal { background: var(--panel); border: 2px solid; border-color: var(--hi) var(--lo) var(--lo) var(--hi); box-shadow: var(--shadow); width: min(480px, 100%); max-height: 92vh; display: flex; flex-direction: column; }
.modal.wide { width: min(820px, 100%); }
.modal-head { background: var(--title); color: var(--title-text); padding: 4px 10px; font-weight: bold; }
.modal-body { padding: 12px; overflow: auto; line-height: 1.5; }
.modal-body p { margin: 0 0 8px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 6px; padding: 8px 12px; border-top: 1px solid var(--lo); flex-wrap: wrap; }
.toasts { position: fixed; bottom: 34px; left: 50%; transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.toast { background: var(--panel2); border: 2px solid; border-color: var(--hi) var(--lo) var(--lo) var(--hi); padding: 6px 14px; box-shadow: var(--shadow); max-width: 90vw; }
.toast.err { border-left: 6px solid var(--err); }
.toast.ok { border-left: 6px solid var(--ok); }
.list-row { display: flex; gap: 8px; align-items: center; padding: 5px 8px; border-bottom: 1px solid var(--line); }
.list-row.clickable { cursor: pointer; }
.list-row.clickable:hover { background: var(--sel); }
.grow { flex: 1; min-width: 0; }
.hint { color: var(--muted); font-size: 12px; }

/* ---- status bar --------------------------------------------------------------------------------------- */
.statusbar { display: flex; gap: 10px; align-items: center; padding: 2px 8px; background: var(--panel); border-top: 2px solid var(--hi); font-size: 12px; flex: none; min-height: 24px; }
.statusbar > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-state { font-weight: bold; padding: 0 6px; border: 2px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo); }
.st-msg { flex: 1; color: var(--muted); }
.st-pos { font-family: var(--font-code); color: var(--muted); }

/* ---- library, lessons, reference, tours ------------------------------------------------------------- */
.lib { display: grid; grid-template-columns: 210px 1fr; gap: 10px; height: 64vh; }
.lib-cats { overflow: auto; border: 2px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo); background: var(--edit-bg); }
.lib-cat { padding: 5px 8px; cursor: pointer; display: flex; justify-content: space-between; }
.lib-cat.sel { background: var(--accent); color: var(--accent-text); }
.lib-cat .n { color: var(--muted); font-size: 11px; }
.lib-cat.sel .n { color: inherit; }
.lib-main { display: flex; flex-direction: column; min-width: 0; gap: 6px; }
.lib-list { flex: 1; overflow: auto; border: 2px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo); background: var(--edit-bg); }
.lib-item { padding: 6px 10px; border-bottom: 1px solid var(--line); cursor: pointer; }
.lib-item:hover { background: var(--sel); }
.lib-item b { font-family: var(--font-code); }
.lib-item .d { color: var(--muted); font-size: 12px; }
.lib-item .lv { float: right; font-size: 10px; color: var(--muted); }
.lesson-pane { padding: 10px 12px; line-height: 1.55; font-size: 13px; }
.lesson-pane h3 { margin: 0 0 6px; }
.lesson-pane pre { background: var(--edit-bg); padding: 6px 8px; border: 1px solid var(--line); overflow: auto; font-size: 12px; }
.lesson-pane .task { border-left: 4px solid var(--accent); padding: 4px 8px; background: var(--edit-bg); margin: 8px 0; }
.lesson-nav { display: flex; gap: 6px; padding: 6px 12px; border-top: 1px solid var(--line); align-items: center; flex-wrap: wrap; }
.lesson-nav .grow { color: var(--muted); font-size: 12px; }
.ref { display: grid; grid-template-columns: 220px 1fr; gap: 10px; height: 66vh; }
.ref-list { overflow: auto; border: 2px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo); background: var(--edit-bg); }
.ref-list .rh { padding: 4px 8px; font-weight: bold; background: var(--panel2); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
.ref-list .ri { padding: 3px 8px 3px 14px; cursor: pointer; font-family: var(--font-code); font-size: 12px; }
.ref-list .ri.sel { background: var(--accent); color: var(--accent-text); }
.ref-body { overflow: auto; padding: 4px 10px; line-height: 1.55; }
.ref-body pre { background: var(--edit-bg); padding: 6px 8px; border: 1px solid var(--line); overflow: auto; }
.ref-body .sig { font-family: var(--font-code); background: var(--edit-bg); padding: 6px 8px; border: 1px solid var(--line); }
.tour-pop { position: fixed; z-index: 85; width: min(360px, 92vw); background: var(--panel); border: 2px solid; border-color: var(--hi) var(--lo) var(--lo) var(--hi); box-shadow: var(--shadow); }
.tour-pop .th { background: var(--title); color: var(--title-text); padding: 4px 10px; font-weight: bold; display: flex; justify-content: space-between; }
.tour-pop .tb { padding: 10px 12px; line-height: 1.5; }
.tour-pop .tb code { background: var(--edit-bg); padding: 0 3px; }
.tour-pop .tf { display: flex; gap: 6px; padding: 6px 10px; border-top: 1px solid var(--lo); align-items: center; }
.tour-pop .tf .count { flex: 1; color: var(--muted); font-size: 12px; }
.tour-ring { position: fixed; z-index: 84; border: 3px solid var(--exec-mark); box-shadow: 0 0 0 4000px rgba(10, 14, 30, 0.35); pointer-events: none; transition: all 0.25s; }
.welcome { max-width: 640px; }
.welcome h2 { margin: 0 0 6px; }
.welcome .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; margin: 12px 0; }
.welcome .choice { text-align: left; padding: 10px; background: var(--face); border: 2px solid; border-color: var(--hi) var(--lo) var(--lo) var(--hi); cursor: pointer; }
.welcome .choice b { display: block; margin-bottom: 3px; }
.welcome .choice span { color: var(--muted); font-size: 12px; }
.author { line-height: 1.5; }
.author-head { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 10px; flex-wrap: wrap; }
.author-photo { padding: 6px; background: var(--face); border: 2px solid; border-color: var(--hi) var(--lo) var(--lo) var(--hi); }
.author-photo img { display: block; width: 128px; height: 160px; image-rendering: pixelated; filter: contrast(1.05); }
.author-name { font-size: 18px; font-weight: bold; }
.author-role { color: var(--muted); }
.author-nums { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 8px 0; font-size: 12px; }
.author-sec { margin-top: 10px; }
.author-sec-t { font-weight: bold; border-bottom: 1px solid var(--lo); margin-bottom: 4px; }
.author-row { margin: 2px 0; }

/* ---- phones and tablets ------------------------------------------------------------------------------ */
.mobilebar { display: none; }
@media (max-width: 980px) {
  .right { width: 380px; }
  .side { width: 190px; }
}
@media (max-width: 720px), (max-height: 500px) and (max-width: 920px) {
  .menubar { display: none; }
  .titlebar .doc-title { display: none; }
  .work { position: relative; }
  .side, .right, .center { position: absolute; inset: 0; width: auto !important; display: none; }
  .split.v { display: none !important; }
  .app[data-view="files"] .side { display: flex; }
  .app[data-view="code"] .center, .app[data-view="run"] .center { display: flex; }
  .app[data-view="code"] .bottom, .app[data-view="code"] #splitBottom { display: none; }
  .app[data-view="run"] .tabs, .app[data-view="run"] .editors, .app[data-view="run"] #splitBottom { display: none; }
  .app[data-view="run"] .bottom { flex: 1; height: auto !important; }
  .app[data-view="memory"] .right { display: flex; }
  .mobilebar { display: flex; border-top: 2px solid var(--hi); background: var(--panel); flex: none; }
  .mobilebar button { flex: 1; background: none; border: none; padding: 6px 2px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--text); min-height: 44px; }
  .mobilebar button svg { width: 18px; height: 18px; }
  .mobilebar button.active { background: var(--panel2); font-weight: bold; box-shadow: inset 0 3px 0 var(--accent); }
  .tbtn .lbl { display: none; }
  .tbtn { padding: 3px 7px; min-height: 36px; min-width: 36px; justify-content: center; }
  .statusbar .st-pos { display: none; }
  .mem { min-width: 0; }
  .mem-cols { grid-template-columns: 1fr; gap: 10px; }
  .lib, .ref { grid-template-columns: 1fr; height: auto; }
  .lib-cats, .ref-list { max-height: 26vh; }
  .lib-list { max-height: 44vh; }
  .ed { --code-size: 13px; }
}
@media (pointer: coarse) {
  .ibtn { min-width: 34px; min-height: 34px; }
  .trow { padding: 7px 8px; }
  .menu-item { padding: 9px 12px 9px 24px; }
}
@media print {
  .toolbar, .menubar, .statusbar, .mobilebar, .side, .split { display: none !important; }
}

<body>
<div id="app" class="app">
  <header class="titlebar" id="titlebar">
    <div class="tb-left">
      <span class="logo" aria-hidden="true">C</span>
      <span class="appname">See</span>
      <span class="doc-title" id="docTitle"></span>
    </div>
    <div class="tb-right">
      <button class="ibtn" id="btnTheme" type="button" title="Light or dark" aria-label="Light or dark"></button>
      <button class="ibtn" id="btnHelpTop" type="button" title="Help" aria-label="Help"></button>
    </div>
  </header>
  <nav class="menubar" id="menubar" role="menubar" aria-label="Menu"></nav>
  <div class="toolbar" id="toolbar" role="toolbar" aria-label="Tools"></div>
  <main class="work" id="work">
    <aside class="side" id="side" aria-label="Files">
      <div class="pane-head"><span class="pane-title" id="sideTitle">Files</span><span class="pane-tools" id="sideTools"></span></div>

  const { T, Q_CONST, Q_VOLATILE } = Types;

  const KEYWORDS = new Set(['auto', 'break', 'case', 'char', 'const', 'continue', 'default', 'do', 'double', 'else', 'enum', 'extern',
    'float', 'for', 'goto', 'if', 'int', 'long', 'register', 'return', 'short', 'signed', 'sizeof', 'static', 'struct', 'switch',
    'typedef', 'union', 'unsigned', 'void', 'volatile', 'while']);
  const TYPE_WORDS = new Set(['void', 'char', 'short', 'int', 'long', 'float', 'double', 'signed', 'unsigned', 'struct', 'union', 'enum', 'const', 'volatile']);
  const STORAGE = new Set(['typedef', 'extern', 'static', 'auto', 'register']);
  const ASSIGN_OPS = new Set(['=', '*=', '/=', '%=', '+=', '-=', '<<=', '>>=', '&=', '^=', '|=']);
  const BIN_PREC = { '||': 1, '&&': 2, '|': 3, '^': 4, '&': 5, '==': 6, '!=': 6, '<': 7, '>': 7, '<=': 7, '>=': 7, '<<': 8, '>>': 8, '+': 9, '-': 9, '*': 10, '/': 10, '%': 10 };

  class Scope {
    constructor(parent, kind) { this.parent = parent; this.kind = kind; this.names = new Map(); this.tags = new Map(); }
    find(name) { for (let s = this; s; s = s.parent) { const v = s.names.get(name) || (s.fallback && s.fallback(name)); if (v) return v; } return null; }
    findTag(name) { for (let s = this; s; s = s.parent) { const v = s.tags.get(name) || (s.tagFallback && s.tagFallback(name)); if (v) return v; } return null; }
  }

  /**
   * Parse one translation unit.
   * tokens: from SEE.Cpp.preprocess; unit: {id, file}
   * Returns {globals, functions, strings, warnings, unit}
   */
  function parse(tokens, unit) {
    const toks = tokens.map((t) => (t.k === 'id' && KEYWORDS.has(t.v) ? Object.assign({}, t, { k: 'kw' }) : t));
    let p = 0;
    const warnings = [];
    const file = new Scope(null, 'file');
    const globals = [];         // file-scope objects and functions, by first declaration
    const functions = [];       // definitions
    const strings = [];         // string literals of this unit
    const staticLocals = [];
    let fn = null;              // current function context
    let blockDepth = 0;
    let scope = file;
    const EOF = { k: 'eof', v: '<end of file>', file: unit.file, line: tokens.length ? tokens[tokens.length - 1].line : 1, col: 1 };

    // ---- token helpers ------------------------------------------------------------------------------
    const peek = (k) => toks[p + (k || 0)] || EOF;
    const pos = (t) => { t = t || peek(); return { file: t.file, line: t.line, col: t.col }; };
    const err = (msg, t) => new CError(msg, t && t.file !== undefined ? pos(t) : t || pos());
    const warn = (msg, at) => warnings.push(new CError(msg, at && at.file !== undefined && at.line !== undefined ? { file: at.file, line: at.line, col: at.col } : pos(), 'warning'));
    const is = (v, k) => { const t = peek(k); return (t.k === 'p' || t.k === 'kw') && t.v === v; };
    const accept = (v) => { if (is(v)) { p++; return true; } return false; };
    const spell = (t) => (t.k === 'eof' ? 'end of file' : t.k === 'str' ? '"' + t.v + '"' : t.k === 'char' ? "'" + t.v + "'" : t.v);
    const expect = (v, what) => {
      if (is(v)) return toks[p++];
      const t = peek();
      if (v === ';') {
        const prev = toks[p - 1];
        throw err("expected ';' " + (what || 'before ' + quoteTok(t)), prev ? { file: prev.file, line: prev.line, col: prev.col + String(prev.v).length } : t);
      }
      throw err("expected '" + v + "' " + (what || 'before ' + quoteTok(t)), t);
    };
    const quoteTok = (t) => (t.k === 'eof' ? 'end of input' : "'" + spell(t) + "'");
    const isTypedefName = (t) => { if (t.k !== 'id') return false; const s = scope.find(t.v); return !!(s && s.kind === 'typedef'); };
    const startsType = (k) => { const t = peek(k); return (t.k === 'kw' && (TYPE_WORDS.has(t.v) || STORAGE.has(t.v))) || isTypedefName(t); };
    const startsTypeName = (k) => { const t = peek(k); return (t.k === 'kw' && TYPE_WORDS.has(t.v)) || isTypedefName(t); };

    if (unit.expression) return expressionOnly(unit.expression);

    // ---- top level ----------------------------------------------------------------------------------
    while (peek().k !== 'eof') {
      if (accept(';')) { warn('ISO C does not allow extra ";" outside of a function', toks[p - 1]); continue; }
      externalDeclaration();
    }
    // tentative definitions become definitions with zero value
    for (const g of globals) {
      if (g.kind === 'var' && !g.defined && g.tentative) {
        if (g.type.k === 'array' && g.type.n === null) { warn("array '" + g.name + "' assumed to have one element", g.pos); g.type = Types.array(g.type.of, 1); }
        if (!Types.isComplete(g.type)) throw err("storage size of '" + g.name + "' isn't known", g.pos);
        g.defined = true; g.init = null; g.bss = true;
      }
    }
    for (const g of globals) {
      if (g.kind === 'func' && g.linkage === 'internal' && !g.defined && g.used) warn("'" + g.name + "' used but never defined", g.pos);
      if (g.kind === 'func' && g.linkage === 'internal' && g.defined && !g.used && g.name !== 'main') warn("'" + g.name + "' defined but not used", g.pos);
    }
    const typedefs = new Map(), enumConsts = [];
    for (const [k, v] of file.names) {
      if (v.kind === 'typedef') typedefs.set(k, v.type);
      if (v.kind === 'enumconst') enumConsts.push(v);
    }
    return { unit, globals: globals.concat(staticLocals), functions, strings, warnings, tags: file.tags, typedefs, enumConsts };

    /** Parse just one expression, with names supplied by the debugger */
    function expressionOnly(x) {
      file.fallback = (name) => {
        const r = x.lookup(name);
        if (r) return r;
        const t = x.typedefs && x.typedefs(name);
        return t ? { kind: 'typedef', name, type: t } : null;
      };
      file.tagFallback = (name) => (x.tags ? x.tags(name) : null);
      fn = { name: '<debugger>', frame: 0, maxFrame: 0, locals: [], labels: new Map(), gotos: [], params: [], retType: T.int, switches: [], ctl: [], temps: 0, pos: pos() };
      const e = expr();
      if (peek().k !== 'eof') throw err('unexpected ' + quoteTok(peek()) + ' after the expression', peek());
      return e;
    }

    function externalDeclaration() {
      const start = peek();
      const spec = declSpecs(true);
      if (accept(';')) { declareTagOnly(spec, start); return; }
      let first = true;
      for (;;) {
        const d = declarator(false);
        if (!d.name) throw err('expected identifier or ( before ' + quoteTok(peek()), peek());
        let type = d.build(spec.type);
        // function definition?
        if (first && type.k === 'func' && (is('{') || (startsType() && d.knr))) {
          functionDefinition(spec, d, type);
          return;
        }
        first = false;
        const sym = declareGlobal(spec, d, type);
        if (accept('=')) {
          if (spec.storage === 'typedef') throw err("typedef '" + d.name + "' is initialized", d.pos);
          if (type.k === 'func') throw err("function '" + d.name + "' is initialized like a variable", d.pos);
          if (spec.storage === 'extern') warn("'" + d.name + "' initialized and declared 'extern'", d.pos);
          const init = initializer();
          if (sym.defined && sym.init !== undefined && sym.hasInit) throw err("redefinition of '" + d.name + "'", d.pos);
          sym.type = completeArrayFromInit(sym.type, init);
          sym.init = flattenInit(sym.type, init, true, d.name);
          sym.hasInit = true;
          sym.defined = true;
          sym.tentative = false;
          sym.defPos = d.pos;
          if (!Types.isComplete(sym.type)) throw err("storage size of '" + d.name + "' isn't known", d.pos);
        }
        if (accept(',')) continue;
        expect(';', 'after declaration');
        return;
      }
    }

    function declareTagOnly(spec, at) {
      if (!spec.tagDecl && spec.type.k !== 'enum') warn('useless type name in empty declaration', at);
      if (spec.storage && spec.storage !== 'typedef') warn("useless storage class specifier in empty declaration", at);
    }

    function declareGlobal(spec, d, type) {
      const name = d.name;
      if (spec.storage === 'typedef') {
        const old = file.names.get(name);
        if (old && (old.kind !== 'typedef' || !Types.compatible(old.type, type))) throw err("conflicting types for '" + name + "'", d.pos);
        if (old) warn("redefinition of typedef '" + name + "'", d.pos);
        file.names.set(name, { kind: 'typedef', name, type, pos: d.pos });
        return { kind: 'typedef' };
      }
      if (spec.storage === 'auto' || spec.storage === 'register') throw err("file-scope declaration of '" + name + "' specifies '" + spec.storage + "'", d.pos);
      const isFn = type.k === 'func';
      const linkage = spec.storage === 'static' ? 'internal' : 'external';
      let sym = file.names.get(name);
      if (sym) {
        if (sym.kind === 'typedef' || sym.kind === 'enumconst') throw err("'" + name + "' redeclared as different kind of symbol", d.pos);
        if ((sym.kind === 'func') !== isFn) throw err("'" + name + "' redeclared as different kind of symbol", d.pos);
        if (!Types.compatible(sym.type, type)) throw err("conflicting types for '" + name + "'" + note(sym), d.pos);
        sym.type = Types.composite(sym.type, type);
        if (isFn && d.params && !sym.defined) sym.paramNames = d.params;
        if (linkage === 'internal' && sym.linkage === 'external' && !sym.implicit) throw err("static declaration of '" + name + "' follows non-static declaration", d.pos);
        if (spec.storage !== 'extern' && spec.storage !== 'static' && sym.linkage === 'internal' && !isFn) throw err("non-static declaration of '" + name + "' follows static declaration", d.pos);
        if (sym.implicit) { sym.implicit = false; if (linkage === 'internal') sym.linkage = 'internal'; }
      } else {
        sym = { kind: isFn ? 'func' : 'var', name, type, linkage, storage: 'global', defined: false, pos: d.pos, unit: unit.id, paramNames: d.params };
        file.names.set(name, sym);
        globals.push(sym);
      }
      if (!isFn && spec.storage !== 'extern') {
        sym.tentative = !sym.hasInit;
        if (!sym.hasInit && spec.storage !== 'extern') sym.tentative = true;
      }
      if (!isFn && spec.storage === 'extern') sym.isExtern = true;
      return sym;
    }
    function note(sym) { return sym.pos ? ' (previous declaration at line ' + sym.pos.line + ')' : ''; }

    // ---- declaration specifiers ---------------------------------------------------------------------
    function declSpecs(allowStorage) {
      let storage = null, q = 0;
      const words = [];
      let type = null, tagDecl = false;
      const at = peek();
      for (;;) {
        const t = peek();
        if (t.k === 'kw' && STORAGE.has(t.v)) {
          if (!allowStorage) throw err("storage class specified for " + (allowStorage === false ? 'type name' : 'parameter'), t);
          if (storage) throw err('multiple storage classes in declaration specifiers', t);
          storage = t.v; p++; continue;
        }
        if (t.k === 'kw' && (t.v === 'const' || t.v === 'volatile')) {
          const b = t.v === 'const' ? Q_CONST : Q_VOLATILE;
          if (q & b) warn("duplicate '" + t.v + "'", t);
          q |= b; p++; continue;
        }
        if (t.k === 'kw' && (t.v === 'struct' || t.v === 'union')) {
          if (type || words.length) throw err('two or more data types in declaration specifiers', t);
          p++; const r = structSpec(t.v); type = r.type; tagDecl = r.decl; continue;
        }
        if (t.k === 'kw' && t.v === 'enum') {
          if (type || words.length) throw err('two or more data types in declaration specifiers', t);
          p++; const r = enumSpec(); type = r.type; tagDecl = r.decl; continue;
        }
        if (t.k === 'kw' && ['void', 'char', 'short', 'int', 'long', 'float', 'double', 'signed', 'unsigned'].includes(t.v)) {
          if (type) throw err('two or more data types in declaration specifiers', t);
          words.push(t); p++; continue;
        }
        if (t.k === 'id' && !type && !words.length && isTypedefName(t)) {
          // a typedef name is a type only when no other type was given
          const s = scope.find(t.v);
          type = s.type; p++; continue;
        }
        break;
      }
      if (!type) {
        if (!words.length) {
          if (!storage && !q) throw err('expected declaration specifiers before ' + quoteTok(peek()), peek());
          warn("type defaults to 'int' in declaration", at);
          type = T.int;
        } else type = basicFromWords(words);
      }
      return { storage, type: Types.qual(type, q), tagDecl, pos: pos(at) };
    }

    function basicFromWords(words) {
      const c = {};
      for (const w of words) c[w.v] = (c[w.v] || 0) + 1;
      const at = words[0];
      const key = Object.keys(c).sort().map((k) => k + (c[k] > 1 ? c[k] : '')).join(' ');
      const MAP = {
        'void': 'void', 'char': 'char', 'char signed': 'schar', 'char unsigned': 'uchar',
        'short': 'short', 'short signed': 'short', 'int short': 'short', 'int short signed': 'short',
        'short unsigned': 'ushort', 'int short unsigned': 'ushort',
        'int': 'int', 'signed': 'int', 'int signed': 'int', 'unsigned': 'uint', 'int unsigned': 'uint',
        'long': 'long', 'long signed': 'long', 'int long': 'long', 'int long signed': 'long',
        'long unsigned': 'ulong', 'int long unsigned': 'ulong',
        'float': 'float', 'double': 'double', 'double long': 'ldouble',
      };
      if (c.long > 1) throw err("'long long' is not part of C89", words[0]);
      const k = MAP[key];
      if (!k) throw err('invalid combination of type specifiers: ' + words.map((w) => w.v).join(' '), at);
      return T[k];
    }

    function structSpec(kind) {
      const at = toks[p - 1];
      let tag = null;
      if (peek().k === 'id') tag = toks[p++].v;
      if (!tag && !is('{')) throw err("expected '{' or a tag name after '" + kind + "'", peek());
      if (is('{')) {
        // definition: a new type in this scope unless an incomplete one of the same tag is here
        let t = tag ? scope.tags.get(tag) : null;
        if (t && t.k !== kind) throw err("'" + tag + "' defined as wrong kind of tag", at);
        if (t && t.complete) throw err('redefinition of \'' + kind + ' ' + tag + "'", at);
        if (!t) { t = Types.newTag(kind, tag); if (tag) scope.tags.set(tag, t); }
        t.pos = pos(at);
        p++;
        const members = [];
        const names = new Set();
        while (!accept('}')) {
          if (peek().k === 'eof') throw err("expected '}' at end of input", peek());
          const sp = declSpecs(null);
          if (accept(';')) { warn('declaration does not declare anything', toks[p - 1]); continue; }
          for (;;) {
            let d = { name: null, build: (b) => b, pos: pos() };
            if (!is(':')) d = declarator(false);
            let mt = d.build(sp.type);
            let bits;
            if (accept(':')) {
              const e = condExpr();
              bits = intConst(e, 'bit-field width');
              if (!Types.isInt(mt) || !['int', 'uint', 'enum'].includes(Types.unqual(mt).k)) {
                if (Types.isInt(mt)) warn("bit-field '" + (d.name || '') + "' type is not int, unsigned int or signed int", d.pos);
                else throw err("bit-field '" + (d.name || '') + "' has invalid type", d.pos);
              }
              if (bits < 0) throw err("negative width in bit-field '" + (d.name || '') + "'", d.pos);
              if (bits > 32) throw err("width of '" + (d.name || '') + "' exceeds its type", d.pos);
              if (bits === 0 && d.name) throw err("zero width for bit-field '" + d.name + "'", d.pos);
            }
            if (mt.k === 'func') throw err("field '" + d.name + "' declared as a function", d.pos);
            if (!Types.isComplete(mt)) {
              if (mt.k === 'array' && mt.n === null) throw err("flexible array member '" + d.name + "' is not part of C89", d.pos);
              throw err("field '" + d.name + "' has incomplete type", d.pos);
            }
            if (d.name) {
              if (names.has(d.name)) throw err("duplicate member '" + d.name + "'", d.pos);
              names.add(d.name);
            }
            if (d.name || bits !== undefined) members.push({ name: d.name, type: mt, bits, pos: d.pos });
            if (accept(',')) continue;
            expect(';', 'at end of member declaration');
            break;
          }
        }
        if (!members.length) warn(kind + ' has no members', at);
        Types.layout(t, members);
        return { type: t, decl: true };
      }
      // reference
      let t = scope.findTag(tag);
      if (t && t.k !== kind) throw err("'" + tag + "' defined as wrong kind of tag", at);
      // "struct x;" alone declares a new incomplete type in this scope
      if (is(';') && (!t || !scope.tags.has(tag))) {
        t = Types.newTag(kind, tag); scope.tags.set(tag, t); t.pos = pos(at);
        return { type: t, decl: true };
      }
      if (!t) { t = Types.newTag(kind, tag); file.tags.set(tag, t); t.pos = pos(at); }
      return { type: t, decl: false };
    }

    function enumSpec() {
      const at = toks[p - 1];
      let tag = null;
      if (peek().k === 'id') tag = toks[p++].v;
      if (is('{')) {
        let t = tag ? scope.tags.get(tag) : null;
        if (t && (t.k !== 'enum' || t.complete)) throw err(t.k !== 'enum' ? "'" + tag + "' defined as wrong kind of tag" : "redeclaration of 'enum " + tag + "'", at);
        if (!t) { t = Types.newTag('enum', tag); if (tag) scope.tags.set(tag, t); }
        p++;
        let v = 0;
        t.consts = [];
        while (!accept('}')) {
          const nt = peek();
          if (nt.k !== 'id') throw err('expected identifier before ' + quoteTok(nt), nt);
          p++;
          if (accept('=')) v = intConst(condExpr(), 'enumerator value');
          if (v > 2147483647 || v < -2147483648) throw err("enumerator value for '" + nt.v + "' is not an integer constant that fits in int", nt);
          const old = scope.names.get(nt.v);
          if (old) throw err("redeclaration of '" + nt.v + "'", nt);
          scope.names.set(nt.v, { kind: 'enumconst', name: nt.v, value: v, type: T.int, pos: pos(nt), enumType: t });
          t.consts.push([nt.v, v]);
          v++;
          if (!accept(',')) { expect('}', 'at end of enumerator list'); break; }
          if (is('}')) warn('comma at end of enumerator list is not part of C89', toks[p - 1]);
        }
        t.complete = true; t.size = 4; t.align = 4;
        return { type: t, decl: true };
      }
      if (!tag) throw err("expected '{' after 'enum'", peek());
      let t = scope.findTag(tag);
      if (t && t.k !== 'enum') throw err("'" + tag + "' defined as wrong kind of tag", at);
      if (!t) { warn("ISO C forbids forward references to 'enum' types", at); t = Types.newTag('enum', tag); file.tags.set(tag, t); }
      return { type: t, decl: false };
    }

    // ---- declarators --------------------------------------------------------------------------------
    /** Returns {name, pos, build(base) -> type, params (names, for a function declarator), knr} */
    function declarator(abstract) {
      const ptrs = [];
      while (is('*')) {
        p++;
        let q = 0;
        while (is('const') || is('volatile')) { q |= is('const') ? Q_CONST : Q_VOLATILE; p++; }
        ptrs.push(q);
      }
      let inner = null, name = null, npos = pos();
      if (is('(') && (!abstract ? !startsTypeName(1) && !is(')', 1) || peek(1).k === 'id' && !isTypedefName(peek(1)) : (is('*', 1) || is('(', 1) || is('[', 1)))) {
        // ( declarator )  vs  function parameters of an abstract declarator
        if (abstract || peek(1).k === 'id' || is('*', 1) || is('(', 1)) {
          p++;
          inner = declarator(abstract);
          expect(')');
          name = inner.name; npos = inner.pos;
        }
      } else if (peek().k === 'id' && !abstract) {
        name = peek().v; npos = pos(); p++;
      } else if (peek().k === 'id' && abstract && !isTypedefName(peek())) {
        throw err('unexpected identifier ' + quoteTok(peek()) + ' in type name', peek());
      } else if (!abstract) {
        // name may be missing in parameter declarations; caller decides
      }
      const suffixes = [];
      let params = null, knr = false;
      for (;;) {
        if (is('[')) {
          const at = peek();
          p++;
          let n = null;
          if (!is(']')) {
            const e = condExpr();
            n = intConst(e, 'array size');
            if (n < 0) throw err("size of array" + (name ? " '" + name + "'" : '') + ' is negative', at);
            if (n === 0) warn('ISO C forbids zero-size array' + (name ? " '" + name + "'" : ''), at);
          }
          expect(']');
          suffixes.push({ k: 'array', n, at });
          continue;
        }
        if (is('(')) {
          const at = peek();
          p++;
          const r = paramList();
          suffixes.push({ k: 'func', r, at });
          if (!params && !inner) { params = r.names; knr = r.knr; }
          else if (!params && inner && !inner.params) { params = r.names; knr = r.knr; }
          continue;
        }
        break;
      }
      if (inner && inner.params) { params = inner.params; knr = inner.knr; }
      const build = (base) => {
        let t = base;
        for (const q of ptrs) t = Types.ptr(t, q);
        for (let i = suffixes.length - 1; i >= 0; i--) {
          const s = suffixes[i];
          if (s.k === 'array') {
            if (t.k === 'func') throw err("declaration of '" + (name || 'type name') + "' as array of functions", s.at);
            if (t.k === 'void') throw err("declaration of '" + (name || 'type name') + "' as array of voids", s.at);
            if (!Types.isComplete(t) && t.k !== 'array') throw err("array type has incomplete element type", s.at);
            if (t.k === 'array' && t.n === null) throw err("array type has incomplete element type", s.at);
            t = Types.array(t, s.n);
          } else {
            if (t.k === 'func') throw err("'" + (name || 'type name') + "' declared as function returning a function", s.at);
            if (t.k === 'array') throw err("'" + (name || 'type name') + "' declared as function returning an array", s.at);
            t = Types.func(t, s.r.params, s.r.variadic, s.r.proto);
          }
        }
        return inner ? inner.build(t) : t;
      };
      // a function declarator directly applied to the name gives the parameter names; (name) in brackets counts too
      const plain = !inner || inner.simple;
      const direct = plain && suffixes.length && suffixes[0].k === 'func';
      if (direct && inner && inner.simple) { params = suffixes[0].r.names; knr = suffixes[0].r.knr; }
      return { name, pos: npos, build, params: direct || (inner && inner.params) ? params : null, knr, paramInfo: direct ? suffixes[0].r : inner ? inner.paramInfo : null, simple: !ptrs.length && !suffixes.length && (!inner || inner.simple) };
    }

    /** ( parameter-type-list ) or ( identifier-list ) for K&R */
    function paramList() {
      if (accept(')')) return { params: [], names: [], proto: false, variadic: false, knr: false };
      if (is('void') && is(')', 1)) { p += 2; return { params: [], names: [], proto: true, variadic: false }; }
      if (peek().k === 'id' && !isTypedefName(peek())) {
        // K&R identifier list
        const names = [];
        for (;;) {
          const t = peek();
          if (t.k !== 'id') throw err('expected identifier before ' + quoteTok(t), t);
          names.push({ name: t.v, pos: pos(t) });
          p++;
          if (accept(',')) continue;
          expect(')');
          break;
        }
        return { params: [], names, proto: false, variadic: false, knr: true };
      }
      const params = [], names = [];
      let variadic = false;
      const saved = scope;
      scope = new Scope(scope, 'proto');
      try {
        for (;;) {
          if (accept('...')) { variadic = true; expect(')'); break; }
          const sp = declSpecs(undefined);
          if (sp.storage && sp.storage !== 'register') throw err("storage class specified for parameter", sp.pos);
          const d = declarator(false);
          let t = d.build(sp.type);
          if (t.k === 'void') {
            if (d.name || params.length || !is(')')) throw err("'void' must be the only parameter", sp.pos);
          }
          t = Types.adjustParam(t);
          params.push({ name: d.name, type: t, pos: d.pos, register: sp.storage === 'register' });
          names.push({ name: d.name, pos: d.pos, type: t, register: sp.storage === 'register' });
          if (d.name) {
            if (scope.names.has(d.name)) throw err("redefinition of parameter '" + d.name + "'", d.pos);
            scope.names.set(d.name, { kind: 'var', name: d.name, type: t });
          }
          if (accept(',')) { if (is(')')) throw err("expected declaration specifiers before ')'", peek()); continue; }
          expect(')');
          break;
        }
      } finally { scope = saved; }
      if (variadic && !params.length) throw err("ISO C requires a named argument before '...'", peek(-1));
      return { params, names, proto: true, variadic };
    }

    function typeName() {
      const sp = declSpecs(false);
      const d = declarator(true);
      return d.build(sp.type);
    }

    // ---- function definitions -----------------------------------------------------------------------
    function functionDefinition(spec, d, type) {
      if (spec.storage === 'typedef') throw err('function definition declared \'typedef\'', d.pos);
      if (spec.storage === 'auto' || spec.storage === 'register') throw err("invalid storage class for function '" + d.name + "'", d.pos);
      let params = d.paramInfo ? d.paramInfo.names : [];
      if (d.knr) {
        // old-style parameter declarations between ) and {
        const declared = new Map();
        while (!is('{')) {
          const sp = declSpecs(undefined);
          for (;;) {
            const pd = declarator(false);
            const pname = pd.name;
            const idx = params.findIndex((x) => x.name === pname);
            if (idx < 0) throw err("declaration for parameter '" + pname + "' but no such parameter", pd.pos);
            if (declared.has(pname)) throw err("redefinition of parameter '" + pname + "'", pd.pos);
            let t = Types.adjustParam(pd.build(sp.type));
            declared.set(pname, t);
            if (accept(',')) continue;
            expect(';');
            break;
          }
        }
        params = params.map((x) => {
          let t = declared.get(x.name);
          if (!t) { t = T.int; warn("type of '" + x.name + "' defaults to 'int'", x.pos); }
          // arguments arrive promoted; float parameters of old-style functions are passed as double
          const passed = t.k === 'float' ? T.double : t;
          return { name: x.name, pos: x.pos, type: passed };
        });
        type = Types.func(type.ret, params.map((x) => ({ name: x.name, type: x.type })), false, false);
      }
      if (type.ret.k === 'array' || type.ret.k === 'func') throw err("function '" + d.name + "' returns an array or function", d.pos);
      if (Types.isSU(type.ret) && !Types.isComplete(type.ret)) throw err('return type is an incomplete type', d.pos);
      const sym = declareGlobal(spec, d, type);
      if (sym.defined) throw err("redefinition of '" + d.name + "'" + note({ pos: sym.defPos }), d.pos);
      sym.defined = true;
      sym.defPos = d.pos;
      if (!d.knr) sym.type = type;
      if (d.name === 'main') {
        if (Types.unqual(type.ret).k !== 'int') warn("return type of 'main' is not 'int'", d.pos);
      }
      fn = {
        sym, name: d.name, type: sym.type, frame: 0, maxFrame: 0, locals: [], labels: new Map(), gotos: [], params: [],
        retType: type.ret, pos: d.pos, unit: unit.id, file: d.pos.file, switches: [], ctl: [], temps: 0,
      };
      scope = new Scope(file, 'func');
      // parameters live above the frame pointer: return address at FP+4, first argument at FP+8
      let off = 8;
      if (Types.isSU(type.ret)) { fn.hiddenRet = { off: 8 }; off += 4; }
      for (const x of params) {
        if (!x.name) throw err('parameter name omitted', x.pos || d.pos);
        if (x.type.k === 'void') continue;
        if (!Types.isComplete(x.type)) throw err("parameter '" + x.name + "' has incomplete type", x.pos);
        const size = Types.sizeof(x.type);
        const v = { kind: 'var', name: x.name, type: x.type, storage: 'param', off, pos: x.pos, register: x.register };

      fn.argBytes = off - 8;
      const body = compound(true);
      for (const g of fn.gotos) {

        fn.labels.get(g.label).used = true;
      }
      for (const [name, l] of fn.labels) if (!l.used) warn("label '" + name + "' defined but not used", l.pos);
      const ret = Types.unqual(type.ret);
      if (ret.k !== 'void' && d.name !== 'main' && canFallThrough(body)) { fn.mayFallOff = true; warn("control reaches end of non-void function '" + d.name + "'", body.endPos); }
      functions.push({
        sym, name: d.name, type: sym.type, body, params: fn.params, locals: fn.locals, frameSize: (fn.maxFrame + 3) & ~3,
        hiddenRet: fn.hiddenRet, pos: d.pos, endPos: body.endPos, unit: unit.id, mayFallOff: fn.mayFallOff, labels: fn.labels, isStatic: sym.linkage === 'internal',

      fn = null;
    }

    function canFallThrough(s) {
      if (!s) return true;
      switch (s.k) {
        case 'return': return false;
        case 'block': return !s.items.length || canFallThrough(s.items[s.items.length - 1]);
        case 'if': return !s.else || canFallThrough(s.then) || canFallThrough(s.else);
        case 'expr': return !(s.e.k === 'call' && s.e.f.k === 'decay' && s.e.f.e.k === 'var' && ['exit', 'abort', 'longjmp'].includes(s.e.f.e.sym.name));
        case 'while': case 'for': return !(s.cond === null || (s.cond && s.cond.k === 'num' && s.cond.v)) || hasBreak(s.body);
        case 'do': return !(s.cond.k === 'num' && s.cond.v) || hasBreak(s.body);
        case 'goto': return false;
        case 'label': case 'case': case 'default': return canFallThrough(s.body);

      }
    }
    function hasBreak(s) {
      if (!s || typeof s !== 'object') return false;
      if (s.k === 'break') return true;
      if (s.k === 'while' || s.k === 'for' || s.k === 'do' || s.k === 'switch') return false;
      for (const v of Object.values(s)) {
        if (Array.isArray(v)) { if (v.some((x) => x && x.k && hasBreak(x))) return true; }
        else if (v && v.k && typeof v === 'object' && v !== s && hasBreak(v)) return true;

      return false;
    }

    // ---- statements --------------------------------------------------------------------------------
    function compound(isFnBody) {
      const open = expect('{');
      const saved = scope;
      if (!isFnBody) scope = new Scope(scope, 'block');
      const savedFrame = fn.frame;
      blockDepth++;
      const items = [];
      const decls = [];
      let sawStmt = false;
      while (!is('}')) {
        if (peek().k === 'eof') throw err("expected '}' at end of input", peek());
        if (startsType() && !(peek().k === 'id' && is(':', 1))) {
          if (sawStmt) warn('ISO C90 forbids mixed declarations and code', peek());
          const r = localDeclaration();
          for (const v of r.vars) decls.push(v);
          for (const s of r.stmts) items.push(s);
          continue;
        }
        sawStmt = true;
        items.push(statement());
      }
      const close = toks[p++];
      blockDepth--;
      for (const v of decls) if (!v.used && v.storage !== 'extern' && !v.isStaticLocal) warn("unused variable '" + v.name + "'", v.pos);
      scope = saved;
      void savedFrame;   // block variables keep their own slots (no sharing between sibling blocks), so every variable has one address
      return { k: 'block', items, decls, pos: pos(open), endPos: pos(close), line: open.line };
    }

    function localDeclaration() {
      const start = peek();
      const spec = declSpecs(true);
      const vars = [], stmts = [];
      if (accept(';')) { declareTagOnly(spec, start); return { vars, stmts }; }
      for (;;) {
        const d = declarator(false);
        if (!d.name) throw err('expected identifier or ( before ' + quoteTok(peek()), peek());
        const type = d.build(spec.type);
        const old = scope.names.get(d.name);
        if (spec.storage === 'typedef') {
          if (old) throw err("redefinition of '" + d.name + "'", d.pos);
          scope.names.set(d.name, { kind: 'typedef', name: d.name, type, pos: d.pos });
          if (accept(',')) continue;
          expect(';');
          break;
        }
        if (type.k === 'func' || spec.storage === 'extern') {
          // block-scope declaration of something defined elsewhere
          if (spec.storage === 'static' && type.k === 'func') throw err("invalid storage class for function '" + d.name + "'", d.pos);
          if (old && old.kind !== 'func' && old.kind !== 'var') throw err("'" + d.name + "' redeclared as different kind of symbol", d.pos);
          let g = file.names.get(d.name);
          if (g && !Types.compatible(g.type, type)) throw err("conflicting types for '" + d.name + "'", d.pos);
          if (!g) {
            g = { kind: type.k === 'func' ? 'func' : 'var', name: d.name, type, linkage: 'external', storage: 'global', defined: false, pos: d.pos, unit: unit.id, hiddenFromFile: true };
            globals.push(g);

          scope.names.set(d.name, g);

            g.init = flattenInit(g.type, init, true, d.name);

          expect(';');
          break;

        let initTree = null;
        scope.names.set(d.name, v);   // the name is in scope inside its own initializer
        if (accept('=')) {

          v.type = completeArrayFromInit(v.type, initTree);

        if (initTree) {

        expect(';');
        break;

    }

    function allocLocal(v) {
      const size = Math.max(Types.sizeof(v.type), 1);

      const size = Types.sizeof(type);
      const align = Math.max(Types.alignof(type), 4);

      const off = -fn.frame;
      fn.maxFrame = Math.max(fn.maxFrame, fn.frame);

    function statement() {
      const t = peek();
      const at = pos(t);
      const line = t.line;
      if (t.k === 'id' && is(':', 1)) {

        const name = t.v;
        if (fn.labels.has(name)) throw err("duplicate label '" + name + "'", t);
        const l = { name, pos: at, used: false };
        fn.labels.set(name, l);

            p++;
            expect('(');
            const c = condition(expr());
            expect(')');

            p++;
            expect('(');
            const c = condition(expr());
            expect(')');

            fn.ctl.pop();

            sw.body = statement();

            fn.switches.pop();

          case 'continue': {

            return g;
          }

            }
            e = assignConvert(rvalue(e), fn.retType, 'return', at);
            return { k: 'return', e, pos: at, line };
          }
        }
      }
      const e = expr();
      expect(';', 'after expression');
      checkUnused(e, at);
      return { k: 'expr', e, pos: at, line };
    }

    function checkUnused(e, at) {

    // ---- initializers ------------------------------------------------------------------------------
    function initializer() {

        while (!accept('}')) {
          items.push(initializer());
          if (!accept(',')) { expect('}', 'at end of initializer'); break; }
        }
        return { k: 'list', items, pos: pos(at) };

      const e = assignExpr();
      return { k: 'one', e, pos: pos(at) };
    }

    function completeArrayFromInit(t, init) {
      if (t.k !== 'array' || t.n !== null) return t;

      if (init.k !== 'list') throw err('invalid initializer', init.pos);
      // count how many elements the list fills
      const elemSize = Types.sizeof(t.of);
      const probe = Types.array(t.of, 1 << 20);

    function isCharType(t) { return ['char', 'schar', 'uchar'].includes(t.k); }
    function isWideType(t) { return ['long', 'ulong', 'int', 'uint'].includes(t.k); }

    /**

     * isStatic: every expression must be a constant.
     */
    function flattenInit(type, init, isStatic, name, probing) {
      const out = [];
      out.used = 0;
      if (init.k === 'one' && !Types.isAggregate(type)) {
        out.push({ off: 0, type, e: initValue(type, init.e, isStatic, name) });
        return out;
      }
      if (init.k === 'one' && Types.isSU(type)) {
        // struct initialized from a struct value (allowed for automatic objects)
        const e = rvalue(init.e);
        if (Types.isSU(e.t) && Types.compatible(Types.unqual(e.t), Types.unqual(type))) {
          if (isStatic) throw err('initializer element is not constant', init.pos);
          out.push({ off: 0, type, e, whole: true });
          return out;
        }
      }
      if (init.k === 'one' && type.k === 'array' && init.e.k === 'str' && (init.e.wide ? isWideType(type.of) : isCharType(type.of))) {
        strInit(type, init.e, 0, out);
        return out;
      }
      if (init.k === 'one') {
        if (init.e.k === 'str' && type.k === 'array') throw err('array of inappropriate type initialized from string constant', init.pos);
        throw err("invalid initializer" + (name ? " for '" + name + "'" : ''), init.pos);
      }
      // brace list: walk with a cursor, allowing brace elision
      const items = init.items;
      let i = 0;
      fill(type, 0, true);
      if (i < items.length) {
        if (probing) return out;
        warn('excess elements in ' + (type.k === 'array' ? 'array' : Types.isSU(type) ? type.k : 'scalar') + ' initializer', items[i].pos);
