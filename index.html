      return out;

      function fill(t, base, braced) {
        if (t.k === 'array') {
          const n = t.n;
          if (braced && items[i] && items[i].k === 'one' && items[i].e.k === 'str' && isCharType(t.of)) {
            strInit(t, items[i].e, base, out);
            i++;
            return;
          }
          for (let k = 0; (n === null || k < n) && i < items.length; k++) {
            const off = base + k * Types.sizeof(t.of);
            elem(t.of, off);
            out.used = Math.max(out.used, off - (probing ? 0 : 0) + Types.sizeof(t.of));
          }
          return;
        }
        if (Types.isSU(t)) {
          const d = Types.def(t);
          const ms = d.members.filter((m) => m.name);
          for (let k = 0; k < ms.length && i < items.length; k++) {
            elem(ms[k].type, base + ms[k].offset, ms[k]);
            if (d.k === 'union') break;
          }
          return;
        }
        elem(t, base);
      }
      function elem(t, off, member) {
        const it = items[i];
        if (it.k === 'list') {
          i++;
          if (!Types.isAggregate(t)) {
            if (it.items.length > 1) warn('excess elements in scalar initializer', it.pos);
            const sub = it.items[0];
            if (sub.k === 'list') throw err('braces around scalar initializer', it.pos);
            out.push({ off, type: t, e: initValue(t, sub.e, isStatic, name), member });
            return;
          }
          const sub = flattenInit(t, it, isStatic, name);
          for (const s of sub) out.push(Object.assign({}, s, { off: s.off + off }));
          return;
        }
        if (Types.isAggregate(t)) {
          // a string can fill a char array directly; a struct value can fill a struct member
          if (t.k === 'array' && it.e.k === 'str' && isCharType(t.of)) { strInit(t, it.e, off, out); i++; return; }
          if (Types.isSU(t) && !isStatic) {
            const e = rvalue(it.e);
            if (Types.isSU(e.t) && Types.compatible(Types.unqual(e.t), Types.unqual(t))) { out.push({ off, type: t, e, whole: true }); i++; return; }
          }
          fill(t, off, false);
          return;
        }
        i++;
        out.push({ off, type: t, e: initValue(t, it.e, isStatic, name), member });
      }
    }

    function strInit(t, s, off, out) {
      if (s.wide) {
        const n = t.n === null ? s.chars.length : t.n;
        if (s.chars.length - 1 > n) warn('initializer-string for array of wchar_t is too long', s.pos);
        for (let k = 0; k < n; k++) { const e = num(k < s.chars.length ? s.chars[k] : 0, t.of, s.pos); e.constVal = e.v; out.push({ off: off + k * Types.sizeof(t.of), type: t.of, e, fromString: true }); }
        out.used = Math.max(out.used || 0, off + n * Types.sizeof(t.of));
        return;
      }
      const n = t.n === null ? s.bytes.length : t.n;
      if (s.bytes.length - 1 > n) warn('initializer-string for array of chars is too long', s.pos);
      for (let k = 0; k < n; k++) {
        const v = k < s.bytes.length ? s.bytes[k] : 0;
        const e = num(t.of.k === 'uchar' ? v & 255 : (v << 24) >> 24, t.of, s.pos);
        e.constVal = e.v;
        out.push({ off: off + k, type: t.of, e, fromString: true });
      }
      out.used = Math.max(out.used || 0, off + n);
    }

    function initValue(t, e, isStatic, name) {
      let v = assignConvert(rvalue(e), t, 'initialization', e.pos);
      if (isStatic) {
        const c = constValue(v);
        if (c === null) throw err('initializer element is not constant', e.pos);
        v.constVal = c;
      }
      return v;
    }

    // ---- expressions --------------------------------------------------------------------------------
    function expr() {
      let e = assignExpr();
      while (is(',')) {
        const at = toks[p++];
        const r = assignExpr();
        e = { k: 'comma', l: rvalueOrVoid(e), r: rvalueOrVoid(r), t: rvalueOrVoid(r).t, pos: pos(at) };
      }
      return e;
    }

    function assignExpr() {
      const start = p;
      const l = condExpr();
      const t = peek();
      if (t.k === 'p' && ASSIGN_OPS.has(t.v)) {
        p++;
        const r = assignExpr();
        return makeAssign(t.v, l, r, pos(t));
      }
      void start;
      return l;
    }

    function condExpr() {
      const c = binExpr(1);
      if (!is('?')) return c;
      const at = toks[p++];
      const a = expr();
      expect(':');
      const b = condExpr();
      return makeCond(c, a, b, pos(at));
    }

    function binExpr(min) {
      let l = castExpr();
      for (;;) {
        const t = peek();
        if (t.k !== 'p') return l;
        const prec = BIN_PREC[t.v];
        if (!prec || prec < min) return l;
        p++;
        const r = binExpr(prec + 1);
        l = makeBinary(t.v, l, r, pos(t));
      }
    }

    function castExpr() {
      if (is('(') && startsTypeName(1)) {
        const at = toks[p++];
        const t = typeName();
        expect(')');
        if (is('{')) throw err('compound literals are not part of C89', peek());
        const e = castExpr();
        return makeCast(e, t, pos(at));
      }
      return unaryExpr();
    }

    function unaryExpr() {
      const t = peek();
      const at = pos(t);
      if (t.k === 'p') {
        switch (t.v) {
          case '++': case '--': { p++; const e = unaryExpr(); return makeIncDec(t.v, e, false, at); }
          case '&': {
            p++;

          case '*': { p++; const e = castExpr(); return makeDeref(e, at); }

            p++;
            const e = rvalue(castExpr());

            const pt = Types.promote(e.t);

          }
          case '~': {
            p++;
            const e = rvalue(castExpr());
            if (!Types.isInt(e.t)) throw err('wrong type argument to bit-complement', at);
            const pt = Types.promote(e.t);
            return fold({ k: 'unop', op: '~', e: convert(e, pt), t: pt, pos: at });
          }
          case '!': {
            p++;
            const e = rvalue(castExpr());
            if (!Types.isScalar(e.t)) throw err('wrong type argument to unary exclamation mark', at);

          }
        }
      }
      if (t.k === 'kw' && t.v === 'sizeof') {
        p++;
        let ty;
        if (is('(') && startsTypeName(1)) {
          p++;
          ty = typeName();
          expect(')');
        } else {
          const e = unaryExpr();
          if (e.k === 'member' && e.m.width !== undefined) throw err("'sizeof' applied to a bit-field", at);
          ty = e.t;
          if (e.k === 'var') e.sym.usedSizeof = true;
        }
        if (ty.k === 'func') throw err("invalid application of 'sizeof' to a function type", at);
        if (ty.k === 'void') throw err("invalid application of 'sizeof' to a void type", at);
        if (!Types.isComplete(ty)) throw err("invalid application of 'sizeof' to incomplete type '" + Types.str(ty) + "'", at);
        return { k: 'num', v: Types.sizeof(ty), t: T.uint, pos: at, sizeofType: ty };
      }
      return postfixExpr();
    }

    function postfixExpr() {
      let e = primaryExpr();
      for (;;) {
        const t = peek();
        const at = pos(t);
        if (is('[')) {
          p++;
          const idx = expr();
          expect(']');
          e = makeIndex(e, idx, at);
          continue;
        }
        if (is('(')) {
          p++;
          const args = [];
          if (!is(')')) {
            for (;;) {
              args.push(assignExpr());
              if (accept(',')) continue;
              break;
            }
          }
          expect(')');
          e = makeCall(e, args, at);
          continue;
        }
        if (is('.') || is('->')) {
          p++;
          const nt = peek();
          if (nt.k !== 'id') throw err('expected identifier before ' + quoteTok(nt), nt);
          p++;
          e = makeMember(e, nt.v, t.v === '->', at, nt);
          continue;
        }
        if (is('++') || is('--')) { p++; e = makeIncDec(t.v, e, true, at); continue; }
        return e;
      }
    }

    function primaryExpr() {
      const t = peek();
      const at = pos(t);
      if (t.k === 'id') {
        p++;
        let s = scope.find(t.v);
        if (!s) {
          if (is('(')) {
            // implicit declaration: int name();
            warn("implicit declaration of function '" + t.v + "'", t);
            s = file.names.get(t.v);
            if (!s) {
              s = { kind: 'func', name: t.v, type: Types.func(T.int, [], false, false), linkage: 'external', storage: 'global', defined: false, pos: at, unit: unit.id, implicit: true };
              file.names.set(t.v, s);
              globals.push(s);
            }
          } else throw err("'" + t.v + "' undeclared" + (fn ? ' (first use in this function)' : ''), t);
        }
        if (s.kind === 'typedef') throw err('unexpected type name ' + quoteTok(t) + ': expected expression', t);
        if (s.kind === 'enumconst') return { k: 'num', v: s.value, t: T.int, pos: at, enumConst: s.name };
        s.used = true;
        if (s.kind === 'func') return { k: 'var', sym: s, t: s.type, lv: false, pos: at, name: s.name };
        return { k: 'var', sym: s, t: s.type, lv: true, pos: at, name: s.name };
      }
      if (t.k === 'num') { p++; return numberLiteral(t); }
      if (t.k === 'char') {
        p++;
        const b = SEE.Lexer.decodeEscapes(t.v, at, warnings);
        if (!b.length) throw err('empty character constant', t);
        if (b.length > 1) warn('multi-character character constant', t);

        return { k: 'str', lit, bytes, t: Types.array(T.char, bytes.length), lv: true, pos: at };
      }

        p++;
        const e = expr();
        expect(')');
        return Object.assign({}, e, { paren: true });
      }
      if (t.k === 'eof') throw err('expected expression at end of input', t);
      throw err('expected expression before ' + quoteTok(t), t);
    }

    function numberLiteral(t) {

        const dec = !/^0/.test(m[1]) || m[1] === '0';

        else if (m[1].length > 1 && m[1][0] === '0') v = parseInt(m[1], 8);
        else v = Number(m[1]);

        let ty;

        if (v <= 0x7fffffff && !U && !L) ty = T.int;
        else if (!dec && v <= 0xffffffff && !U && !L) ty = T.uint;
        else if (v <= 0x7fffffff && !U) ty = T.long;
        else if (U && !L && v <= 0xffffffff) ty = T.uint;
        else if (v <= 0xffffffff) { ty = T.ulong; if (dec && !U) warn('this decimal constant is unsigned only in ISO C90', t); }

      if (!m || (!/[.eE]/.test(m[1]))) throw err('invalid number "' + s + '"', t);

      if (suf === 'f') v = Math.fround(v);
      if (!isFinite(v)) warn('floating constant exceeds range of ' + Types.str(ty), t);
      return { k: 'num', v, t: ty, pos: at, text: s };
    }

    // ---- building typed nodes -----------------------------------------------------------------------
    function num(v, t, at) { return { k: 'num', v, t, pos: at }; }

    /** Value of an expression: arrays and functions decay to pointers, lvalues are read */
    function rvalue(e) {
      if (e.t.k === 'array') return { k: 'decay', e, t: Types.ptr(e.t.of), pos: e.pos };
      if (e.t.k === 'func') return { k: 'decay', e, t: Types.ptr(e.t), pos: e.pos };
      if (e.t.k === 'void') throw err('void value not ignored as it ought to be', e.pos);
      if (e.lv && !Types.isComplete(e.t) && !Types.isSU(e.t)) throw err('invalid use of incomplete type', e.pos);
      if (e.lv && Types.isSU(e.t) && !Types.isComplete(e.t)) throw err("invalid use of undefined type '" + Types.str(e.t) + "'", e.pos);

    function rvalueOrVoid(e) { return e.t.k === 'void' ? e : rvalue(e); }
    function condition(e) {
      if (e.k === 'assign' && !e.paren) warn('suggest parentheses around assignment used as truth value', e.pos);

      if (!Types.isScalar(e.t)) throw err('used ' + (Types.isSU(e.t) ? e.t.k + ' type' : 'array type') + ' value where scalar is required', e.pos);

    }
    function used(e) { return e; }

    function convert(e, t) {

      if (a === b && from.k !== 'enum' && t.k !== 'enum' && from.k === Types.unqual(t).k && !(t.k === 'ptr' || from.k === 'ptr')) return Object.assign({}, e, { t: Types.unqual(t) });

    }

    function makeCast(e, t, at) {
      if (t.k === 'void') {
        const v = rvalueOrVoid(e);
        return { k: 'cast', e: v, t: T.void, pos: at };
      }
      const v = rvalue(e);
      if (!Types.isScalar(t)) {
        if (Types.isSU(t) && Types.compatible(Types.unqual(v.t), Types.unqual(t))) return v;
        throw err('conversion to non-scalar type requested', at);
      }
      if (!Types.isScalar(v.t)) throw err('aggregate value used where ' + (Types.isFloat(t) ? 'a float' : 'an integer') + ' was expected', at);

      return fold({ k: 'cast', e: v, t: Types.unqual(t), pos: at, explicit: true, castQ: t.q });
    }

    function isNullConst(e) {
      while (e.k === 'cast' && (Types.isInt(e.t) || (e.t.k === 'ptr' && e.t.to.k === 'void' && !e.t.to.q))) e = e.e;
      return e.k === 'num' && Types.isInt(e.t) && e.v === 0;
    }

    /** Conversion as if by assignment (6.3.16.1), with the usual diagnostics */
    function assignConvert(e, t, ctx, at) {

      if (Types.isArith(to) && Types.isArith(from)) {
        if (Types.isInt(to) && e.k === 'num' && Types.isInt(from)) {
          const r = Types.range(to);
          const cv = constValue(e);
          if (typeof cv === 'number' && (cv < r[0] || cv > r[1]) && !(Types.isUnsigned(to) && cv < 0 && cv >= -r[1]) && Types.sizeof(to) < 4) warn('overflow in implicit constant conversion', at);
        }
        if (Types.isInt(to) && Types.isFloat(from) && e.k === 'num') { /* fine, truncates */ }
        return convert(e, to);
      }
      if (Types.isSU(to)) {
        if (Types.isSU(from) && Types.def(from) === Types.def(to)) return e;
        throw err('incompatible types when ' + (what === 'assignment' ? 'assigning to' : what === 'return' ? 'returning' : 'initializing') + " type '" + Types.str(t) + "' from type '" + Types.str(from) + "'", at);
      }
      if (to.k === 'ptr') {
        if (isNullConst(e)) return convert(e, to);
        if (from.k === 'ptr') {
          const lt = to.to, rt = from.to;
          const lost = (rt.q & ~lt.q) & (Q_CONST | Q_VOLATILE);
          if (lt.k === 'void' || rt.k === 'void') {
            if (lt.k === 'void' && rt.k === 'func' || rt.k === 'void' && lt.k === 'func') warn('ISO C forbids conversion of ' + (lt.k === 'func' ? 'object pointer to function pointer' : 'function pointer to object pointer') + ' type', at);
          } else if (!Types.compatible(Types.unqual(lt), Types.unqual(rt))) {
            warn(what + ' ' + (ctx === 'argument' ? '' : '') + "from incompatible pointer type ('" + Types.str(from) + "' to '" + Types.str(t) + "')", at);
          }
          if (lost) warn(what + " discards '" + (lost & Q_CONST ? 'const' : 'volatile') + "' qualifier from pointer target type", at);
          return convert(e, to);
        }
        if (Types.isInt(from)) { warn(what + ' makes pointer from integer without a cast', at); return convert(e, to); }
      }
      if (Types.isInt(to) && from.k === 'ptr') { warn(what + ' makes integer from pointer without a cast', at); return convert(e, to); }
      throw err('incompatible types in ' + what + " (cannot convert '" + Types.str(from) + "' to '" + Types.str(t) + "')", at);
    }

    function checkModifiable(e, at, verb) {
      if (!e.lv) {
        if (e.k === 'str') throw err('lvalue required as ' + verb + ' operand', at);
        throw err('lvalue required as ' + (verb === 'assignment' ? 'left operand of assignment' : verb + ' operand'), at);
      }
      if (e.t.k === 'array') throw err('assignment to expression with array type', at);
      if (e.t.k === 'func') throw err('lvalue required as left operand of assignment', at);
      if (Types.isConst(e.t) || (Types.isSU(e.t) && Types.hasConstMember(e.t))) {
        const desc = describeLvalue(e);
        if (verb === 'assignment') throw err('assignment of read-only ' + desc, at);
        throw err((verb === 'increment' ? 'increment' : 'decrement') + ' of read-only ' + desc, at);
      }
      if (!Types.isComplete(e.t)) throw err('invalid use of incomplete type', at);
    }
    function describeLvalue(e) {
      if (e.k === 'var') return (e.sym.storage === 'param' ? 'parameter' : 'variable') + " '" + e.name + "'";
      if (e.k === 'member') return "member '" + e.m.name + "'";
      return "location '" + exprText(e) + "'";
    }
    function exprText(e) {
      switch (e.k) {
        case 'var': return e.name;
        case 'num': return String(e.v);
        case 'deref': return e.index ? exprText(e.index.a) + '[' + exprText(e.index.i) + ']' : '*' + exprText(e.e);
        case 'load': return exprText(e.e);
        case 'decay': return exprText(e.e);
        case 'member': return exprText(e.e) + (e.arrow ? '->' : '.') + e.m.name;
        case 'padd': return exprText(e.p) + (e.sub ? ' - ' : ' + ') + exprText(e.i);
        case 'cast': return exprText(e.e);
        case 'call': return exprText(e.f) + '(...)';
        case 'str': return '"..."';
      }
      return '...';
    }

    function makeAssign(op, l, r, at) {
      checkModifiable(l, at, 'assignment');
      if (l.k === 'var') l.sym.assigned = true;
      if (op === '=') {
        const rv = assignConvert(rvalue(r), l.t, 'assignment', at);
        return { k: 'assign', l, r: rv, t: Types.unqual(l.t), pos: at };
      }
      const bop = op.slice(0, -1);
      const lt = Types.unqual(l.t);
      const rv = rvalue(r);
      if ((bop === '+' || bop === '-') && lt.k === 'ptr') {
        if (!Types.isInt(rv.t)) throw err('invalid operands to binary ' + bop, at);
        checkPtrArith(lt, at);
        return { k: 'opassign', op: bop, l, r: convert(rv, T.int), t: lt, ptrStep: Types.sizeof(lt.to), pos: at };
      }

      right.appendChild(this.roSeg(vm));
      right.appendChild(this.textSeg(vm));
      root.appendChild(h('div.legend', h('span.lg-stack', 'stack'), h('span.lg-heap', 'heap'), h('span.lg-data', 'data and bss'), h('span.lg-ro', 'read-only data'), h('span.lg-text', 'code'),
        h('span', { style: { color: 'var(--m-uninit)' } }, 'red: not set yet'), h('span', '🔒 const')));
      el.appendChild(root);
      el.scrollTop = scroll; el.scrollLeft = scrollL;
      this.prev = this.seen;
      requestAnimationFrame(() => this.drawArrows());
    }

    toolbar() {
      const chk = (key, label, title) => {
        const c = h('input', { type: 'checkbox', checked: !!this.opts[key] });
        c.addEventListener('change', () => { this.opts[key] = c.checked; this.saveOpts(); this.render(); });
        return h('label', { title }, c, label);
      };
      return h('div.mem-bar', chk('arrows', 'arrows', 'Draw an arrow from each pointer to what it points at'), chk('lib', 'library frames', 'Show the C library\'s own frames and globals (like _start and the FILE table)'),
        chk('addrs', 'addresses', 'Show the address of every value'), chk('types', 'types', 'Show the type of every value (pointing at a row always shows it)'));
    }

    faultBox(f) {
      return h('div.fault-box', h('b', f.title + ': '), f.msg, f.at && f.at.line ? h('div.muted', 'at line ' + f.at.line + (f.at.fn ? ' in ' + f.at.fn + '()' : '')) : null);
    }
    leakText(vm) {
      if (!vm.libc) return '';
      const l = vm.libc.leaks();
      if (!l.length) return 'Every malloc block was freed.';
      const bytes = l.reduce((a, b) => a + b.size, 0);
      return l.length + ' heap block' + (l.length === 1 ? ' was' : 's were') + ' never freed (' + bytes + ' bytes): a memory leak.';
    }

    // ---- stack ---------------------------------------------------------------------------------------
    stackSeg(vm) {
      const seg = h('div.seg.stack');
      seg.appendChild(h('div.seg-head', h('span', 'Stack ↓'), h('span.addr', short(MEM.STACK_TOP))));
      const all = D().frames(vm);   // innermost first
      const shown = this.opts.lib ? all : all.filter((f) => !f.system);
      const sel = this.app.frameIndex || 0;
      // outermost at the top: the stack grows down towards the heap
      const list = shown.slice().reverse();
      let skip = null;
      if (list.length > 40) skip = { from: 3, to: list.length - 30 };
      list.forEach((fr, i) => {
        if (skip && i >= skip.from && i < skip.to) {
          if (i === skip.from) seg.appendChild(h('div.gap', '… ' + (skip.to - skip.from) + ' more frames of ' + list[skip.from].name + '() and others …'));
          return;
        }
        seg.appendChild(this.frameBox(vm, fr, all.indexOf(fr), sel));
      });
      if (!shown.length) seg.appendChild(h('div.gap', 'no frames'));
      const used = MEM.STACK_TOP - vm.SP;
      seg.appendChild(h('div.gap', { title: 'The stack may grow down to ' + short(MEM.STACK_LO) + '; past that is a stack overflow' }, 'stack pointer ' + short(vm.SP) + ' · ' + used.toLocaleString() + ' bytes in use · ' + Math.round((vm.SP - MEM.STACK_LO) / 1024) + ' KB left'));
      return seg;
    }

    frameBox(vm, fr, fi, sel) {
      const box = h('div.frame' + (fi === sel ? '.sel' : '') + (fi === 0 ? '.top' : '') + (fr.system ? '.sys' : ''));
      const head = h('div.frame-head', { title: 'Frame of ' + fr.name + '(): click to look at it' },
        h('span', h('span.fname', fr.name + '()'), ' ', h('span.fline', 'line ' + fr.where.line)), h('span.fline.code', 'fp ' + short(fr.fp)));
      head.addEventListener('click', () => this.app.selectFrame(fi));
      box.appendChild(head);
      const cells = h('div.cells');
      const rows = [];
      for (const v of fr.vars) {
        if (v.kind === 'static') continue;
        if (v.sym && v.sym.temp && !this.opts.lib) continue;
        rows.push({ addr: v.addr, v });
      }
      rows.push({ addr: fr.fp + 4, link: 'return to', value: vm.mem.peek(5, fr.fp + 4), fnAddr: true });
      rows.push({ addr: fr.fp, link: 'saved fp', value: vm.mem.peek(5, fr.fp) });
      rows.sort((a, b) => b.addr - a.addr);
      const key = 'f' + fi + ':' + fr.name;
      for (const r of rows) {
        if (r.link) {
          const sh = vm.mem.shadow(r.addr);
          let txt = short(r.value);
          if (r.fnAddr) { const w = vm.describeAddr(r.value); txt += w && w.fn ? ' (in ' + w.fn.name + ')' : ''; }
          const cell = h('div.cell.link', { title: r.link === 'return to' ? 'Where ' + fr.name + '() goes back to when it returns' : 'The frame pointer of the caller, restored on return' },
            h('span.a', this.opts.addrs ? short(r.addr) : ''), h('span.n', r.link), h('span.v', txt + (sh !== SH.CONTROL ? '' : '')), h('span.t', ''));
          spreadTitle(cell);
          cells.appendChild(cell);
          this.index(r.addr, 4, cell, 0);
          continue;
        }
        const v = r.v;
        const label = v.name + (v.kind === 'param' ? '' : '');
        this.valueRows(cells, vm, { name: label, type: v.type, addr: v.addr, key: key + ':' + v.name, kind: v.kind, title: (v.kind === 'param' ? 'a parameter of ' : 'a local variable of ') + fr.name + '()' }, 0);
        if (v.guard) {
          const size = Math.max(Types.sizeof(v.type), 1);
          if (this.opts.lib) cells.appendChild(h('div.cell.guard', h('span.a', this.opts.addrs ? short(v.addr + size) : ''), h('span.n', '(guard)'), h('span.v', '4 bytes kept free past ' + v.name), h('span.t', '')));
        }
      }
      box.appendChild(cells);
      return box;
    }

    // ---- a value and its parts -----------------------------------------------------------------------
    /** item: {name, type, addr, key, kind, bits} */
    valueRows(parent, vm, item, depth) {
      const t = Types.unqual(item.type);
      const agg = Types.isAggregate(t);
      const k = item.key;
      const small = (t.k === 'array' && (t.n || 0) <= 16 && !isCharT(t.of)) || (Types.isSU(t) && (Types.def(t).members || []).length <= 8);
      const forced = depth === 0 && this.forceOpen && this.forceOpen.has(item.name);
      const isOpen = agg && (this.open.has(k) || forced || (small && !this.closed.has(k) && depth < 2));
      const size = Math.max(Types.sizeof(t), 1);
      const row = h('div.cell' + (depth ? '.sub' : ''), { style: depth ? '--d: ' + depth : null });
      const tw = h('span.tw', agg ? (isOpen ? '▾' : '▸') : '');
      if (agg) tw.addEventListener('click', (e) => { e.stopPropagation(); if (forced) this.forceOpen.delete(item.name); this.toggle(k, isOpen); });
      const nameCell = h('span.n', tw, item.name);
      const vcell = this.valueCell(vm, item, t);
      row.append(h('span.a', this.opts.addrs ? short(item.addr) : ''), nameCell, vcell, h('span.t', { title: Types.str(item.type) }, typeShort(item.type)));
      row.title = (item.path || item.name) + ': ' + Types.str(item.type) + ' at ' + short(item.addr) + ' (' + size + ' byte' + (size === 1 ? '' : 's') + ')' + (item.title ? ', ' + item.title : '') + this.writerText(vm, item.addr);
      spreadTitle(row);
      parent.appendChild(row);
      this.index(item.addr, size, row, depth);
      const text = vcell.textContent;
      const sk = item.addr + ':' + Types.str(t);
      if (this.prev.has(sk) && this.prev.get(sk) !== text && !agg) row.classList.add('changed');
      this.seen.set(sk, text);
      if (isOpen) {
        for (const c of D().children(vm, t, item.addr, { limit: 64 })) {
          if (c.more) { parent.appendChild(h('div.cell.sub', { style: { '--d': depth + 1 } }, h('span.a', ''), h('span.n', '…'), h('span.v', (c.n - c.from) + ' more'), h('span.t', ''))); continue; }
          this.valueRows(parent, vm, { name: c.name, path: (item.path || item.name) + c.name, type: c.type, addr: c.addr, key: k + c.name, bits: c.bits }, depth + 1);
        }
      }
    }

    valueCell(vm, item, t) {
      const size = Math.max(Types.sizeof(t), 1);
      let text;
      let cls = 'span.v';
      if (item.bits) text = String(D().bitValue(vm, item.bits, item.addr - item.bits.offset));
      else if (Types.isSU(t)) text = Types.str(t);
      else if (t.k === 'array') text = isCharT(t.of) ? D().show(vm, t, item.addr) : t.n + ' × ' + Types.str(t.of);
      else if (t.k === 'ptr') { const pv = D().read(vm, t, item.addr); text = pv ? short(pv) : 'NULL'; }
      else text = D().show(vm, t, item.addr, { noGarbage: true });
      const scalar = Types.isScalar(t) || (t.k === 'array' && isCharT(t.of));
      const uninit = scalar && D().uninit(vm, item.addr, Math.min(size, 256));
      if (uninit) cls += '.uninit';
      const ro = Types.isConst(item.type) || vm.mem.shadow(item.addr) === SH.RODATA;
      if (scalar) cls += ro ? '.ro' : '.edit';
      if (t.k === 'ptr') cls += '.ptr';
      const v = h(cls, text);
      if (uninit) v.title = 'Not set yet: this is whatever was left in memory there';
      if (t.k === 'ptr') {
        const p = D().read(vm, t, item.addr);
        v.title = D().show(vm, t, item.addr) + (p ? '\npoints at ' + ((vm.describeAddr(p) || {}).text || 'nothing known') : '');
        const dot = h('span.dot');
        v.appendChild(dot);
        if (!p) dot.classList.add('null');
        else {
          const st = vm.mem.shadow(p);
          const bad = st === SH.NONE || st === SH.FREED || uninit;
          if (bad) dot.classList.add('bad');
          this.pointers.push({ el: dot, from: v, value: p, bad, type: t });
          if (!bad && t.to.k !== 'void' && t.to.k !== 'func' && Types.isComplete(t.to)) this.noteBlockType(vm, p, t.to);
        }
      }
      if (scalar && !ro && !item.noEdit) {
        v.addEventListener('click', (e) => { e.stopPropagation(); this.edit(v, item, t); });
      } else if (ro) v.title = 'const: the program cannot change this, so neither can the debugger';
      return v;
    }
    writerText(vm, addr) {
      const gid = vm.mem.lastWriter(addr);
      if (!gid) return '';
      const s = vm.stmtById(gid);
      if (!s) return '';
      if (s.debugger) return '\nlast changed from the debugger';
      return '\nlast written by line ' + s.line + ' in ' + s.fnName + '()';
    }
    toggle(k, isOpen) {
      if (isOpen) { this.open.delete(k); this.closed.add(k); } else { this.open.add(k); this.closed.delete(k); }
      store.set('memOpen', [...this.open].slice(-300));
      this.render();
    }
    edit(cell, item, t) {
      if (cell.querySelector('input')) return;
      const vm = this.vm;
      let start = cell.textContent;
      if (t.k === 'array') start = '"' + (vm.mem.cstr ? safeStr(vm, item.addr, t.n) : '') + '"';
      else if (Types.isScalar(t)) {
        const v = D().read(vm, t, item.addr);
        start = t.k === 'ptr' ? (v ? '0x' + v.toString(16) : 'NULL') : isCharT(t) ? (v >= 32 && v < 127 && v !== 39 && v !== 92 ? "'" + String.fromCharCode(v) + "'" : String(v)) : String(item.bits ? D().bitValue(vm, item.bits, item.addr - item.bits.offset) : Types.isFloat(t) ? D().floatText(v, t.k === 'float') : v);
      }
      const input = h('input', { type: 'text', value: start, 'aria-label': 'New value for ' + item.name });
      cell.textContent = '';
      cell.appendChild(input);
      input.focus();
      input.select();
      let done = false;
      const finish = (ok) => {
        if (done) return;
        done = true;
        if (ok) {
          try {
            D().setValue(vm, item.type, item.addr, input.value, this.app.frameIndex || 0, item.bits);
            this.app.afterEdit(item.name);
          } catch (e) { SEE.UI.toast(e.message, 'err', 5000); this.render(); }
        } else this.render();
      };
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); finish(true); }
        if (e.key === 'Escape') { e.preventDefault(); finish(false); }
        e.stopPropagation();
      });
      input.addEventListener('blur', () => finish(true));
    }

    index(addr, size, el, depth) { this.cellIndex.push({ lo: addr, hi: addr + size, el, depth }); }
    noteBlockType(vm, p, t) {
      if (!vm.libc) return;
      const i = vm.libc.findBlock(p);
      if (i < 0) return;
      if (!this.blockTypes.has(p)) this.blockTypes.set(p, t);
    }

    // ---- heap ---------------------------------------------------------------------------------------
    heapSeg(vm) {
      const seg = h('div.seg.heap');
      const m = vm.mem;
      seg.appendChild(h('div.seg-head', h('span', 'Heap ↑ (malloc)'), h('span.addr', short(m.heapLo) + ' – ' + short(m.brk))));
      const blocks = vm.libc ? vm.libc.blocks : [];
      if (!blocks.length) { seg.appendChild(h('div.gap', 'nothing allocated yet')); return seg; }
      // types for blocks come from pointers to them; pointers inside blocks can type other blocks
      const order = blocks.slice().sort((a, b) => b.addr - a.addr);
      const holder = h('div');
      const draw = () => {
        holder.innerHTML = '';
        for (const b of order) holder.appendChild(this.blockBox(vm, b));
      };
      let before = -1;
      for (let round = 0; round < 6 && before !== this.blockTypes.size; round++) {
        before = this.blockTypes.size;
        const save = { cells: this.cellIndex.length, ptrs: this.pointers.length };
        draw();
        if (before !== this.blockTypes.size) { this.cellIndex.length = save.cells; this.pointers.length = save.ptrs; }
      }
      seg.appendChild(holder);
      return seg;
    }
    blockBox(vm, b) {
      const exited = vm.state === 'exited';
      const box = h('div.blk' + (b.free ? '.freed' : '') + (!b.free && exited ? '.leak' : ''));
      const site = b.site ? 'line ' + b.site.line + (b.site.fn ? ' in ' + b.site.fn + '()' : '') : '';
      box.appendChild(h('div.blk-head', h('span', b.free ? 'free (was block #' + b.id + ')' : 'block #' + b.id + ' · ' + b.size + ' byte' + (b.size === 1 ? '' : 's')),
        h('span', b.free ? (b.freedAt ? 'freed at line ' + b.freedAt.line : '') : (b.by + ' at ' + site) + (exited ? ' · never freed' : ''))));
      if (this.opts.lib) box.appendChild(h('div.hdr', short(b.addr - 8) + '  header: size ' + vm.mem.peek(5, b.addr - 8) + ', tag 0x' + hex(vm.mem.peek(5, b.addr - 4))));
      const cells = h('div.cells');
      if (b.free) {
        cells.appendChild(h('div.cell', h('span.a', this.opts.addrs ? short(b.addr) : ''), h('span.n', ''), h('span.v', b.cap + ' bytes ready for the next malloc'), h('span.t', '')));
        this.index(b.addr, b.cap, cells.lastChild, 0);
        box.appendChild(cells);
        return box;
      }
      const t = this.blockTypes.get(b.addr);
      const es = t ? Types.sizeof(t) : 0;
      let type;
      if (t && es && b.size % es === 0 && b.size / es > 1) type = Types.array(t, b.size / es);
      else if (t && es && b.size === es) type = t;
      else if (t && es && b.size > es) type = Types.array(t, Math.floor(b.size / es));
      else type = Types.array(Types.T.uchar, b.size || 1);
      if (!t && b.size > 0) {
        // no typed pointer here: maybe it is a string
        const first = vm.mem.peek(1, b.addr);
        if (first !== null && first >= 32 && first < 127) type = Types.array(Types.T.char, b.size);
      }
      this.valueRows(cells, vm, { name: t ? (type.k === 'array' ? '[' + type.n + ']' : '*') : 'bytes', type, addr: b.addr, key: 'h' + b.id, title: 'heap block #' + b.id }, 0);
      box.appendChild(cells);
      return box;
    }

    // ---- globals, read-only data, code ---------------------------------------------------------------
    globalsSeg(vm) {
      const seg = h('div.seg.data');
      const [, , data, bss] = vm.prog.segments;
      seg.appendChild(h('div.seg-head', h('span', 'Globals and statics (.data, .bss)'), h('span.addr', short(data.lo) + ' – ' + short(bss.hi))));
      const cells = h('div.cells');
      const list = vm.prog.globals.filter((g) => (g.section === 'data' || g.section === 'bss') && (this.opts.lib || !g.system)).sort((a, b) => b.addr - a.addr);
      for (const g of list) this.valueRows(cells, vm, { name: (g.fn ? g.fn + '.' : '') + g.cname, type: g.type, addr: g.addr, key: 'g:' + g.name, title: (g.section === 'bss' ? 'in .bss (zero at start)' : 'in .data') + (g.isStatic ? ', static' : '') }, 0);
      if (!list.length) cells.appendChild(h('div.cell', h('span.a', ''), h('span.n', ''), h('span.v.muted', 'no global variables'), h('span.t', '')));
      seg.appendChild(cells);
      return seg;
    }
    roSeg(vm) {
      const seg = h('div.seg.ro');
      const ro = vm.prog.segments[1];
      seg.appendChild(h('div.seg-head', h('span', 'Read-only data (.rodata)'), h('span.addr', short(ro.lo))));
      const cells = h('div.cells');
      const consts = vm.prog.globals.filter((g) => g.section === 'rodata' && (this.opts.lib || !g.system));
      for (const g of consts) this.valueRows(cells, vm, { name: g.cname, type: g.type, addr: g.addr, key: 'g:' + g.name, title: 'a const global in .rodata' }, 0);
      const strs = vm.prog.strings.filter((s) => this.opts.lib || !/\/usr\/lib\//.test(s.unit)).sort((a, b) => b.addr - a.addr);
      for (const s of strs.slice(0, 200)) {
        const row = h('div.cell', { title: 'string literal from line ' + s.lit.pos.line + ' of ' + s.unit + ': it lives here for the whole run and cannot be changed' },
          h('span.a', this.opts.addrs ? short(s.addr) : ''), h('span.n', 'line ' + s.lit.pos.line), h('span.v.ro', D().quoteBytes(s.lit.bytes.slice(0, -1), 48)), h('span.t', 'char[' + s.size + ']'));
        spreadTitle(row);
        cells.appendChild(row);
        this.index(s.addr, s.size, row, 0);
      }
      if (!consts.length && !strs.length) cells.appendChild(h('div.cell', h('span.a', ''), h('span.n', ''), h('span.v.muted', 'no string literals'), h('span.t', '')));
      seg.appendChild(cells);
      return seg;
    }
    textSeg(vm) {
      const seg = h('div.seg.text.fnlist');
      const tx = vm.prog.segments[0];
      seg.appendChild(h('div.seg-head', h('span', 'Code (.text)'), h('span.addr', short(tx.lo))));
      const cells = h('div.cells');
      const cur = new Set(D().frames(vm).map((f) => f.fn));
      for (const f of vm.prog.functions.slice().sort((a, b) => b.addr - a.addr)) {
        if (f.system && !this.opts.lib) continue;
        const row = h('div.cell' + (cur.has(f) ? '.target' : ''), { title: Types.str(f.type, f.name) + (f.system ? ' (C library)' : '') }, h('span.a', short(f.addr)), h('span.n', f.name + '()'), h('span.v.muted', f.unitFile.replace(/^.*\//, '') + ':' + f.pos.line), h('span.t', ''));
        spreadTitle(row);
        cells.appendChild(row);
        this.index(f.addr, f.size, row, 0);
      }
      const nat = vm.prog.natives.filter((n) => this.opts.lib || !n.name.startsWith('__'));
      if (nat.length) {
        const row = h('div.cell', h('span.a', short(nat[0].addr)), h('span.n', 'library'), h('span.v.muted', nat.map((n) => n.name).join(', ')), h('span.t', ''));
        cells.appendChild(row);
        for (const n of nat) this.index(n.addr, 16, row, 0);
      }
      seg.appendChild(cells);
      return seg;
    }

    // ---- arrows ----------------------------------------------------------------------------------------
    target(p) {
      let best = null;
      for (const c of this.cellIndex) {
        if (p >= c.lo && p < c.hi && (!best || (c.hi - c.lo) < (best.hi - best.lo) || ((c.hi - c.lo) === (best.hi - best.lo) && c.depth > best.depth))) best = c;
      }
      return best;
    }
    positionSvg() { /* the svg scrolls with the content; nothing to do */ }
    drawArrows() {
      if (!this.root || !this.opts.arrows) return;
      const old = this.root.querySelector('svg.mem-svg');
      if (old) old.remove();
      const NS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('class', 'mem-svg');
      const rb = this.root.getBoundingClientRect();
      svg.setAttribute('width', this.root.scrollWidth);
      svg.setAttribute('height', this.root.scrollHeight);
      for (const p of this.pointers) {
        const t = this.target(p.value);
        if (!t || !t.el.isConnected || !p.el.isConnected) continue;
        const a = p.el.getBoundingClientRect();
        const b = rectOf(t.el);
        if (!a.width || !b.width) continue;
        const x1 = a.left + a.width / 2 - rb.left, y1 = a.top + a.height / 2 - rb.top;
        const toRight = b.left > a.right;
        let x2, y2 = b.top + Math.min(b.height / 2, 9) - rb.top;
        let c1x, c2x;
        if (toRight) { x2 = b.left - rb.left; c1x = x1 + Math.max(30, (x2 - x1) / 2); c2x = x2 - Math.max(30, (x2 - x1) / 2); }
        else {
          // same column: loop out to the right, inside the picture's margin
          x2 = b.right - rb.left;
          const out = Math.min(this.root.scrollWidth - 3, Math.max(x1, x2) + 14 + Math.min(30, Math.abs(y2 - y1) / 8));
          c1x = out; c2x = out;
        }
        const path = document.createElementNS(NS, 'path');
        path.setAttribute('d', `M${x1},${y1} C${c1x},${y1} ${c2x},${y2} ${x2},${y2}`);
        if (p.bad) path.setAttribute('class', 'bad');
        svg.appendChild(path);
        const head = document.createElementNS(NS, 'path');
        const dir = toRight ? 1 : -1;
        head.setAttribute('d', `M${x2},${y2} l${-6 * dir},-4 l0,8 z`);
        head.setAttribute('class', 'head' + (p.bad ? ' bad' : ''));
        svg.appendChild(head);
        const hl = (on) => { path.classList.toggle('hl', on); t.el.classList.toggle('target', on); };
        p.from.addEventListener('mouseenter', () => hl(true));
        p.from.addEventListener('mouseleave', () => hl(false));
      }
      this.root.appendChild(svg);
    }
  }

  /** Rows are display: contents, so their box is the union of their cells */
  function rectOf(el) {
    const r = el.getBoundingClientRect();
    if (r.width || !el.children.length) return r;
    let l = Infinity, t = Infinity, rr = -Infinity, bb = -Infinity;
    for (const c of el.children) {
      const x = c.getBoundingClientRect();
      if (!x.width && !x.height) continue;
      l = Math.min(l, x.left); t = Math.min(t, x.top); rr = Math.max(rr, x.right); bb = Math.max(bb, x.bottom);
    }

SEE.SampleFiles = {"calculator/calc.c":"/* calc.c: a calculator driven by a table of function pointers.\n   Each entry pairs an operator character with the function that does the work. */\n#include <stdio.h>\n\ndouble add(double a, double b) { return a + b; }\ndouble sub(double a, double b) { return a - b; }\ndouble mul(double a, double b) { return a * b; }\ndouble divide(double a, double b) { return b != 0 ? a / b : 0; }\n\nstruct op {\n    char symbol;\n    double (*fn)(double, double);    /* a pointer to a function taking two doubles */\n};\n\nstatic const struct op ops[] = {\n    { '+', add }, { '-', sub }, { '*', mul }, { '/', divide },\n};\n\nint main(void)\n{\n    double a, b;\n    char c;\n    unsigned i;\n\n    printf(\"type a sum like 6 * 7\\n\");\n    while (scanf(\"%lf %c %lf\", &a, &c, &b) == 3) {\n        for (i = 0; i < sizeof ops / sizeof ops[0]; i++)\n            if (ops[i].symbol == c)\n                printf(\"%g %c %g = %g\\n\", a, c, b, ops[i].fn(a, b));\n    }\n    return 0;\n}\n","const/const.c":"/* const.c: what each const locks.\n   Read every declaration from the name outwards.\n   Take the comment marks off one of the \"error\" lines and build (Ctrl+B) to see the message. */\n#include <stdio.h>\n\nconst int limit = 10;              /* a const global: it lives in read-only data */\n\nint main(void)\n{\n    int n = 1, m = 2;\n    const int *p = &n;             /* pointer to const int: *p is locked */\n    int *const q = &n;             /* const pointer to int: q is locked */\n    const int *const r = &n;       /* both */\n\n    p = &m;                        /* allowed */\n    /* *p = 5;                        error: assignment of read-only location '*p' */\n    *q = 5;                        /* allowed: n becomes 5 */\n    /* q = &m;                        error: assignment of read-only variable 'q' */\n    /* limit = 20;                    error: assignment of read-only variable 'limit' */\n\n    printf(\"n=%d m=%d *p=%d *q=%d *r=%d limit=%d\\n\", n, m, *p, *q, *r, limit);\n    return 0;\n}\n","guess/guess.c":"/* guess.c: guess the number. It reads your guesses from the terminal:\n   type a number and press Enter when the program waits. */\n#include <stdio.h>\n#include <stdlib.h>\n#include <time.h>\n\nint main(void)\n{\n    int secret, guess, tries = 0;\n\n    srand((unsigned)time(NULL));\n    secret = rand() % 100 + 1;\n    printf(\"I am thinking of a number from 1 to 100.\\n\");\n    for (;;) {\n        printf(\"your guess: \");\n        fflush(stdout);              /* show the prompt before waiting for input */\n        if (scanf(\"%d\", &guess) != 1)\n            break;\n        tries++;\n        if (guess < secret)\n            printf(\"higher\\n\");\n        else if (guess > secret)\n            printf(\"lower\\n\");\n        else {\n            printf(\"yes! %d tries\\n\", tries);\n            break;\n        }\n    }\n    return 0;\n}\n","hanoi/hanoi.c":"/* hanoi.c: the towers of Hanoi.\n   Step into the recursion (F11) and watch a new frame for every call;\n   the Variables panel lists them all, and each has its own n, from, to and via. */\n#include <stdio.h>\n\nstatic int moves;\n\nvoid hanoi(int n, char from, char to, char via)\n{\n    if (n == 0)\n        return;\n    hanoi(n - 1, from, via, to);\n    moves++;\n    printf(\"move disc %d from %c to %c\\n\", n, from, to);\n    hanoi(n - 1, via, to, from);\n}\n\nint main(void)\n{\n    hanoi(3, 'A', 'C', 'B');\n    printf(\"%d moves\\n\", moves);\n    return 0;\n}\n","jagged/jagged.c":"/* jagged.c: a triangle of numbers with rows of different lengths.\n   rows lives on the stack; it points to an array of row pointers on the heap,\n   and each of those points to its own block. Step and watch the arrows appear. */\n#include <stdio.h>\n#include <stdlib.h>\n\nint main(void)\n{\n    int n = 5, i, j;\n    int **rows = malloc(n * sizeof *rows);    /* n pointers, one per row */\n\n    for (i = 0; i < n; i++) {\n        rows[i] = malloc((i + 1) * sizeof **rows);    /* row i holds i + 1 numbers */\n        for (j = 0; j <= i; j++)\n            rows[i][j] = (j == 0 || j == i) ? 1 : rows[i - 1][j - 1] + rows[i - 1][j];\n    }\n    for (i = 0; i < n; i++) {\n        for (j = 0; j <= i; j++)\n            printf(\"%d \", rows[i][j]);\n        printf(\"\\n\");\n    }\n    for (i = 0; i < n; i++)\n        free(rows[i]);     /* the rows first ... */\n    free(rows);            /* ... then the array that pointed at them */\n    return 0;\n}\n","linked-list/list.c":"/* list.c: a linked list, built at the front.\n   Every node is a heap block; each next pointer is an arrow to the following node. */\n#include <stdio.h>\n#include <stdlib.h>\n\nstruct node {\n    int value;\n    struct node *next;\n};\n\n/* head is passed by address so push can change the caller's pointer */\nvoid push(struct node **head, int value)\n{\n    struct node *n = malloc(sizeof *n);\n    n->value = value;\n    n->next = *head;\n    *head = n;\n}\n\nvoid free_list(struct node *n)\n{\n    while (n != NULL) {\n        struct node *next = n->next;   /* read next before the node is gone */\n        free(n);\n        n = next;\n    }\n}\n\nint main(void)\n{\n    struct node *head = NULL;\n    struct node *p;\n    int i;\n\n    for (i = 1; i <= 4; i++)\n        push(&head, i * 10);\n    for (p = head; p != NULL; p = p->next)\n        printf(\"%d -> \", p->value);\n    printf(\"NULL\\n\");\n    free_list(head);\n    return 0;\n}\n","notes/notes.c":"/* notes.c: write a file, then read it back.\n   The file goes in /tmp; look for it in the Files panel afterwards. */\n#include <stdio.h>\n\nint main(void)\n{\n    FILE *f;\n    char line[80];\n    int n = 0;\n\n    f = fopen(\"/tmp/notes.txt\", \"w\");\n    if (f == NULL) {\n        perror(\"/tmp/notes.txt\");\n        return 1;\n    }\n    fprintf(f, \"buy milk\\n\");\n    fprintf(f, \"learn pointers\\n\");\n    fprintf(f, \"call home\\n\");\n    fclose(f);\n\n    f = fopen(\"/tmp/notes.txt\", \"r\");\n    if (f n{\n    stack_push(1);\n    stack_push(2);\n    stack_push(3);\n    printf(\"size %d\\n\", stack_size());\n    while (stack_size() > 0)\n        printf(\"popped %d\\n\", stack_pop());\n    return 0;\n}\n","stack-module/stack.c":"/* stack.c: the stack's data is static, so no other file can touch it directly */\n#include \"stack.h\"\n\n#define CAPACITY 16\n\nstatic int items[CAPACITY];   /* static at file level: private to this file */\nstatic int top;\n\nvoid stack_push(int value)\n{\n    if (top < CAPACITY)\n        items[top++] = value;\n}\n\nint stack_pop(void)\n{\n    return top > 0 ? items[--top] : 0;\n}\n\nint stack_size(void)\n{\n    return top;\n}\n","stack-module/stack.h":"/* stack.h: what other files may know about the stack module */\n#ifndef STACK_H\n#define STACK_H\n\nvoid stack_push(int value);\nint stack_pop(void);\nint stack_size(void);\n\n#endif\n","strings/where.c":"/* where.c: the same text in three places.\n   Step to the printf and compare the three in the memory picture. */\n#include <stdio.h>\n#include <string.h>\n#include <stdlib.h>\n\nchar global[] = \"global\";      /* .data: a global array, filled in before main runs */\n\nint main(void)\n{\n    char local[] = \"on the stack\";       /* the literal is copied into main's frame */\n    const char *lit = \"read-only\";       /* points straight at the literal, in .rodata */\n    char *heap = malloc(strlen(lit) + 1);   /* + 1 for the NUL at the end */\n\n    strcpy(heap, lit);                   /* a copy on the heap, which we may change */\n    local[0] = 'O';                      /* fine: our own array */\n    heap[0] = 'R';                       /* fine: our own block */\n    /* lit[0] = 'X'; would crash: string literals cannot be changed */\n\n    printf(\"%s | %s | %s | %s\\n\", global, local, lit, heap);\n    printf(\"addresses: %p %p %p %p\\n\", (void *)global, (void *)local, (void *)lit, (void *)heap);\n    free(heap);\n    return 0;\n}\n","swap/swap.c":"/* swap.c: why swap needs pointers       this.updateUI();
      window.addEventListener('beforeunload', (e) => {
        this.autosaveAll();
        if (this.docs.some((d) => d.dirty)) { e.preventDefault(); e.returnValue = ''; }
      });
      window.addEventListener('resize', () => { this.applyLayout(); this.memview.drawArrows(); });
      setInterval(() => this.autosaveAll(), 4000);
      this.init();
    }

    async init() {
      try { await this.vfs.persist('see-disk'); } catch (e) { /* private mode: memory only */ }
      for (const d of ['/home', '/home/user', '/tmp']) this.vfs.mkdir(d, { exist: true, trusted: true });
      this.installSystem();
      if (SEE.Samples) SEE.Samples.install(this);
      this.restoreSession();
      this.renderSide();
      this.renderProblems();
      const hash = location.hash;
      if (/#share=/.test(hash)) SEE.Files.importShare(this, hash);
      else if (/#lesson=/.test(hash) && SEE.Lessons) SEE.Lessons.startById(this, decodeURIComponent(hash.split('=')[1]));
      else if (/#example=/.test(hash) && SEE.Library) SEE.Library.openById(this, decodeURIComponent(hash.split('=')[1]));
      window.__seeReady = true;
      if (this.settings.firstRun && !/#notour|#share=|#lesson=|#example=/.test(hash)) {
        this.settings.firstRun = false;
        this.saveSettings();
        setTimeout(() => this.welcome(), 500);
      }
    }

    /** The standard headers, readable under /usr/include */
    installSystem() {
      const v = this.vfs;
      v.mkdir('/usr/include', { parents: true, exist: true, trusted: true });
      for (const [name, text] of Object.entries(SEE.Headers.files)) v.writeText('/usr/include/' + name, text, { trusted: true });
      v.mkdir('/usr/lib', { parents: true, exist: true, trusted: true });
      v.writeText('/usr/lib/libc.c', SEE.Headers.libc, { trusted: true });
      v.entries.get('/usr').readOnly = true;
    }

    // ---- settings and theme -----------------------------------------------------------------------
    saveSettings() { store.set('settings', this.settings); }
    applyTheme() {
      let t = this.settings.theme;
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
      document.documentElement.dataset.term = this.settings.term;
      document.documentElement.style.setProperty('--code-size', this.settings.fontSize + 'px');
      const meta = document.querySelector('meta[name=theme-color]');
      if (meta) meta.content = t === 'dark' ? '#2b2f3b' : '#aeb2c3';
      const b = document.getElementById('btnTheme');
      if (b) { b.innerHTML = ''; b.appendChild(icon(t === 'dark' ? 'sun' : 'moon')); }
      for (const d of this.docs || []) d.editor.render();
    }
    setTheme(t) { this.settings.theme = t; this.saveSettings(); this.applyTheme(); }
    toggleTheme() { this.setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); }

    openMenu(i, anchor) {
      const b = anchor || this.menuBtns[i];
      SEE.UI.closeMenus();
      this.menuBtns.forEach((x) => x.classList.remove('open'));
      b.classList.add('open');
      this.menuOpen = i;
      const r = b.getBoundingClientRect();
      SEE.UI.showMenu(this.menuItems(i), anchor ? r.right - 220 : r.left, r.bottom, {
        anchor: b, keyboard: true,
        onClose: () => { b.classList.remove('open'); if (this.menuOpen === i) this.menuOpen = null; },
        onArrow: (d) => { if (!anchor) this.openMenu((i + d + this.menuBtns.length) % this.menuBtns.length); },
      });
    }

    buildToolbar() {
      const tb = document.getElementById('toolbar');
      const btn = (id, ic, label, title, fn, primary) => {
        const b = h('button.tbtn' + (primary ? '.primary' : ''), { type: 'button', id, title, 'aria-label': title }, icon(ic), h('span.lbl', label));
        b.addEventListener('click', fn);

      };
      const sep = () => tb.appendChild(h('span.sep'));

      this.tb.save = btn('tbSave', 'save', 'Save', 'Save (Ctrl+S)', () => this.save());
      sep();
      this.tb.build = btn('tbBuild', 'build', 'Build', 'Compile and link (Ctrl+B)', () => this.build());
      this.tb.run = btn('tbRun', 'run', 'Run', 'Run at full speed (Ctrl+F5)', () => this.run(), true);

      speed.addEventListener('input', () => { this.settings.speed = +speed.value; this.saveSettings(); });

      this.tb.learn = btn('tbLearn', 'learn', 'Learn', 'Lessons, tours and the example library', (e) => {
        const r = e.currentTarget.getBoundingClientRect();
        SEE.UI.showMenu(this.menuItems(5), r.left, r.bottom, { anchor: e.currentTarget, keyboard: true });
      });

    // ---- panels --------------------------------------------------------------------------------------
    buildPanels() {
      const bt = document.getElementById('bottomTabs'), bb = document.getElementById('bottomBody');
      const rt = document.getElementById('rightTabs'), rb = document.getElementById('rightBody');
      const mk = (tabs, body, key, label, ic, store_) => {
        const tab = h('button.ptab', { type: 'button', role: 'tab', id: 'tab-' + key, 'aria-controls': 'panel-' + key }, ic ? icon(ic) : null, h('span', label));
        const panel = h('div.panel', { id: 'panel-' + key, role: 'tabpanel' });
        body.appendChild(panel);
        tabs.appendChild(tab);
        store_[key] = { tab, panel };
        return { tab, panel };
      };
      this.bottom = {};
      this.right = {};
      mk(bt, bb, 'term', 'Terminal', 'terminal', this.bottom).tab.addEventListener('click', () => this.showBottom('term'));
      mk(bt, bb, 'probs', 'Problems', 'bug', this.bottom).tab.addEventListener('click', () => this.showBottom('probs'));
      mk(bt, bb, 'log', 'Build log', 'build', this.bottom).tab.addEventListener('click', () => this.showBottom('log'));
      this.terminal = new SEE.Terminal(this, this.bottom.term.panel);
      mk(rt, rb, 'memory', 'Memory', 'chip', this.right).tab.addEventListener('click', () => this.showRight('memory'));
      mk(rt, rb, 'vars', 'Variables', 'vars', this.right).tab.addEventListener('click', () => this.showRight('vars'));
      mk(rt, rb, 'watch', 'Watch', 'eye', this.right).tab.addEventListener('click', () => this.showRight('watch'));
      mk(rt, rb, 'bps', 'Breakpoints', 'bp', this.right).tab.addEventListener('click', () => this.showRight('bps'));
      mk(rt, rb, 'bytes', 'Bytes', 'hexIcon', this.right).tab.addEventListener('click', () => this.showRight('bytes'));
      this.memview = new SEE.MemView(this, this.right.memory.panel);
      this.varsPanel = new SEE.Panels.VarsPanel(this, this.right.vars.panel);
      this.watchPanel = new SEE.Panels.WatchPanel(this, this.right.watch.panel);
      this.bpPanel = new SEE.Panels.BreakPanel(this, this.right.bps.panel);
      this.bytesPanel = new SEE.Panels.BytesPanel(this, this.right.bytes.panel);
      this.showBottom(store.get('bottomTab', 'term'));
      this.showRight(store.get('rightTab', 'memory'));
    }
    showBottom(k) {
      if (!this.bottom[k]) k = 'term';
      this.bottomTab = k;
      store.set('bottomTab', k);
      for (const [key, x] of Object.entries(this.bottom)) { x.tab.classList.toggle('active', key === k); x.tab.setAttribute('aria-selected', String(key === k)); x.panel.style.display = key === k ? '' : 'none'; }
      if (k === 'probs') this.renderProblems();
      if (k === 'log') this.renderLog();
      if (this.built && this.isPhone() && this.view !== 'run') this.setView('run');
    }
    showRight(k) {
      if (!this.right[k]) k = 'memory';
      this.rightTab = k;
      store.set('rightTab', k);
      for (const [key, x] of Object.entries(this.right)) { x.tab.classList.toggle('active', key === k); x.tab.setAttribute('aria-selected', String(key === k)); x.panel.style.display = key === k ? '' : 'none'; }
      if (this.built && !this.settings.right && !this.isPhone()) { this.settings.right = true; this.saveSettings(); this.applyLayout(); }
      if (this.built && this.isPhone() && this.view !== 'memory') this.setView('memory');
      this.renderPanels();
    }
    /** Redraw the debugger panel that is showing */
    renderPanels() {
      switch (this.rightTab) {
        case 'memory': this.memview.render(); break;
        case 'vars': this.varsPanel.render(); break;
        case 'watch': this.watchPanel.render(); break;
        case 'bps': this.bpPanel.render(); break;
        case 'bytes': this.bytesPanel.render(); break;
      }
    }
    setTerm(t) { this.settings.term = t; this.saveSettings(); this.applyTheme(); }

    applyLayout() {
      const app = document.getElementById('app');
      app.classList.toggle('no-side', !this.settings.side);
      app.classList.toggle('no-right', !this.settings.right);
      const w = store.get('sizes', {});
      if (w.side) document.getElementById('side').style.width = w.side + 'px';
      if (w.right) document.getElementById('right').style.width = w.right + 'px';
      if (w.bottom) document.getElementById('bottom').style.height = w.bottom + 'px';
      if (this.isPhone()) { if (!this.view) this.setView('code'); } else app.removeAttribute('data-view');
      if (!this.isPhone()) this.view = null;
    }
    bindSplitters() {
      const sizes = store.get('sizes', {});
      const save = () => store.set('sizes', sizes);
      SEE.UI.splitter(document.getElementById('splitSide'), (e) => {
        const w = SEE.clamp(e.clientX - document.getElementById('work').getBoundingClientRect().left, 140, 480);
        document.getElementById('side').style.width = w + 'px'; sizes.side = w;
      }, save);
      SEE.UI.splitter(document.getElementById('splitRight'), (e) => {
        const r = document.getElementById('work').getBoundingClientRect();
        const w = SEE.clamp(r.right - e.clientX, 280, r.width - 380);
        document.getElementById('right').style.width = w + 'px'; sizes.right = w;
      }, () => { save(); this.memview.drawArrows(); });
      SEE.UI.splitter(document.getElementById('splitBottom'), (e) => {
        const r = document.getElementById('center').getBoundingClientRect();
        const hh = SEE.clamp(r.bottom - e.clientY, 80, r.height - 120);
        document.getElementById('bottom').style.height = hh + 'px'; sizes.bottom = hh;
      }, save);
    }
    buildMobile() {
      const bar = document.getElementById('mobilebar');
      this.mtabs = {};
      for (const [k, ic, label] of [['files', 'folder', 'Files'], ['code', 'edit', 'Code'], ['run', 'terminal', 'Run'], ['memory', 'chip', 'Memory']]) {
        const b = h('button', { type: 'button', id: 'mview-' + k }, icon(ic), h('span', label));
        b.addEventListener('click', () => this.setView(k));
        bar.appendChild(b);
        this.mtabs[k] = b;
      }
    }
    isPhone() { return window.innerWidth <= 720 || (window.innerHeight <= 500 && window.innerWidth <= 920); }
    setView(v) {
      if (!this.mtabs) return;
      this.view = v;
      document.getElementById('app').dataset.view = v;
      for (const [k, b] of Object.entries(this.mtabs)) b.classList.toggle('active', k === v);
      if (v === 'memory') this.renderPanels();
      if (v === 'code' && this.active) this.active.editor.render();
    }

    // ---- side: files --------------------------------------------------------------------------------
    renderSide() { SEE.Files.render(this, document.getElementById('sideBody'), document.getElementById('sideTools')); }
    renderSideSoon() { clearTimeout(this.sideTimer); this.sideTimer = setTimeout(() => this.renderSide(), 300); }

    // ---- documents --------------------------------------------------------------------------------------
    isProtected(path) { return PROTECTED.test(path || ''); }
    docByPath(p) { if (!p) return null; const k = p.toLowerCase(); return this.docs.find((d) => d.path.toLowerCase() === k) || null; }
    openFile(path, opts) {
      opts = opts || {};
      let display;
      try { display = this.vfs.abs(path); } catch (e) { return null; }
      let d = this.docByPath(display);
      if (!d) {
        let text = '';
        if (this.vfs.exists(display)) {
          if (!this.vfs.isReady(display)) { this.vfs.load(display).then(() => this.openFile(display, opts)); return null; }
          try { text = this.vfs.readText(display).replace(/\r\n?/g, '\n'); } catch (e) { SEE.UI.toast(e.message, 'err'); return null; }
        }
        d = this.createDoc(display, text);
      }
      if (!opts.noFocus || !this.active) this.activate(d); else this.renderTabs();
      if (opts.line !== undefined) setTimeout(() => { d.editor.setCursor(opts.line, opts.col || 0); d.editor.revealLine(opts.line); d.editor.flashLine(opts.line); }, 0);
      return d;
    }
    createDoc(path, text) {
      const editor = new SEE.Editor(document.getElementById('editors'), { lang: SEE.CLang, settings: this.settings });
      editor.setValue(text);
      const d = { path, editor, dirty: false, savedText: text, name: path.replace(/^.*\//, '') };
      editor.on('change', () => { d.dirty = editor.getValue() !== d.savedText; this.renderTabs(); editor.setError(null); this.sourceChanged(d); });
      editor.on('cursor', () => this.updateStatus());
      editor.on('gutter', (line) => this.toggleBreakpoint(d.path, line));
      editor.on('gutterContext', (line, e) => this.gutterMenu(d, line, e));
      editor.on('bpsShifted', (map) => { this.breakpoints.set(d.path, new Map(map)); this.breakpointsChanged(d.path); });
      editor.on('hover', (pos, x, y) => this.callout.showFor(d, pos, x, y));
      editor.on('hoverOut', () => this.callout.scheduleHide(450));
      editor.on('context', (pos, e) => this.editorMenu(d, pos, e));
      editor.setBreakpoints(this.breakpoints.get(path) || new Map());
      this.docs.push(d);
      this.applyDiagnostics(d);
      return d;
    }
    activate(d) {
      this.active = d;
      for (const x of this.docs) x.editor.show(x === d);
      this.renderTabs();
      this.updateUI();
      this.saveSession();
      this.renderSideSoon();
    }
    renderTabs() {
      const tabs = document.getElementById('tabs');
      tabs.innerHTML = '';
      const counts = new Map();
      for (const d of this.docs) counts.set(d.name, (counts.get(d.name) || 0) + 1);
      for (const d of this.docs) {
        // two tabs with the same name say which folder each is in
        const label = counts.get(d.name) > 1 ? d.name + ' · ' + (d.path.replace(/\/[^/]*$/, '').replace(/^.*\//, '') || '/') : d.name;

          h('span.tname', label), this.isProtected(d.path) ? h('span.tro', { title: 'An original: saving makes your own copy' }, 'read-only') : null, x);
        t.addEventListener('click', (e) => { if (e.target === x) { this.closeDoc(d); return; } this.activate(d); d.editor.focus(); });
        t.addEventListener('keydown', (e) => { if (e.key === 'Enter') { this.activate(d); d.editor.focus(); } });
        t.addEventListener('auxclick', (e) => { if (e.button === 1) this.closeDoc(d); });
        tabs.appendChild(t);

      const editors = document.getElementById('editors');
      let empty = editors.querySelector('.empty-editor');
      if (!this.docs.length) {
        if (!empty) {
          const nb = h('button.btn.primary', { type: 'button' }, 'New file');
          nb.addEventListener('click', () => SEE.Files.newFile(this));
          const lb = h('button.btn', { type: 'button' }, 'Example library');
          lb.addEventListener('click', () => SEE.Library && SEE.Library.browse(this));
          empty = h('div.empty-editor', h('div', h('p', 'No file open.'), h('p', nb, ' ', lb)));

    async closeDoc(d) {
      if (d.dirty) {
        let r;

          r = await SEE.UI.modal({
            title: 'Keep your changes?',
            body: h('div', h('p', 'You changed ' + d.name + ', which is one of the originals. The original stays as it was.'), h('p', 'Save your version as a file of your own?')),

    saveSession() { store.set('session', { open: this.docs.map((d) => d.path), active: this.active ? this.active.path : null }); }

      }

    saveDoc(d) {

    async save() {

    }
    saveAll() { for (const d of this.docs) if (d.dirty && !this.isProtected(d.path)) this.saveDoc(d); this.setStatus('Saved everything'); }
    autosaveAll() {
      if (!this.settings.autosave) return;
      for (const d of this.docs) if (d.dirty && !this.isProtected(d.path) && this.vfs.exists(d.path.replace(/\/[^/]*$/, '') || '/') && !/^\/mnt\//i.test(d.path)) this.saveDoc(d);
    }
    /** An original was changed: save the whole project folder as the user's own copy */
    async saveCopy(d) {
      const dir = this.projectDir(d);
      const stem = dir.replace(/^.*\//, '') || d.name.replace(/\.[^.]*$/, '');
      let n = 1, def;
      do { def = '/home/user/' + stem + (n > 1 ? '-' + n : ''); n++; } while (this.vfs.exists(def));
      const name = await SEE.UI.prompt('Save your own copy', 'Folder for your copy', def, { hint: 'This is an original, so your version goes into a folder of your own, with the other files of the project next to it.' });

      let target = name.trim();
      if (!target.startsWith('/')) target = '/home/user/' + target;

        for (const x of this.vfs.list(dir)) {

        }
      } catch (e) { SEE.UI.toast('Could not copy: ' + e.message, 'err'); return false; }

    async saveAs(d, opts) {

    }
    lineText(path, line) {

    }
    sourceChanged(d) {

        this.setStatus('You changed the code: the running program is the old version until you build again.');
      }
    }

    // ---- the project: which files make the program ----------------------------------------------------
    projectDir(d) {

      if (!d) return '/home/user';
      return d.path.replace(/\/[^/]*$/, '') || '/';
    }
    /** All .c files in the active file's folder are compiled together */
    projectFiles() {
      const dir = this.projectDir();
      const files = [];
      let list = [];
      try { list = this.vfs.list(dir); } catch (e) { list = []; }
      const seen = new Set();
      for (const x of list) {
        if (x.type !== 'file' || !isC(x.name)) continue;
        seen.add(x.path.toLowerCase());
        files.push({ path: x.path, text: this.textOf(x.path) });
      }
      // an open file that was never saved still belongs to its folder
      for (const d of this.docs) if (isC(d.path) && this.projectDir(d) === dir && !seen.has(d.path.toLowerCase())) files.push({ path: d.path, text: d.editor.getValue() });

    }
    textOf(path) {

      if (d) return d.editor.getValue();
      try { return this.vfs.readText(path); } catch (e) { return null; }
    }

    // ---- build -----------------------------------------------------------------------------------------
    build(quiet) {
      if (!this.active) { SEE.UI.toast('Open a C file first', 'err'); return null; }

      if (!files.length) { SEE.UI.toast('There is no .c file in ' + dir, 'err'); return null; }

      this.problems = res.errors.map(fmt).concat(res.warnings.map(fmt));
      const names = files.map((f) => f.path.replace(/^.*\//, ''));
      let log = 'cc -std=c89 ' + names.join(' ') + '   (in ' + dir + ')\n';
      for (const p of this.problems) log += (p.file ? p.file.replace(/^.*\//, '') + ':' + p.line + ':' + p.col + ': ' : '') + p.kind + ': ' + p.msg + '\n';
      if (res.ok) {

    }
    renderProblems() {

    // ---- running -----------------------------------------------------------------------------------------
    newMachine(prog) {

    /** Start in the debugger, paused at the first line of main; or continue when paused */

    resume(mode) {

      this.terminal.setPending('');
      this.callout.hide();
      this.clearExecMarks();
      this.running = true;
      this.setChip(mode === 'run' ? 'Running' : 'Stepping', 'running');

      this.pump();
    }
    pump() {
      clearTimeout(this.pumpTimer);
      const vm = this.vm;
      if (!vm || !this.running) return;

      if (r === 'exit') { this.onExit(); return; }
      if (r === 'fault') { this.onFault(); return; }
    }
    waitInput() {
      this.terminal.setWaiting(true);
      this.setChip('Waiting for input', 'paused');
      this.setStatus('The program is reading from stdin: type a line in the terminal and press Enter (or EOF to end the input).');
      this.updateUI();
      if (this.isPhone()) this.setView('run');
    }
    feedInput(text) {

    }
    feedEOF() {

    }
    continueAfterInput() {
      this.terminal.setWaiting(false);
      this.running = true;
      this.setChip(this.dbg && this.dbg.mode !== 'run' ? 'Stepping' : 'Running', 'running');
      this.updateUI();
      this.pump();
    }
    pause() {
      const vm = this.vm;

    }
    stop() {

      this.disposeMachine();
      this.terminal.setWaiting(false);

      this.setStatus('Program stopped.');
      this.updateUI();
      this.renderPanels();
    }
    step(mode) {
      const vm = this.vm;
